<!DOCTYPE html>
<html lang="en" class="select-none overflow-x-hidden">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Notifications — Raja Brand</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/@lottiefiles/lottie-player@latest/dist/lottie-player.js"></script>
  <style>
    :root{--primary:#FF6B35;--primary-dark:#E55A25;--primary-light:#FFE0D6;--secondary:#1A1A2E;--surface:#FFFFFF;--surface-variant:#F8F9FA;--on-surface:#1C1C1E;--outline:#E0E0E0;--success:#34C759;--warning:#FF9500;--error:#FF3B30;--info:#007AFF;}
    *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;font-family:'DM Sans',sans-serif;}
    body{background:var(--surface-variant);color:var(--on-surface);font-size:14px;line-height:1.6;padding-top:64px;padding-bottom:72px;min-height:100vh;}
    h1,h2,h3,h4,h5,h6{font-family:'Plus Jakarta Sans',sans-serif;}
    .material-symbols-rounded{font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24;vertical-align:middle;}
    .icon-fill{font-variation-settings:'FILL' 1,'wght' 400,'GRAD' 0,'opsz' 24;}
    ::-webkit-scrollbar{display:none;}
    .safe-bottom{padding-bottom:env(safe-area-inset-bottom,0px);}
    .header-blur{background:rgba(255,255,255,0.85);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);}
    .glass-nav{background:rgba(255,255,255,0.92);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);}
    .btn-press:active{transform:scale(0.96);}
  </style>
</head>
<body>
<header class="fixed top-0 left-0 right-0 z-50 header-blur border-b border-gray-100/50">
  <div class="flex items-center justify-between px-4 h-16 safe-top">
    <button onclick="window.history.back()" class="w-10 h-10 flex items-center justify-center rounded-xl hover:bg-gray-100 btn-press"><span class="material-symbols-rounded text-gray-700 text-2xl">arrow_back</span></button>
    <span class="font-bold text-base" style="font-family:'Plus Jakarta Sans',sans-serif;">Notifications</span>
    <button onclick="markAllRead()" class="text-sm font-medium px-3 py-1.5 rounded-lg hover:bg-gray-100 btn-press" style="color:var(--primary);">Mark All Read</button>
  </div>
</header>

<nav class="fixed bottom-0 left-0 right-0 z-50 glass-nav border-t border-gray-100 safe-bottom" style="padding-bottom:env(safe-area-inset-bottom,4px);">
  <div class="flex items-center justify-around h-16">
    <a href="index.html" class="flex flex-col items-center gap-0.5 min-w-[48px] py-1"><span class="material-symbols-rounded text-xl text-gray-400">home</span><span class="text-[10px] text-gray-400">Home</span></a>
    <a href="product.html" class="flex flex-col items-center gap-0.5 min-w-[48px] py-1"><span class="material-symbols-rounded text-xl text-gray-400">grid_view</span><span class="text-[10px] text-gray-400">Products</span></a>
    <a href="search.html" class="flex flex-col items-center gap-0.5 min-w-[48px] py-1"><span class="material-symbols-rounded text-xl text-gray-400">search</span><span class="text-[10px] text-gray-400">Search</span></a>
    <a href="wishlist.html" class="flex flex-col items-center gap-0.5 min-w-[48px] py-1"><span class="material-symbols-rounded text-xl text-gray-400">favorite</span><span class="text-[10px] text-gray-400">Wishlist</span></a>
    <a href="profile.html" class="flex flex-col items-center gap-0.5 min-w-[48px] py-1"><span class="material-symbols-rounded text-xl text-gray-400">person</span><span class="text-[10px] text-gray-400">Profile</span></a>
  </div>
</nav>

<div class="px-4 py-4" id="notifContent">
  <div id="emptyNotif" class="hidden flex flex-col items-center justify-center py-16">
    <lottie-player src="https://assets5.lottiefiles.com/packages/lf20_t9v9vnzm.json" background="transparent" speed="1" style="width:180px;height:180px;" loop autoplay></lottie-player>
    <p class="text-gray-500 mt-4 text-lg font-medium">All caught up!</p>
    <p class="text-gray-400 text-sm mt-1">No new notifications</p>
  </div>

  <div id="notifList" class="space-y-2"></div>
</div>

<script>
  document.addEventListener('contextmenu',e=>e.preventDefault());
  document.addEventListener('selectstart',e=>e.preventDefault());
  document.addEventListener('keydown',e=>{if(e.ctrlKey&&['u','s','a','c','p'].includes(e.key.toLowerCase()))e.preventDefault();if(e.key==='F12')e.preventDefault();});
  document.querySelectorAll('img').forEach(img=>img.setAttribute('draggable','false'));

  const STORE={notifications:'raja_notifications'};
  function getLS(k){try{return JSON.parse(localStorage.getItem(k))}catch{return null}}
  function setLS(k,v){localStorage.setItem(k,JSON.stringify(v))}

  function seedNotifs(){
    let notifs=getLS(STORE.notifications);
    if(notifs&&notifs.length>0)return;
    notifs=[
      {id:'n1',type:'order',title:'Welcome to Raja Brand!',message:'Thank you for joining. Start shopping our latest collection!',read:false,created_at:new Date(Date.now()-100000).toISOString()},
      {id:'n2',type:'offer',title:'FLASH SALE Live!',message:'Up to 50% off on electronics. Limited time only!',read:false,created_at:new Date(Date.now()-200000).toISOString()},
      {id:'n3',type:'system',title:'Free Delivery',message:'Free shipping on all orders above ₹499.',read:true,created_at:new Date(Date.now()-300000).toISOString()},
      {id:'n4',type:'offer',title:'New Arrivals',message:'Check out our latest summer collection.',read:true,created_at:new Date(Date.now()-400000).toISOString()}
    ];
    setLS(STORE.notifications,notifs);
  }
  seedNotifs();

  function renderNotifs(){
    const notifs=getLS(STORE.notifications)||[];
    const list=document.getElementById('notifList');
    const empty=document.getElementById('emptyNotif');

    if(notifs.length===0){list.innerHTML='';empty.classList.remove('hidden');return;}
    empty.classList.add('hidden');

    const iconMap={order:'shopping_bag',offer:'local_offer',system:'settings'};
    const colorMap={order:'var(--primary)',offer:'var(--warning)',system:'var(--info)'};

    list.innerHTML=notifs.map((n,i)=>`
      <div class="flex gap-3 p-4 rounded-xl ${n.read?'bg-white':'bg-orange-50 border border-orange-100'} shadow-sm border ${n.read?'border-gray-50':'border-orange-100'}" data-id="${n.id}">
        <div class="w-10 h-10 rounded-xl flex items-center justify-center flex-shrink-0" style="background:${n.read?'#f5f5f5':colorMap[n.type]+'20'};color:${n.read?'#999':colorMap[n.type]};">
          <span class="material-symbols-rounded text-xl ${n.read?'':'icon-fill'}">${iconMap[n.type]||'notifications'}</span>
        </div>
        <div class="flex-1 min-w-0">
          <div class="flex items-start justify-between gap-2">
            <h4 class="font-bold text-sm line-clamp-1">${n.title}</h4>
            <div class="flex items-center gap-1 flex-shrink-0">
              ${!n.read?'<span class="w-2 h-2 rounded-full" style="background:var(--primary);"></span>':''}
              <button onclick="deleteNotif('${n.id}')" class="w-6 h-6 flex items-center justify-center rounded-full hover:bg-gray-200 btn-press"><span class="material-symbols-rounded text-sm text-gray-400">close</span></button>
            </div>
          </div>
          <p class="text-sm text-gray-500 mt-0.5 line-clamp-2">${n.message}</p>
          <p class="text-xs text-gray-400 mt-1">${timeAgo(n.created_at)}</p>
        </div>
      </div>
    `).join('');

    const unread=notifs.filter(n=>!n.read).length;
    if(unread>0)document.title=`(${unread}) Notifications — Raja Brand`;
    else document.title='Notifications — Raja Brand';
  }

  function timeAgo(dateStr){
    const diff=Date.now()-new Date(dateStr).getTime();
    const mins=Math.floor(diff/60000);
    if(mins<1)return 'Just now';
    if(mins<60)return mins+'m ago';
    const hrs=Math.floor(mins/60);
    if(hrs<24)return hrs+'h ago';
    const days=Math.floor(hrs/24);
    return days+'d ago';
  }

  function markAllRead(){
    const notifs=getLS(STORE.notifications)||[];
    notifs.forEach(n=>n.read=true);
    setLS(STORE.notifications,notifs);
    renderNotifs();
  }

  function deleteNotif(id){
    let notifs=getLS(STORE.notifications)||[];
    notifs=notifs.filter(n=>n.id!==id);
    setLS(STORE.notifications,notifs);
    renderNotifs();
  }

  renderNotifs();
</script>
</body>
</html>
