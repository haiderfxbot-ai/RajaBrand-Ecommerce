<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Track Order - Raja</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  <script src="https://unpkg.com/@dotlottie/player-component@latest/dist/dotlottie-player.mjs" type="module"></script>
  <style>
    * { font-family: 'Plus Jakarta Sans', sans-serif; scrollbar-width: none; }
    *::-webkit-scrollbar { display: none; }
    body { overflow-x: hidden; overflow-y: auto; background: #f8fafc; }
    .brand-gradient { background: linear-gradient(135deg, #FF6B35 0%, #E65A2E 100%); }
    .brand-text { color: #FF6B35; }
    .brand-bg { background: #FF6B35; }
    .brand-light-bg { background: #FFF0E0; }
    .price-tag { font-family: 'DM Sans', sans-serif; }
    .progress-line { width: 2px; }
    .step-dot { transition: all 0.3s; }
    .status-placed { background: #FEF3C7; color: #D97706; }
    .status-confirmed { background: #DBEAFE; color: #2563EB; }
    .status-shipped { background: #E0E7FF; color: #4F46E5; }
    .status-outfordelivery { background: #FFF0E0; color: #FF6B35; }
    .status-delivered { background: #FFF0E0; color: #E65A2E; }
    .status-cancelled { background: #FEE2E2; color: #DC2626; }
  </style>
</head>
<body>

<div id="app">
  <header class="fixed top-0 left-0 right-0 z-50 bg-white border-b border-gray-100">
    <div class="flex items-center justify-between px-4 h-14">
      <div class="flex items-center gap-2">
        <button onclick="goBack()" class="p-2 -ml-2 rounded-lg hover:bg-gray-50">
          <span class="material-symbols-rounded text-gray-700 text-2xl">arrow_back</span>
        </button>
        <h1 class="text-lg font-bold text-gray-900">Track Order</h1>
      </div>
    </div>
  </header>

  <main class="pt-14 px-4 pb-8">
    <!-- Order Info Card -->
    <div id="orderInfoCard" class="mt-3 bg-white rounded-xl border border-gray-100 p-4">
      <div class="flex items-center justify-between mb-2">
        <p class="text-xs text-gray-400">Order ID</p>
        <span id="orderStatusBadge" class="text-[11px] font-semibold px-2 py-1 rounded-full"></span>
      </div>
      <p class="text-sm font-bold text-gray-800" id="orderIdDisplay"></p>
      <div class="flex items-center gap-3 mt-2 text-sm text-gray-500">
        <span class="flex items-center gap-1">
          <span class="material-symbols-rounded text-base">calendar_today</span>
          <span id="orderDateDisplay"></span>
        </span>
        <span class="flex items-center gap-1">
          <span class="material-symbols-rounded text-base">payments</span>
          <span id="orderTotalDisplay" class="font-bold brand-text price-tag"></span>
        </span>
      </div>
    </div>

    <!-- Progress Tracker -->
    <section class="mt-4 bg-white rounded-xl border border-gray-100 p-4">
      <h2 class="font-bold text-gray-900 mb-4">Order Progress</h2>
      <div class="relative" id="progressTracker">
        <div class="absolute left-[15px] top-3 bottom-3 w-0.5 bg-gray-200" id="progressLineBg"></div>
        <div class="absolute left-[15px] top-3 w-0.5 brand-bg transition-all duration-500" id="progressLineFill" style="height: 0%"></div>
        <div class="space-y-0" id="stepsContainer"></div>
      </div>
    </section>

    <!-- Items in Order -->
    <section class="mt-4 bg-white rounded-xl border border-gray-100 p-4">
      <h2 class="font-bold text-gray-900 mb-3">Items in Order</h2>
      <div id="orderItemsList" class="space-y-2"></div>
    </section>

    <!-- Delivery Address -->
    <section class="mt-4 bg-white rounded-xl border border-gray-100 p-4">
      <h2 class="font-bold text-gray-900 mb-3 flex items-center gap-2">
        <span class="material-symbols-rounded brand-text">location_on</span> Delivery Address
      </h2>
      <div id="deliveryAddressDisplay" class="text-sm text-gray-600 space-y-1"></div>
    </section>
  </main>
</div>

<script>
function formatPrice(amount) {
  return 'Rs. ' + Number(amount).toLocaleString('en-PK');
}

function getCurrentUser() {
  const data = localStorage.getItem('raja_current_user');
  return data ? JSON.parse(data) : null;
}

function goBack() { window.history.back(); }

function authGuard() {
  const user = getCurrentUser();
  if (!user) {
    window.location.href = 'login.html?redirect=order-track.html' + (window.location.search || '');
    return false;
  }
  return true;
}

function formatDate(d) {
  const date = new Date(d);
  return date.toLocaleDateString('en-PK', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
}

const STAGES = [
  { key: 'placed', label: 'Order Placed', icon: 'check_circle' },
  { key: 'confirmed', label: 'Confirmed', icon: 'fact_check' },
  { key: 'shipped', label: 'Shipped', icon: 'local_shipping' },
  { key: 'outfordelivery', label: 'Out for Delivery', icon: 'directions_car' },
  { key: 'delivered', label: 'Delivered', icon: 'home' }
];

function getStatusText(status) {
  const map = {
    'placed': 'Order Placed',
    'confirmed': 'Confirmed',
    'shipped': 'Shipped',
    'outfordelivery': 'Out for Delivery',
    'delivered': 'Delivered',
    'cancelled': 'Cancelled'
  };
  return map[status] || status;
}

function getStatusClass(status) {
  return 'status-' + status;
}

function getStageIndex(status) {
  const idx = STAGES.findIndex(s => s.key === status);
  return idx >= 0 ? idx : -1;
}

function renderTracking() {
  if (!authGuard()) return;

  const params = new URLSearchParams(window.location.search);
  const orderId = params.get('id');

  if (!orderId) {
    document.getElementById('orderInfoCard').innerHTML = '<p class="text-red-500 text-sm">No order ID provided.</p>';
    return;
  }

  const orders = JSON.parse(localStorage.getItem('raja_orders') || '[]');
  const user = getCurrentUser();
  const order = orders.find(o => o.id === orderId && o.userId === (user.id || user.email));

  if (!order) {
    document.getElementById('orderInfoCard').innerHTML = '<p class="text-red-500 text-sm">Order not found.</p>';
    return;
  }

  // Order Info
  document.getElementById('orderIdDisplay').textContent = order.id;
  document.getElementById('orderDateDisplay').textContent = formatDate(order.date);
  document.getElementById('orderTotalDisplay').textContent = formatPrice(order.total);

  const statusBadge = document.getElementById('orderStatusBadge');
  statusBadge.textContent = getStatusText(order.status);
  statusBadge.className = 'text-[11px] font-semibold px-2 py-1 rounded-full ' + getStatusClass(order.status);

  // Progress Tracker
  const currentIdx = getStageIndex(order.status);
  const stepsContainer = document.getElementById('stepsContainer');
  const isCancelled = order.status === 'cancelled';

  stepsContainer.innerHTML = STAGES.map((stage, idx) => {
    const completed = idx <= currentIdx && !isCancelled;
    const active = idx === currentIdx && !isCancelled;
    const timelineEntry = order.timeline ? order.timeline.find(t => t.stage === stage.key) : null;
    const dateStr = timelineEntry && timelineEntry.date ? formatDate(timelineEntry.date) : '';
    return `
      <div class="flex gap-3 ${idx < STAGES.length - 1 ? 'pb-6' : ''} relative">
        <div class="flex flex-col items-center">
          <div class="step-dot w-[30px] h-[30px] rounded-full flex items-center justify-center z-10 ${completed ? 'brand-bg text-white' : active ? 'brand-bg text-white ring-4 ring-orange-100' : 'bg-gray-200 text-gray-400'}">
            <span class="material-symbols-rounded text-sm">${completed || active ? 'check' : 'radio_button_unchecked'}</span>
          </div>
          ${idx < STAGES.length - 1 ? `<div class="w-0.5 flex-1 mt-1 ${completed ? 'brand-bg' : 'bg-gray-200'}" style="min-height: 20px;"></div>` : ''}
        </div>
        <div class="pt-1">
          <p class="text-sm font-semibold ${completed || active ? 'text-gray-900' : 'text-gray-400'}">${stage.label}</p>
          ${dateStr ? `<p class="text-xs text-gray-400 mt-0.5">${dateStr}</p>` : ''}
        </div>
        ${active ? `<span class="material-symbols-rounded brand-text text-lg ml-auto">chevron_right</span>` : ''}
      </div>
    `;
  }).join('');

  if (isCancelled) {
    stepsContainer.innerHTML += `
      <div class="flex gap-3 pt-2">
        <div class="step-dot w-[30px] h-[30px] rounded-full flex items-center justify-center z-10 bg-red-500 text-white">
          <span class="material-symbols-rounded text-sm">cancel</span>
        </div>
        <div class="pt-1">
          <p class="text-sm font-semibold text-red-500">Cancelled</p>
          <p class="text-xs text-gray-400 mt-0.5">${order.date ? formatDate(order.date) : ''}</p>
        </div>
      </div>
    `;
  }

  // Items
  const itemsList = document.getElementById('orderItemsList');
  itemsList.innerHTML = order.items.map(item => `
    <div class="flex items-center gap-3">
      <div class="w-14 h-14 rounded-lg bg-gray-50 overflow-hidden flex-shrink-0">
        <img src="${item.image || 'https://picsum.photos/seed/torder/400/500'}" alt="${item.name}" class="w-full h-full object-cover" onerror="this.src='https://picsum.photos/seed/terr/400/500'">
      </div>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium text-gray-800">${item.name}</p>
        <p class="text-xs text-gray-400">Qty: ${item.quantity || 1} x ${formatPrice(item.price || 0)}</p>
      </div>
      <span class="text-sm font-bold brand-text price-tag">${formatPrice((item.price || 0) * (item.quantity || 1))}</span>
    </div>
  `).join('');

  // Address
  const addr = order.address;
  if (addr) {
    const addrDisplay = document.getElementById('deliveryAddressDisplay');
    addrDisplay.innerHTML = `
      <p class="font-medium text-gray-800">${addr.name}</p>
      <p>${addr.phone}${addr.email ? ' | ' + addr.email : ''}</p>
      <p>${addr.address}, ${addr.city}</p>
      <p>${addr.province}${addr.postal ? ' - ' + addr.postal : ''}</p>
    `;
  }
}

window.addEventListener('DOMContentLoaded', renderTracking);
</script>
</body>
</html>
