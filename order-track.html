<!DOCTYPE html>
<html lang="en" class="select-none overflow-x-hidden">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Order Tracker — Raja Brand</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{--primary:#FF6B35;--primary-dark:#E55A25;--primary-light:#FFE0D6;--secondary:#1A1A2E;--surface:#FFFFFF;--surface-variant:#F8F9FA;--on-surface:#1C1C1E;--outline:#E0E0E0;--success:#34C759;--warning:#FF9500;--error:#FF3B30;--info:#007AFF;}
    *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;font-family:'DM Sans',sans-serif;}
    body{background:var(--surface-variant);color:var(--on-surface);font-size:14px;line-height:1.6;padding-top:64px;padding-bottom:72px;}
    h1,h2,h3,h4,h5,h6{font-family:'Plus Jakarta Sans',sans-serif;}
    .material-symbols-rounded{font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24;vertical-align:middle;}
    .icon-fill{font-variation-settings:'FILL' 1,'wght' 400,'GRAD' 0,'opsz' 24;}
    ::-webkit-scrollbar{display:none;}
    .safe-bottom{padding-bottom:env(safe-area-inset-bottom,0px);}
    .btn-press:active{transform:scale(0.96);}
    .track-circle{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;position:relative;z-index:2;transition:all .5s ease;}
    .track-line{width:3px;flex:1;margin:4px auto;transition:all .5s ease;position:relative;z-index:1;}
    .pulse-ring{animation:pulse 2s infinite;}
    @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,107,53,0.4)}70%{box-shadow:0 0 0 12px rgba(255,107,53,0)}100%{box-shadow:0 0 0 0 rgba(255,107,53,0)}}
    @keyframes checkPop{0%{transform:scale(0)}50%{transform:scale(1.2)}100%{transform:scale(1)}}
    .check-anim{animation:checkPop .3s ease;}
  </style>
</head>
<body>
<header class="fixed top-0 left-0 right-0 z-50 bg-white/90 backdrop-blur-xl border-b border-gray-100/50">
  <div class="flex items-center justify-between px-4 h-16 safe-top">
    <button onclick="window.history.back()" class="w-10 h-10 flex items-center justify-center rounded-xl hover:bg-gray-100 btn-press"><span class="material-symbols-rounded text-gray-700 text-2xl">arrow_back</span></button>
    <span class="font-bold text-base" style="font-family:'Plus Jakarta Sans',sans-serif;">Track Order</span>
    <div class="w-10"></div>
  </div>
</header>

<main class="px-4 py-4" id="trackContent">
  <div id="orderNotFound" class="hidden flex flex-col items-center justify-center py-16">
    <span class="material-symbols-rounded text-6xl text-gray-300">search_off</span>
    <p class="text-gray-500 mt-4 text-sm">Order not found</p>
    <a href="orders.html" class="mt-3 px-6 py-2.5 rounded-xl text-sm font-bold text-white btn-press" style="background:var(--primary);">View My Orders</a>
  </div>

  <div id="orderDetails">
    <div class="p-4 rounded-xl bg-white shadow-sm border border-gray-50 mb-4">
      <div class="flex items-center justify-between mb-2">
        <span class="text-xs font-mono text-gray-400" id="trackOrderId"></span>
        <span class="text-xs text-gray-400" id="trackOrderDate"></span>
      </div>
      <div class="flex items-center gap-2"><span class="font-bold text-lg" id="trackTotal"></span></div>
      <p class="text-xs text-gray-500 mt-1" id="trackAddress"></p>
    </div>

    <div class="p-4 rounded-xl bg-white shadow-sm border border-gray-50 mb-4">
      <h3 class="text-sm font-bold mb-3">Delivery Status</h3>
      <div class="flex flex-col items-start gap-0" id="progressTrack"></div>
    </div>

    <div class="p-4 rounded-xl bg-white shadow-sm border border-gray-50 mb-4">
      <h3 class="text-sm font-bold mb-3">Items</h3>
      <div id="trackItems"></div>
    </div>

    <div class="p-4 rounded-xl bg-white shadow-sm border border-gray-50 mb-4" id="deliveryPartner" style="display:none;">
      <h3 class="text-sm font-bold mb-3">Delivery Partner</h3>
      <div class="flex items-center justify-between">
        <div>
          <p class="font-medium">SpeedX Courier</p>
          <p class="text-xs text-gray-400">Tracking: SPX-${Math.random().toString(36).substring(2,8).toUpperCase()}</p>
        </div>
        <button class="px-4 py-2 rounded-lg text-xs font-bold text-white btn-press" style="background:var(--primary);">Call Driver</button>
      </div>
    </div>
  </div>
</main>

<script>
  document.addEventListener('contextmenu',e=>e.preventDefault());
  document.addEventListener('selectstart',e=>e.preventDefault());
  document.addEventListener('keydown',e=>{if(e.ctrlKey&&['u','s','a','c','p'].includes(e.key.toLowerCase()))e.preventDefault();if(e.key==='F12')e.preventDefault();});
  document.querySelectorAll('img').forEach(img=>img.setAttribute('draggable','false'));

  const STORE={users:'raja_users',currentUser:'raja_current_user',products:'raja_products',categories:'raja_categories',orders:'raja_orders',cart:'raja_cart',wishlist:'raja_wishlist'};
  function getLS(k){try{return JSON.parse(localStorage.getItem(k))}catch{return null}}

  const params=new URLSearchParams(window.location.search);
  const orderId=params.get('id');
  const orders=getLS(STORE.orders)||[];
  const order=orders.find(o=>o.id===orderId);

  if(!order){
    document.getElementById('orderDetails').style.display='none';
    document.getElementById('orderNotFound').classList.remove('hidden');
  }else{
    document.getElementById('trackOrderId').textContent=order.id;
    document.getElementById('trackOrderDate').textContent=new Date(order.created_at).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'});
    document.getElementById('trackTotal').textContent=`₹${order.total.toLocaleString()}`;
    const addr=order.address;
    document.getElementById('trackAddress').textContent=`Deliver to: ${addr.name}, ${addr.line1}, ${addr.city}, ${addr.state} - ${addr.pincode}`;

    const stages=[
      {key:'Placed',icon:'receipt_long',label:'Order Placed'},
      {key:'Confirmed',icon:'verified',label:'Order Confirmed'},
      {key:'Dispatched',icon:'local_shipping',label:'Dispatched'},
      {key:'Out for Delivery',icon:'delivery_dining',label:'Out for Delivery'},
      {key:'Delivered',icon:'check_circle',label:'Delivered'}
    ];
    const statusOrder=['Placed','Confirmed','Dispatched','Out for Delivery','Delivered'];
    let currentIdx=statusOrder.indexOf(order.status);
    if(currentIdx<0)currentIdx=order.status==='Cancelled'?-1:0;

    const user=getLS(STORE.currentUser);
    if(currentIdx>=0){
      document.getElementById('deliveryPartner').style.display=currentIdx>=2?'block':'none';
    }

    const track=document.getElementById('progressTrack');
    track.innerHTML=stages.map((s,i)=>{
      const isDone=i<=currentIdx;
      const isCurrent=i===currentIdx&&order.status!=='Cancelled';
      const isCancelled=order.status==='Cancelled';
      let circleColor,lineColor,textColor;
      if(isCancelled&&currentIdx<0){
        circleColor='bg-gray-200 text-gray-400';lineColor='bg-gray-200';textColor='text-gray-400';
      }else if(isDone&&isCurrent){
        circleColor='bg-white border-2';textColor='text-gray-700';
      }else if(isDone){
        circleColor='bg-green-500 text-white';lineColor='bg-green-500';textColor='text-gray-700';
      }else{
        circleColor='bg-gray-100 text-gray-400 border-2 border-gray-200';lineColor='bg-gray-200';textColor='text-gray-400';
      }

      return `<div class="flex items-start gap-4 w-full">
        <div class="flex flex-col items-center">
          <div class="track-circle ${circleColor} ${isCurrent?'border-orange-500 pulse-ring':''} ${isDone&&!isCurrent?'check-anim':''}" style="${isCurrent?'border-color:var(--primary);':''}">
            ${isDone&&!isCurrent?'<span class="material-symbols-rounded icon-fill text-lg">check</span>':`<span class="material-symbols-rounded text-lg">${s.icon}</span>`}
          </div>
          ${i<stages.length-1?`<div class="track-line ${lineColor}" style="min-height:24px;"></div>`:''}
        </div>
        <div class="pb-6 flex-1">
          <p class="font-bold text-sm ${textColor}">${s.label}</p>
          <p class="text-xs text-gray-400 mt-0.5">
            ${isDone&&isCurrent?getStatusTime():isDone?getStatusTime(i):'Pending'}
          </p>
        </div>
      </div>`;
    }).join('');

    function getStatusTime(idx){
      if(idx!==undefined){
        if(order.status_history&&order.status_history[idx]){
          const d=new Date(order.status_history[idx].timestamp);
          return d.toLocaleDateString('en-IN',{day:'numeric',month:'short'})+' • '+d.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'});
        }
        return 'Completed';
      }
      if(order.status_history){
        const last=order.status_history[order.status_history.length-1];
        if(last){
          const d=new Date(last.timestamp);
          return d.toLocaleDateString('en-IN',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
        }
      }
      return 'In progress';
    }

    const itemsContainer=document.getElementById('trackItems');
    itemsContainer.innerHTML=order.items.map(item=>`
      <div class="flex gap-3 py-2 border-b border-gray-50 last:border-0">
        <div class="w-12 h-12 rounded-lg overflow-hidden bg-gray-50 flex-shrink-0"><img src="${item.image}" alt="${item.name}" class="w-full h-full object-cover" loading="lazy"></div>
        <div class="flex-1 min-w-0"><p class="text-sm font-medium line-clamp-1">${item.name}</p><p class="text-xs text-gray-400">Qty: ${item.quantity}</p><span class="text-sm font-bold">₹${(item.price*item.quantity).toLocaleString()}</span></div>
      </div>
    `).join('');
  }
</script>
</body>
</html>
