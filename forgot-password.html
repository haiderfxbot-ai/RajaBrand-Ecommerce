<!DOCTYPE html>
<html lang="en" class="select-none overflow-x-hidden">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Reset Password — Raja Brand</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=DM+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
  <style>
    :root{--primary:#FF6B35;--primary-dark:#E55A25;--primary-light:#FFE0D6;--secondary:#1A1A2E;--surface:#FFFFFF;--surface-variant:#F8F9FA;--on-surface:#1C1C1E;--outline:#E0E0E0;--success:#34C759;--warning:#FF9500;--error:#FF3B30;--info:#007AFF;}
    *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;font-family:'DM Sans',sans-serif;}
    body{background:var(--surface-variant);color:var(--on-surface);font-size:14px;line-height:1.6;min-height:100vh;display:flex;flex-direction:column;}
    h1,h2,h3,h4,h5,h6{font-family:'Plus Jakarta Sans',sans-serif;}
    .material-symbols-rounded{font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24;vertical-align:middle;}
    .icon-fill{font-variation-settings:'FILL' 1,'wght' 400,'GRAD' 0,'opsz' 24;}
    ::-webkit-scrollbar{display:none;}
    .safe-bottom{padding-bottom:env(safe-area-inset-bottom,0px);}
    .btn-press:active{transform:scale(0.96);}
    .toast{position:fixed;top:80px;right:16px;z-index:9999;padding:12px 20px;border-radius:12px;color:#fff;font-weight:500;box-shadow:0 4px 24px rgba(0,0,0,0.15);transform:translateX(120%);transition:transform .3s;max-width:320px;}
    .toast.show{transform:translateX(0);}
    .toast.success{background:var(--success);}
    .toast.error{background:var(--error);}
    .toast.info{background:var(--info);}
    .toast.warning{background:var(--warning);}
    @keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
    .anim-fade{animation:fadeUp .35s ease;}
    .step-indicator{display:flex;align-items:center;justify-content:center;gap:0;margin-bottom:32px;}
    .step-dot{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;transition:all .3s;font-family:'Plus Jakarta Sans',sans-serif;}
    .step-dot.active{background:var(--primary);color:#fff;}
    .step-dot.done{background:var(--success);color:#fff;}
    .step-dot.pending{background:#e0e0e0;color:#999;}
    .step-line{width:48px;height:3px;border-radius:2px;transition:all .3s;}
    .step-line.active{background:var(--primary);}
    .step-line.done{background:var(--success);}
    .step-line.pending{background:#e0e0e0;}
    .step-label{font-size:11px;font-weight:500;color:#999;text-align:center;position:absolute;top:44px;left:50%;transform:translateX(-50%);white-space:nowrap;}
    .step-wrapper{position:relative;display:flex;flex-direction:column;align-items:center;}
    .otp-input{width:48px;height:56px;text-align:center;font-size:24px;font-weight:700;font-family:'JetBrains Mono',monospace;border-radius:12px;border:2px solid var(--outline);outline:none;transition:all .2s;caret-color:var(--primary);}
    .otp-input:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-light);}
    .otp-input.filled{border-color:var(--primary);background:var(--primary-light);}
    .strength-bar{height:4px;border-radius:2px;transition:all .3s;}
    .step-panel{display:none;animation:fadeUp .35s ease;}
    .step-panel.active{display:block;}
  </style>
</head>
<body>
<div id="toastContainer"></div>

<div class="flex-1 flex flex-col justify-center px-6 py-8 max-w-md mx-auto w-full">
  <div class="text-center mb-6">
    <div class="flex items-center justify-center gap-2 mb-2">
      <span class="text-3xl font-extrabold tracking-tight" style="color:var(--primary);font-family:'Plus Jakarta Sans',sans-serif;">RAJA</span>
      <span class="text-xl font-semibold" style="color:var(--secondary);font-family:'Plus Jakarta Sans',sans-serif;">Brand</span>
    </div>
    <p class="text-sm text-gray-500">Reset your password</p>
  </div>

  <div class="step-indicator">
    <div class="step-wrapper">
      <div class="step-dot active" id="step1Dot">1</div>
      <span class="step-label">Email</span>
    </div>
    <div class="step-line pending" id="step1Line"></div>
    <div class="step-wrapper">
      <div class="step-dot pending" id="step2Dot">2</div>
      <span class="step-label">OTP</span>
    </div>
    <div class="step-line pending" id="step2Line"></div>
    <div class="step-wrapper">
      <div class="step-dot pending" id="step3Dot">3</div>
      <span class="step-label">New Password</span>
    </div>
  </div>

  <div class="step-panel active" id="step1Panel">
    <div class="space-y-4">
      <div>
        <label class="text-sm font-medium mb-1 block">Email Address</label>
        <input type="email" id="resetEmail" placeholder="you@email.com" class="w-full px-3 py-2.5 rounded-xl border border-gray-200 text-sm focus:outline-none focus:border-orange-400">
        <p class="text-xs mt-1 hidden" id="resetEmailErr" style="color:var(--error);">Please enter a valid email</p>
      </div>
      <button onclick="sendResetOTP()" class="w-full py-3 rounded-xl text-sm font-bold text-white btn-press flex items-center justify-center gap-2" style="background:var(--primary);" id="sendOtpBtn">Send OTP <span class="material-symbols-rounded">mail</span></button>
      <p class="text-xs text-center text-gray-400"><a href="login.html" style="color:var(--primary);">Back to Login</a></p>
    </div>
  </div>

  <div class="step-panel" id="step2Panel">
    <div class="text-center mb-4">
      <p class="text-sm text-gray-500">Enter the 6-digit code sent to</p>
      <p class="text-sm font-bold" id="resetOtpEmail" style="color:var(--primary);"></p>
    </div>
    <div class="flex justify-center gap-2.5 mb-6">
      <input type="text" class="otp-input" maxlength="1" inputmode="numeric" pattern="[0-9]" id="rotp1">
      <input type="text" class="otp-input" maxlength="1" inputmode="numeric" pattern="[0-9]" id="rotp2">
      <input type="text" class="otp-input" maxlength="1" inputmode="numeric" pattern="[0-9]" id="rotp3">
      <input type="text" class="otp-input" maxlength="1" inputmode="numeric" pattern="[0-9]" id="rotp4">
      <input type="text" class="otp-input" maxlength="1" inputmode="numeric" pattern="[0-9]" id="rotp5">
      <input type="text" class="otp-input" maxlength="1" inputmode="numeric" pattern="[0-9]" id="rotp6">
    </div>
    <button onclick="verifyResetOTP()" class="w-full py-3 rounded-xl text-sm font-bold text-white btn-press" style="background:var(--primary);" id="verifyOtpBtn">Verify OTP</button>
    <button onclick="resendResetOTP()" id="resendResetBtn" class="w-full mt-3 py-2 rounded-xl text-sm font-medium btn-press border border-gray-200" disabled style="opacity:0.5;">Resend OTP (<span id="resendTimer">60</span>s)</button>
  </div>

  <div class="step-panel" id="step3Panel">
    <div class="space-y-4">
      <div>
        <label class="text-sm font-medium mb-1 block">New Password</label>
        <div class="relative">
          <input type="password" id="newResetPass" placeholder="At least 6 characters" class="w-full px-3 py-2.5 pr-10 rounded-xl border border-gray-200 text-sm focus:outline-none focus:border-orange-400" oninput="checkResetStrength()">
          <button onclick="togglePass('newResetPass',this)" class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 btn-press" type="button"><span class="material-symbols-rounded text-lg">visibility_off</span></button>
        </div>
        <div class="strength-bar mt-1" id="resetStrengthBar"></div>
        <p class="text-xs text-gray-400 mt-1" id="resetStrengthLabel"></p>
      </div>
      <div>
        <label class="text-sm font-medium mb-1 block">Confirm New Password</label>
        <div class="relative">
          <input type="password" id="confirmResetPass" placeholder="Repeat password" class="w-full px-3 py-2.5 pr-10 rounded-xl border border-gray-200 text-sm focus:outline-none focus:border-orange-400" oninput="checkResetMatch()">
          <button onclick="togglePass('confirmResetPass',this)" class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 btn-press" type="button"><span class="material-symbols-rounded text-lg">visibility_off</span></button>
        </div>
        <p class="text-xs mt-1 hidden" id="resetConfirmErr" style="color:var(--error);">Passwords do not match</p>
      </div>
      <button onclick="saveNewPassword()" class="w-full py-3 rounded-xl text-sm font-bold text-white btn-press flex items-center justify-center gap-2" style="background:var(--primary);" id="savePassBtn">Reset Password <span class="material-symbols-rounded">lock_reset</span></button>
    </div>
  </div>
</div>

<script>
  document.addEventListener('contextmenu',e=>e.preventDefault());
  document.addEventListener('selectstart',e=>e.preventDefault());
  document.addEventListener('keydown',e=>{if(e.ctrlKey&&['u','s','a','c','p'].includes(e.key.toLowerCase()))e.preventDefault();if(e.key==='F12')e.preventDefault();});

  const RAJA_CONFIG={
    emailjs_public_key:'y1nL04AHOFQQ7iffn',
    emailjs_service_id:'service_94ybwiy',
    emailjs_otp_template:'template_5e0vk2h',
    emailjs_reset_template:'template_6sme6br'
  };

  emailjs.init(RAJA_CONFIG.emailjs_public_key);

  const STORE={users:'raja_users'};
  function getLS(k){try{return JSON.parse(localStorage.getItem(k))}catch{return null}}
  function setLS(k,v){localStorage.setItem(k,JSON.stringify(v))}

  let resetEmail='';
  let resetOTP='';
  let resetTimer=60;
  let resetTimerInterval=null;

  function showToast(msg,type='success'){
    const c=document.getElementById('toastContainer');
    const t=document.createElement('div');t.className=`toast ${type}`;t.textContent=msg;
    c.appendChild(t);requestAnimationFrame(()=>t.classList.add('show'));
    setTimeout(()=>{t.classList.remove('show');setTimeout(()=>t.remove(),300);},3000);
  }

  function togglePass(id,btn){
    const inp=document.getElementById(id);
    const isPass=inp.type==='password';
    inp.type=isPass?'text':'password';
    btn.querySelector('span').textContent=isPass?'visibility':'visibility_off';
  }

  function updateStep(step){
    for(let i=1;i<=3;i++){
      const dot=document.getElementById(`step${i}Dot`);
      const line=document.getElementById(`step${i}Line`);
      const panel=document.getElementById(`step${i}Panel`);
      if(i<step){dot.className='step-dot done';dot.textContent='✓';if(line)line.className='step-line done';}
      else if(i===step){dot.className='step-dot active';if(line)line.className='step-line active';panel.classList.add('active');}
      else{dot.className='step-dot pending';if(line)line.className='step-line pending';panel.classList.remove('active');}
    }
  }

  function sendResetOTP(){
    const email=document.getElementById('resetEmail').value.trim();
    if(!email||!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){
      document.getElementById('resetEmailErr').classList.remove('hidden');return;
    }
    document.getElementById('resetEmailErr').classList.add('hidden');
    const users=getLS(STORE.users)||[];
    const user=users.find(u=>u.email===email);
    if(!user){showToast('No account found with this email','error');return;}
    if(user.provider==='google'){showToast('Google accounts use Google Sign-In. Reset not available.','warning');return;}

    resetEmail=email;
    resetOTP=String(Math.floor(100000+Math.random()*900000));
    document.getElementById('sendOtpBtn').disabled=true;
    document.getElementById('sendOtpBtn').innerHTML='<span class="material-symbols-rounded animate-spin">progress_activity</span> Sending...';

    const params={
      to_email:email,
      to_name:user.name||'User',
      otp_code:resetOTP,
      from_name:'Raja Brand',
      reply_to:'rajahaider9053@gmail.com'
    };
    emailjs.send(RAJA_CONFIG.emailjs_service_id,RAJA_CONFIG.emailjs_reset_template,params)
      .then(()=>{
        showToast('OTP sent to your email','success');
        updateStep(2);
        document.getElementById('resetOtpEmail').textContent=email;
        startResetTimer();
        setTimeout(()=>document.getElementById('rotp1').focus(),400);
      })
      .catch(()=>{
        showToast('Failed to send OTP. Check EmailJS config.','error');
      })
      .finally(()=>{
        document.getElementById('sendOtpBtn').disabled=false;
        document.getElementById('sendOtpBtn').innerHTML='Send OTP <span class="material-symbols-rounded">mail</span>';
      });
  }

  function startResetTimer(){
    resetTimer=60;
    if(resetTimerInterval)clearInterval(resetTimerInterval);
    document.getElementById('resendResetBtn').disabled=true;
    document.getElementById('resendResetBtn').style.opacity='0.5';
    updateResendTimerDisplay();
    resetTimerInterval=setInterval(()=>{
      resetTimer--;
      updateResendTimerDisplay();
      if(resetTimer<=0){
        clearInterval(resetTimerInterval);
        document.getElementById('resendResetBtn').disabled=false;
        document.getElementById('resendResetBtn').style.opacity='1';
      }
    },1000);
  }

  function updateResendTimerDisplay(){
    document.getElementById('resendTimer').textContent=resetTimer;
  }

  function resendResetOTP(){
    if(!resetEmail)return;
    resetOTP=String(Math.floor(100000+Math.random()*900000));
    const users=getLS(STORE.users)||[];
    const user=users.find(u=>u.email===resetEmail);
    const params={
      to_email:resetEmail,
      to_name:user?user.name:'User',
      otp_code:resetOTP,
      from_name:'Raja Brand',
      reply_to:'rajahaider9053@gmail.com'
    };
    emailjs.send(RAJA_CONFIG.emailjs_service_id,RAJA_CONFIG.emailjs_reset_template,params)
      .then(()=>{showToast('New OTP sent!','info');startResetTimer();})
      .catch(()=>{showToast('Failed to resend OTP','error');});
  }

  const rotpInputs=['rotp1','rotp2','rotp3','rotp4','rotp5','rotp6'];
  rotpInputs.forEach((id,i)=>{
    const inp=document.getElementById(id);
    inp.addEventListener('input',function(){
      if(this.value&&i<5)document.getElementById(rotpInputs[i+1]).focus();
      this.classList.toggle('filled',!!this.value);
    });
    inp.addEventListener('keydown',function(e){
      if(e.key==='Backspace'&&!this.value&&i>0){
        document.getElementById(rotpInputs[i-1]).focus();
        document.getElementById(rotpInputs[i-1]).value='';
        document.getElementById(rotpInputs[i-1]).classList.remove('filled');
      }
      if(e.key==='Enter')verifyResetOTP();
    });
  });

  function verifyResetOTP(){
    const otp=rotpInputs.map(id=>document.getElementById(id).value).join('');
    if(otp.length!==6){showToast('Enter complete 6-digit OTP','warning');return;}
    if(otp!==resetOTP){showToast('Incorrect OTP. Try again.','error');return;}
    clearInterval(resetTimerInterval);
    updateStep(3);
    setTimeout(()=>document.getElementById('newResetPass').focus(),400);
  }

  function checkResetStrength(){
    const p=document.getElementById('newResetPass').value;
    const bar=document.getElementById('resetStrengthBar');
    const label=document.getElementById('resetStrengthLabel');
    let score=0;
    if(p.length>=6)score++;if(p.length>=10)score++;
    if(/[A-Z]/.test(p))score++;if(/[0-9]/.test(p))score++;
    if(/[^A-Za-z0-9]/.test(p))score++;
    const map=['','bg-red-500','bg-orange-500','bg-yellow-500','bg-green-500','bg-green-600'];
    const texts=['','Weak','Fair','Good','Strong','Very Strong'];
    bar.style.width=score*20+'%';
    bar.style.background=map[score]||'#ddd';
    label.textContent=texts[score]||'';
  }

  function checkResetMatch(){
    const p=document.getElementById('newResetPass').value;
    const c=document.getElementById('confirmResetPass').value;
    const err=document.getElementById('resetConfirmErr');
    if(c&&p!==c){err.classList.remove('hidden');return false;}
    err.classList.add('hidden');return true;
  }

  function saveNewPassword(){
    const newp=document.getElementById('newResetPass').value;
    const confirm=document.getElementById('confirmResetPass').value;
    if(newp.length<6){showToast('Password must be at least 6 characters','error');return;}
    if(newp!==confirm){showToast('Passwords do not match','error');return;}

    const users=getLS(STORE.users)||[];
    const idx=users.findIndex(u=>u.email===resetEmail);
    if(idx>=0){users[idx].password=newp;setLS(STORE.users,users);}
    showToast('Password reset successfully!','success');
    setTimeout(()=>window.location.href='login.html',1200);
  }
</script>
</body>
</html>
