<!DOCTYPE html>

    .brand-gradient { background: linear-gradient(135deg, #16A34A 0%, #15803D 100%); }

    .brand-bg { background: #16A34A; }

<script>
function formatPrice(amount) {
  return 'Rs. ' + Number(amount).toLocaleString('en-PK');
}

function goToProduct(id) {
  localStorage.setItem('raja_selected_product', id);
  window.location.href = 'product-detail.html?id=' + id;
}

function getCartCount() {
  const cart = JSON.parse(localStorage.getItem('raja_cart') || '[]');
  return cart.reduce((sum, item) => sum + (item.quantity || 1), 0);
}

function updateCartBadge() {
  const count = getCartCount();
  const badge = document.getElementById('cartBadge');
  if (badge) {
    badge.textContent = count;
    badge.classList.toggle('hidden', count === 0);
  }
}

function getVideoEmbed(url) {
  if (!url) return '';
  if (url.includes('youtube.com') || url.includes('youtu.be')) {
    const id = url.includes('youtu.be') ? url.split('/').pop().split('?')[0] : new URL(url).searchParams.get('v');
    if (id) return 'https://www.youtube.com/embed/' + id;
  }
  if (url.includes('dailymotion.com')) {
    const parts = url.split('/');
    const id = parts[parts.length - 1].split('_')[0].split('?')[0];
    if (id) return 'https://www.dailymotion.com/embed/video/' + id;
  }
  if (url.includes('vimeo.com')) {
    const id = url.split('/').pop().split('?')[0];
    if (id) return 'https://player.vimeo.com/video/' + id;
  }
  if (url.match(/\.(mp4|webm|ogg)(\?|$)/i)) return url;
  return url;
}

let currentProduct = null;
let currentQuantity = 1;
let inWishlist = false;

function getCurrentProduct() {
  const params = new URLSearchParams(window.location.search);
  let id = params.get('id');
  if (!id) id = localStorage.getItem('raja_selected_product');
  if (!id) id = 'p1';
  const products = JSON.parse(localStorage.getItem('raja_products') || '[]');
  return products.find(p => p.id === id) || products[0];
}

function changeQty(delta) {
  currentQuantity = Math.max(1, currentQuantity + delta);
  document.getElementById('quantityDisplay').textContent = currentQuantity;
}

function renderProductPage() {
  seedDataIfEmpty();
  updateCartBadge();

  currentProduct = getCurrentProduct();
  if (!currentProduct) {
    document.getElementById('productName').textContent = 'Product not found';
    return;
  }

  const p = currentProduct;

  // Images
  const images = p.images && p.images.length > 0 ? p.images : [p.image];
  document.getElementById('mainImage').src = images[0];

  const thumbRow = document.getElementById('thumbnailRow');
  thumbRow.innerHTML = images.map((img, i) => `
    <div onclick="showImage('${img}', ${i})" class="flex-shrink-0 w-16 h-16 rounded-lg border-2 ${i === 0 ? 'border-green-500' : 'border-gray-200'} overflow-hidden cursor-pointer">
      <img src="${img}" class="w-full h-full object-cover" onerror="this.src='https://picsum.photos/seed/thumb${i}/400/500'">
    </div>
  `).join('');

  // Video support
  if (p.video_url) {
    thumbRow.innerHTML += `
      <div onclick="showVideo()" class="flex-shrink-0 w-16 h-16 rounded-lg border-2 border-gray-200 overflow-hidden cursor-pointer bg-gray-900 relative">
        <div class="absolute inset-0 flex items-center justify-center">
          <span class="material-symbols-rounded text-white text-3xl">play_circle</span>
        </div>
      </div>
    `;
  }

  // Info
  document.getElementById('productBrand').textContent = p.brand || '';
  document.getElementById('productName').textContent = p.name;
  document.getElementById('productRating').textContent = p.rating;
  document.getElementById('productReviews').textContent = p.reviews || 0;

  const stockBadge = document.getElementById('stockBadge');
  if (p.stock > 0) {
    stockBadge.textContent = 'In Stock (' + p.stock + ')';
    stockBadge.className = 'px-2 py-0.5 rounded-full text-xs font-medium bg-green-50 brand-text';
  } else {
    stockBadge.textContent = 'Out of Stock';
    stockBadge.className = 'px-2 py-0.5 rounded-full text-xs font-medium bg-red-50 text-red-500';
  }

  document.getElementById('currentPrice').textContent = formatPrice(p.price);
  if (p.originalPrice && p.originalPrice > p.price) {
    document.getElementById('originalPrice').textContent = formatPrice(p.originalPrice);
    document.getElementById('originalPrice').classList.remove('hidden');
    const discount = Math.round((1 - p.price / p.originalPrice) * 100);
    document.getElementById('discountBadge').textContent = '-' + discount + '%';
    document.getElementById('discountBadge').classList.remove('hidden');
  } else {
    document.getElementById('originalPrice').classList.add('hidden');
    document.getElementById('discountBadge').classList.add('hidden');
  }

  document.getElementById('productDescription').textContent = p.description || 'No description available.';

  // Wishlist state
  const wishlist = JSON.parse(localStorage.getItem('raja_wishlist') || '[]');
  inWishlist = wishlist.includes(p.id);
  updateWishlistUI();

  // Rating bars
  const ratingBars = document.getElementById('ratingBars');
  ratingBars.innerHTML = '';
  for (let i = 5; i >= 1; i--) {
    const pct = i === 5 ? 60 : i === 4 ? 25 : i === 3 ? 10 : i === 2 ? 3 : 2;
    ratingBars.innerHTML += `
      <div class="flex items-center gap-2">
        <span class="text-xs text-gray-500 w-4">${i}</span>
        <span class="material-symbols-rounded text-yellow-500 text-sm">star</span>
        <div class="flex-1 h-2 rating-bar-bg rounded-full overflow-hidden">
          <div class="h-full rating-bar-fill rounded-full" style="width: ${pct}%"></div>
        </div>
        <span class="text-xs text-gray-400 w-8 text-right">${pct}%</span>
      </div>
    `;
  }

  // Sample reviews
  const reviewSamples = document.getElementById('reviewSamples');
  const sampleReviews = [
    { name: 'Ayesha K.', rating: 5, text: 'Absolutely love this product! Great quality and fast delivery.' },
    { name: 'Fatima S.', rating: 4, text: 'Good product. Slightly different from the picture but overall happy.' },
    { name: 'Zain A.', rating: 5, text: 'Excellent quality! Highly recommended.' }
  ];
  reviewSamples.innerHTML = sampleReviews.map(r => `
    <div class="border-b border-gray-100 pb-2 last:border-0">
      <div class="flex items-center gap-1">
        <span class="text-sm font-medium text-gray-800">${r.name}</span>
        <div class="flex">
          ${Array(r.rating).fill('<span class="material-symbols-rounded text-yellow-500 text-sm">star</span>').join('')}
        </div>
      </div>
      <p class="text-sm text-gray-500 mt-0.5">${r.text}</p>
    </div>
  `).join('');

  // Related products
  const allProducts = JSON.parse(localStorage.getItem('raja_products') || '[]');
  const related = allProducts.filter(x => x.category === p.category && x.id !== p.id).slice(0, 6);
  const relatedRow = document.getElementById('relatedRow');
  if (related.length > 0) {
    relatedRow.innerHTML = related.map(rp => {
      const wl = JSON.parse(localStorage.getItem('raja_wishlist') || '[]');
      const inWl = wl.includes(rp.id);
      return `
        <div class="product-card flex-shrink-0 w-32 bg-white rounded-xl border border-gray-100 overflow-hidden cursor-pointer" onclick="goToProduct('${rp.id}')">
          <div class="relative aspect-[4/5] bg-gray-50">
            <img src="${rp.image}" alt="${rp.name}" class="w-full h-full object-cover" loading="lazy" onerror="this.src='https://picsum.photos/seed/erel${rp.id}/400/500'">
            <button onclick="event.stopPropagation(); toggleWishlistSimple('${rp.id}')" class="absolute bottom-1.5 right-1.5 w-6 h-6 bg-white/90 rounded-full flex items-center justify-center shadow">
              <span class="material-symbols-rounded text-sm ${inWl ? 'text-red-500' : 'text-gray-400'}" style="font-variation-settings:'FILL'${inWl ? '1' : '0'}">favorite</span>
            </button>
          </div>
          <div class="p-2">
            <h4 class="text-[11px] font-semibold text-gray-800 line-clamp-2">${rp.name}</h4>
            <span class="text-[11px] font-bold brand-text price-tag">${formatPrice(rp.price)}</span>
          </div>
        </div>
      `;
    }).join('');
  } else {
    relatedRow.innerHTML = '<p class="text-sm text-gray-400">No related products</p>';
  }
}

function showImage(src, idx) {
  document.getElementById('mainImage').src = src;
  document.getElementById('mainImageContainer').classList.remove('hidden');
  document.getElementById('videoPlayer').classList.add('hidden');
  const thumbs = document.getElementById('thumbnailRow').querySelectorAll('.flex-shrink-0');
  thumbs.forEach((t, i) => {
    t.querySelector('div') && (t.querySelector('div').className = 'flex-shrink-0 w-16 h-16 rounded-lg border-2 ' + (i === idx ? 'border-green-500' : 'border-gray-200') + ' overflow-hidden cursor-pointer');
    t.firstChild && (t.firstChild.className = 'flex-shrink-0 w-16 h-16 rounded-lg border-2 ' + (i === idx ? 'border-green-500' : 'border-gray-200') + ' overflow-hidden cursor-pointer');
  });
}

function showVideo() {
  const url = currentProduct.video_url;
  if (!url) return;
  document.getElementById('mainImageContainer').classList.add('hidden');
  const vp = document.getElementById('videoPlayer');
  vp.classList.remove('hidden');
  document.getElementById('videoIframe').src = getVideoEmbed(url);
}

function toggleDescription() {
  const el = document.getElementById('descriptionContent');
  const arrow = document.getElementById('descArrow');
  if (el.classList.contains('max-h-0')) {
    el.classList.remove('max-h-0');
    el.classList.add('max-h-96');
    arrow.style.transform = 'rotate(180deg)';
  } else {
    el.classList.add('max-h-0');
    el.classList.remove('max-h-96');
    arrow.style.transform = '';
  }
}

function toggleWishlistBtn() {
  let wishlist = JSON.parse(localStorage.getItem('raja_wishlist') || '[]');
  const idx = wishlist.indexOf(currentProduct.id);
  if (idx > -1) wishlist.splice(idx, 1);
  else wishlist.push(currentProduct.id);
  localStorage.setItem('raja_wishlist', JSON.stringify(wishlist));
  inWishlist = !inWishlist;
  updateWishlistUI();
}

function updateWishlistUI() {
  const icon = document.getElementById('wishlistIcon');
  const bottomIcon = document.getElementById('bottomWishlistIcon');
  const color = inWishlist ? 'text-red-500' : 'text-gray-400';
  const fill = inWishlist ? '1' : '0';
  icon.className = 'material-symbols-rounded text-2xl ' + color;
  icon.style.setProperty('font-variation-settings', `'FILL' ${fill}`);
  bottomIcon.className = 'material-symbols-rounded text-xl ' + color;
  bottomIcon.style.setProperty('font-variation-settings', `'FILL' ${fill}`);
}

function toggleWishlistSimple(id) {
  let wishlist = JSON.parse(localStorage.getItem('raja_wishlist') || '[]');
  const idx = wishlist.indexOf(id);
  if (idx > -1) wishlist.splice(idx, 1);
  else wishlist.push(id);
  localStorage.setItem('raja_wishlist', JSON.stringify(wishlist));
  renderProductPage();
}

function addToCart() {
  const p = currentProduct;
  let cart = JSON.parse(localStorage.getItem('raja_cart') || '[]');
  const existing = cart.find(item => item.id === p.id);
  if (existing) {
    existing.quantity = (existing.quantity || 1) + currentQuantity;
  } else {
    cart.push({ id: p.id, name: p.name, price: p.price, image: p.image, quantity: currentQuantity, brand: p.brand });
  }
  localStorage.setItem('raja_cart', JSON.stringify(cart));
  updateCartBadge();
}

function buyNow() {
  addToCart();
  window.location.href = 'checkout.html';
}

function checkDelivery() {
  const city = document.getElementById('pincodeInput').value.trim();
  const msg = document.getElementById('deliveryMsg');
  if (!city) {
    msg.textContent = 'Please enter a city name.';
    msg.className = 'text-sm mt-2 text-red-500';
    msg.classList.remove('hidden');
    return;
  }
  const validCities = ['lahore', 'karachi', 'islamabad', 'rawalpindi', 'faisalabad', 'multan', 'peshawar', 'quetta', 'gujranwala', 'sialkot', 'hyderabad', 'sukkur'];
  if (validCities.includes(city.toLowerCase())) {
    msg.textContent = 'Delivery available in ' + city + '! Estimated 3-5 business days.';
    msg.className = 'text-sm mt-2 text-green-600';
  } else {
    msg.textContent = 'Sorry, we currently do not deliver to ' + city + '.';
    msg.className = 'text-sm mt-2 text-red-500';
  }
  msg.classList.remove('hidden');
}

function shareProduct() {
  if (navigator.share) {
    navigator.share({ title: currentProduct.name, text: 'Check out this product on Raja!', url: window.location.href });
  } else {
    navigator.clipboard.writeText(window.location.href).then(() => {
      alert('Link copied to clipboard!');
    });
  }
}

window.addEventListener('DOMContentLoaded', renderProductPage);
</script>
</body>
</html>
