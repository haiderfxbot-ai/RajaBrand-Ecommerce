<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cart - Raja</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  <script src="https://unpkg.com/@dotlottie/player-component@latest/dist/dotlottie-player.mjs" type="module"></script>
  <style>
    * { font-family: 'Plus Jakarta Sans', sans-serif; scrollbar-width: none; }
    *::-webkit-scrollbar { display: none; }
    body { overflow-x: hidden; overflow-y: auto; background: #f8fafc; }
    .brand-gradient { background: linear-gradient(135deg, #16A34A 0%, #15803D 100%); }
    .brand-text { color: #16A34A; }
    .brand-bg { background: #16A34A; }
    .brand-light-bg { background: #DCFCE7; }
    .price-tag { font-family: 'DM Sans', sans-serif; }
    .qty-btn { transition: all 0.15s; }
    .qty-btn:active { transform: scale(0.9); }
  </style>
</head>
<body>

<div id="app">
  <!-- Header -->
  <header class="fixed top-0 left-0 right-0 z-50 bg-white border-b border-gray-100">
    <div class="flex items-center justify-between px-4 h-14">
      <div class="flex items-center gap-2">
        <button onclick="goBack()" class="p-2 -ml-2 rounded-lg hover:bg-gray-50">
          <span class="material-symbols-rounded text-gray-700 text-2xl">arrow_back</span>
        </button>
        <h1 class="text-lg font-bold text-gray-900">Cart</h1>
      </div>
      <button onclick="clearCart()" class="text-sm text-red-500 font-medium px-2 py-1">Clear</button>
    </div>
  </header>

  <main class="pt-14 px-4 pb-24">
    <!-- Cart Items -->
    <div id="cartItemsContainer" class="mt-3 space-y-3"></div>

    <!-- Empty State -->
    <div id="emptyCart" class="hidden text-center py-16">
      <span class="material-symbols-rounded text-6xl text-gray-200">shopping_cart</span>
      <h3 class="text-lg font-bold text-gray-800 mt-3">Your Cart is Empty</h3>
      <p class="text-sm text-gray-400 mt-1">Add items to get started!</p>
      <a href="product.html" class="inline-block mt-4 brand-gradient text-white px-6 py-2.5 rounded-xl font-bold text-sm">Start Shopping</a>
    </div>

    <!-- Coupon Section -->
    <div id="couponSection" class="hidden mt-4 bg-white rounded-xl border border-gray-100 p-4">
      <h3 class="font-bold text-sm text-gray-900 mb-2">Apply Coupon</h3>
      <div class="flex gap-2">
        <input type="text" id="couponInput" placeholder="Enter coupon code" class="flex-1 bg-gray-50 border border-gray-200 rounded-lg px-3 py-2 text-sm uppercase focus:outline-none focus:ring-2 focus:ring-green-200">
        <button onclick="applyCoupon()" class="brand-bg text-white px-4 py-2 rounded-lg text-sm font-medium">Apply</button>
      </div>
      <p id="couponMsg" class="text-sm mt-2 hidden"></p>
    </div>

    <!-- Price Summary -->
    <div id="summarySection" class="hidden mt-4 bg-white rounded-xl border border-gray-100 p-4">
      <h3 class="font-bold text-sm text-gray-900 mb-3">Price Summary</h3>
      <div class="space-y-2 text-sm">
        <div class="flex justify-between">
          <span class="text-gray-500">Subtotal</span>
          <span class="font-medium" id="subtotal">Rs. 0</span>
        </div>
        <div class="flex justify-between" id="discountRow">
          <span class="text-gray-500">Discount</span>
          <span class="font-medium text-green-600" id="discountAmount">- Rs. 0</span>
        </div>
        <div class="flex justify-between">
          <span class="text-gray-500">Delivery</span>
          <span class="font-medium" id="deliveryFee">Rs. 0</span>
        </div>
        <hr class="border-gray-100">
        <div class="flex justify-between text-base font-bold">
          <span>Total</span>
          <span class="brand-text" id="totalAmount">Rs. 0</span>
        </div>
      </div>
      <button onclick="goToCheckout()" class="w-full mt-4 brand-gradient text-white py-3 rounded-xl font-bold text-sm">Proceed to Checkout</button>
    </div>
  </main>

  <!-- Bottom Nav -->
  <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 z-50 px-2" style="padding-bottom: env(safe-area-inset-bottom, 0px);">
    <div class="flex items-center justify-around h-16">
      <a href="index.html" class="flex flex-col items-center gap-0.5 text-gray-400">
        <span class="material-symbols-rounded text-2xl">home</span>
        <span class="text-[10px] font-medium">Home</span>
      </a>
      <a href="product.html" class="flex flex-col items-center gap-0.5 text-gray-400">
        <span class="material-symbols-rounded text-2xl">grid_view</span>
        <span class="text-[10px] font-medium">Products</span>
      </a>
      <a href="search.html" class="flex flex-col items-center gap-0.5 text-gray-400">
        <span class="material-symbols-rounded text-2xl">search</span>
        <span class="text-[10px] font-medium">Search</span>
      </a>
      <a href="wishlist.html" class="flex flex-col items-center gap-0.5 text-gray-400">
        <span class="material-symbols-rounded text-2xl">favorite</span>
        <span class="text-[10px] font-medium">Wishlist</span>
      </a>
      <a href="profile.html" class="flex flex-col items-center gap-0.5 text-gray-400">
        <span class="material-symbols-rounded text-2xl">person</span>
        <span class="text-[10px] font-medium">Profile</span>
      </a>
    </div>
  </nav>
</div>

<script>
function formatPrice(amount) {
  return 'Rs. ' + Number(amount).toLocaleString('en-PK');
}

function getCurrentUser() {
  const data = localStorage.getItem('raja_current_user');
  return data ? JSON.parse(data) : null;
}

function goBack() { window.history.back(); }

function seedDataIfEmpty() {
  if (!localStorage.getItem('raja_coupons')) {
    const coupons = [
      { code: 'RAJA10', discount: 10, minAmount: 1000, maxUses: 100, used: 0 },
      { code: 'SAVE20', discount: 20, minAmount: 3000, maxUses: 50, used: 0 },
      { code: 'NEWUSER', discount: 15, minAmount: 500, maxUses: 200, used: 0 }
    ];
    localStorage.setItem('raja_coupons', JSON.stringify(coupons));
  }
}

function authGuard() {
  const user = getCurrentUser();
  if (!user) {
    window.location.href = 'login.html?redirect=cart.html';
    return false;
  }
  return true;
}

let appliedCoupon = null;

function renderCart() {
  if (!authGuard()) return;
  seedDataIfEmpty();

  const cart = JSON.parse(localStorage.getItem('raja_cart') || '[]');
  const container = document.getElementById('cartItemsContainer');
  const emptyState = document.getElementById('emptyCart');
  const couponSection = document.getElementById('couponSection');
  const summarySection = document.getElementById('summarySection');

  if (cart.length === 0) {
    container.innerHTML = '';
    emptyState.classList.remove('hidden');
    couponSection.classList.add('hidden');
    summarySection.classList.add('hidden');
    return;
  }

  emptyState.classList.add('hidden');
  couponSection.classList.remove('hidden');
  summarySection.classList.remove('hidden');

  container.innerHTML = cart.map((item, idx) => {
    const unitPrice = item.price || 0;
    const itemTotal = unitPrice * (item.quantity || 1);
    return `
      <div class="flex gap-3 bg-white rounded-xl border border-gray-100 p-3">
        <div class="w-20 h-20 rounded-lg bg-gray-50 overflow-hidden flex-shrink-0">
          <img src="${item.image || 'https://picsum.photos/seed/cart/400/500'}" alt="${item.name}" class="w-full h-full object-cover" onerror="this.src='https://picsum.photos/seed/cerror/400/500'">
        </div>
        <div class="flex-1 min-w-0">
          <h3 class="text-sm font-semibold text-gray-800 line-clamp-2 leading-tight">${item.name}</h3>
          <p class="text-xs text-gray-400 mt-0.5">${item.brand || ''}</p>
          <div class="flex items-center justify-between mt-2">
            <span class="text-sm font-bold brand-text price-tag">${formatPrice(unitPrice)}</span>
            <div class="flex items-center gap-2">
              <button onclick="updateCartItem(${idx}, ${item.quantity - 1})" class="qty-btn w-6 h-6 rounded-full border border-gray-200 flex items-center justify-center hover:bg-gray-50">
                <span class="material-symbols-rounded text-sm">remove</span>
              </button>
              <span class="text-sm font-bold w-5 text-center">${item.quantity}</span>
              <button onclick="updateCartItem(${idx}, ${item.quantity + 1})" class="qty-btn w-6 h-6 rounded-full border border-gray-200 flex items-center justify-center hover:bg-gray-50">
                <span class="material-symbols-rounded text-sm">add</span>
              </button>
            </div>
          </div>
          <div class="flex items-center justify-between mt-1">
            <span class="text-xs text-gray-500 price-tag">Total: ${formatPrice(itemTotal)}</span>
            <button onclick="removeCartItem(${idx})" class="text-red-400 hover:text-red-500">
              <span class="material-symbols-rounded text-lg">delete</span>
            </button>
          </div>
        </div>
      </div>
    `;
  }).join('');

  updateSummary(cart);
}

function updateCartItem(idx, newQty) {
  let cart = JSON.parse(localStorage.getItem('raja_cart') || '[]');
  if (newQty <= 0) {
    cart.splice(idx, 1);
  } else {
    cart[idx].quantity = newQty;
  }
  localStorage.setItem('raja_cart', JSON.stringify(cart));
  renderCart();
}

function removeCartItem(idx) {
  let cart = JSON.parse(localStorage.getItem('raja_cart') || '[]');
  cart.splice(idx, 1);
  localStorage.setItem('raja_cart', JSON.stringify(cart));
  renderCart();
}

function clearCart() {
  if (confirm('Clear your cart?')) {
    localStorage.setItem('raja_cart', JSON.stringify([]));
    appliedCoupon = null;
    renderCart();
  }
}

function applyCoupon() {
  const code = document.getElementById('couponInput').value.trim().toUpperCase();
  const msg = document.getElementById('couponMsg');
  if (!code) {
    msg.textContent = 'Please enter a coupon code.';
    msg.className = 'text-sm mt-2 text-red-500';
    msg.classList.remove('hidden');
    return;
  }

  const coupons = JSON.parse(localStorage.getItem('raja_coupons') || '[]');
  const coupon = coupons.find(c => c.code === code);

  if (!coupon) {
    msg.textContent = 'Invalid coupon code.';
    msg.className = 'text-sm mt-2 text-red-500';
    msg.classList.remove('hidden');
    return;
  }

  if (coupon.used >= coupon.maxUses) {
    msg.textContent = 'This coupon has expired.';
    msg.className = 'text-sm mt-2 text-red-500';
    msg.classList.remove('hidden');
    return;
  }

  const cart = JSON.parse(localStorage.getItem('raja_cart') || '[]');
  const subtotal = cart.reduce((sum, item) => sum + (item.price || 0) * (item.quantity || 1), 0);

  if (subtotal < coupon.minAmount) {
    msg.textContent = 'Minimum order of ' + formatPrice(coupon.minAmount) + ' required.';
    msg.className = 'text-sm mt-2 text-red-500';
    msg.classList.remove('hidden');
    return;
  }

  appliedCoupon = coupon;
  msg.textContent = 'Coupon applied! You saved ' + coupon.discount + '%!';
  msg.className = 'text-sm mt-2 text-green-600';
  msg.classList.remove('hidden');
  document.getElementById('couponInput').value = code;
  updateSummary(cart);
}

function updateSummary(cart) {
  const subtotal = cart.reduce((sum, item) => sum + (item.price || 0) * (item.quantity || 1), 0);
  let discount = 0;
  if (appliedCoupon) {
    discount = Math.round(subtotal * appliedCoupon.discount / 100);
  }
  const delivery = subtotal >= 2000 ? 0 : 199;
  const total = subtotal - discount + delivery;

  document.getElementById('subtotal').textContent = formatPrice(subtotal);
  document.getElementById('discountAmount').textContent = '- ' + formatPrice(discount);
  document.getElementById('deliveryFee').textContent = delivery === 0 ? 'Free' : formatPrice(delivery);
  document.getElementById('totalAmount').textContent = formatPrice(total);
}

function goToCheckout() {
  const cart = JSON.parse(localStorage.getItem('raja_cart') || '[]');
  if (cart.length === 0) return;
  window.location.href = 'checkout.html';
}

window.addEventListener('DOMContentLoaded', renderCart);
</script>
</body>
</html>
