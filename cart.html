<!DOCTYPE html>
<html lang="en" class="select-none overflow-x-hidden">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cart — Raja Brand</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/@lottiefiles/lottie-player@latest/dist/lottie-player.js"></script>
  <style>
    :root{--primary:#FF6B35;--primary-dark:#E55A25;--primary-light:#FFE0D6;--secondary:#1A1A2E;--surface:#FFFFFF;--surface-variant:#F8F9FA;--on-surface:#1C1C1E;--outline:#E0E0E0;--success:#34C759;--warning:#FF9500;--error:#FF3B30;--info:#007AFF;}
    *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;font-family:'DM Sans',sans-serif;}
    body{background:var(--surface-variant);color:var(--on-surface);font-size:14px;line-height:1.6;padding-top:64px;padding-bottom:100px;min-height:100vh;}
    h1,h2,h3,h4,h5,h6{font-family:'Plus Jakarta Sans',sans-serif;}
    .material-symbols-rounded{font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24;vertical-align:middle;}
    .icon-fill{font-variation-settings:'FILL' 1,'wght' 400,'GRAD' 0,'opsz' 24;}
    ::-webkit-scrollbar{display:none;}
    .safe-bottom{padding-bottom:env(safe-area-inset-bottom,0px);}
    .header-blur{background:rgba(255,255,255,0.85);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);}
    .glass-nav{background:rgba(255,255,255,0.92);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);}
    .btn-press:active{transform:scale(0.96);}
    .toast{position:fixed;top:80px;right:16px;z-index:9999;padding:12px 20px;border-radius:12px;color:#fff;font-weight:500;box-shadow:0 4px 24px rgba(0,0,0,0.15);transform:translateX(120%);transition:transform .3s;max-width:320px;}
    .toast.show{transform:translateX(0);}
    .toast.success{background:var(--success);}
    .toast.error{background:var(--error);}
    .toast.info{background:var(--info);}
    .toast.warning{background:var(--warning);}
    @keyframes slideOut{from{opacity:1;transform:translateX(0)}to{opacity:0;transform:translateX(100%)}}
    .cart-item-remove{animation:slideOut .3s ease forwards;}
  </style>
</head>
<body>
<div id="toastContainer"></div>

<header class="fixed top-0 left-0 right-0 z-50 header-blur border-b border-gray-100/50">
  <div class="flex items-center justify-between px-4 h-16 safe-top">
    <button onclick="window.history.back()" class="w-10 h-10 flex items-center justify-center rounded-xl hover:bg-gray-100 btn-press"><span class="material-symbols-rounded text-gray-700 text-2xl">arrow_back</span></button>
    <span class="font-bold text-base" style="font-family:'Plus Jakarta Sans',sans-serif;">Shopping Cart</span>
    <button onclick="clearCart()" class="text-sm font-medium px-3 py-1.5 rounded-lg hover:bg-gray-100 btn-press" style="color:var(--error);">Clear</button>
  </div>
</header>

<nav class="fixed bottom-0 left-0 right-0 z-50 glass-nav border-t border-gray-100 safe-bottom" style="padding-bottom:env(safe-area-inset-bottom,4px);">
  <div class="flex items-center justify-around h-16">
    <a href="index.html" class="flex flex-col items-center gap-0.5 min-w-[48px] py-1"><span class="material-symbols-rounded text-xl text-gray-400">home</span><span class="text-[10px] text-gray-400">Home</span></a>
    <a href="product.html" class="flex flex-col items-center gap-0.5 min-w-[48px] py-1"><span class="material-symbols-rounded text-xl text-gray-400">grid_view</span><span class="text-[10px] text-gray-400">Products</span></a>
    <a href="cart.html" class="flex flex-col items-center gap-0.5 min-w-[48px] py-1"><span class="material-symbols-rounded icon-fill text-xl" style="color:var(--primary);">shopping_bag</span><span class="text-[10px] font-medium" style="color:var(--primary);">Cart</span></a>
    <a href="wishlist.html" class="flex flex-col items-center gap-0.5 min-w-[48px] py-1"><span class="material-symbols-rounded text-xl text-gray-400">favorite</span><span class="text-[10px] text-gray-400">Wishlist</span></a>
    <a href="profile.html" class="flex flex-col items-center gap-0.5 min-w-[48px] py-1"><span class="material-symbols-rounded text-xl text-gray-400">person</span><span class="text-[10px] text-gray-400">Profile</span></a>
  </div>
</nav>

<div class="px-4 py-4" id="cartContent">
  <div id="emptyCart" class="hidden flex flex-col items-center justify-center py-16">
    <lottie-player src="https://assets5.lottiefiles.com/packages/lf20_t9v9vnzm.json" background="transparent" speed="1" style="width:200px;height:200px;" loop autoplay></lottie-player>
    <p class="text-gray-500 mt-4 text-lg font-medium">Your cart is empty</p>
    <p class="text-gray-400 text-sm mt-1">Add items from our collection!</p>
    <a href="product.html" class="mt-6 px-8 py-3 rounded-xl text-sm font-bold text-white btn-press" style="background:var(--primary);">Start Shopping</a>
  </div>

  <div id="cartItems" class="space-y-3"></div>

  <div id="couponSection" class="mt-4 p-4 rounded-xl bg-white shadow-sm border border-gray-50">
    <label class="text-sm font-bold block mb-2">Have a coupon?</label>
    <div class="flex gap-2">
      <input type="text" id="couponInput" placeholder="Enter coupon code" class="flex-1 px-3 py-2.5 rounded-lg border border-gray-200 text-sm focus:outline-none focus:border-orange-400 uppercase">
      <button onclick="applyCoupon()" class="px-5 py-2.5 rounded-lg text-sm font-bold text-white btn-press" style="background:var(--primary);">Apply</button>
    </div>
    <p id="couponMsg" class="text-xs mt-2"></p>
    <div id="couponApplied" class="hidden mt-2 flex items-center justify-between bg-green-50 rounded-lg px-3 py-2">
      <span class="text-sm font-medium text-green-700" id="couponCodeDisplay"></span>
      <button onclick="removeCoupon()" class="text-green-700 btn-press"><span class="material-symbols-rounded text-lg">close</span></button>
    </div>
  </div>

  <div class="mt-4 p-4 rounded-xl bg-white shadow-sm border border-gray-50">
    <h3 class="text-sm font-bold mb-3">Order Summary</h3>
    <div class="space-y-2 text-sm">
      <div class="flex justify-between"><span class="text-gray-500">Items Total</span><span class="font-medium" id="subtotal">₹0</span></div>
      <div class="flex justify-between"><span class="text-gray-500">Delivery</span><span id="deliveryCharge" style="color:var(--success);">FREE</span></div>
      <div class="flex justify-between"><span class="text-gray-500">Discount</span><span id="discountAmt">-₹0</span></div>
      <div class="flex justify-between"><span class="text-gray-500">Coupon Discount</span><span id="couponAmt">-₹0</span></div>
      <hr class="border-gray-100">
      <div class="flex justify-between font-bold text-base"><span>Grand Total</span><span id="grandTotal">₹0</span></div>
    </div>
  </div>
</div>

<div class="fixed bottom-16 left-0 right-0 z-40 px-4 pb-2 safe-bottom" style="padding-bottom:max(env(safe-area-inset-bottom,4px),72px);">
  <button id="checkoutBtn" onclick="proceedCheckout()" class="w-full py-3.5 rounded-xl text-sm font-bold text-white btn-press shadow-lg flex items-center justify-center gap-2" style="background:var(--primary);box-shadow:0 4px 20px rgba(255,107,53,0.3);">Proceed to Checkout <span class="material-symbols-rounded">arrow_forward</span></button>
</div>

<script>
  document.addEventListener('contextmenu',e=>e.preventDefault());
  document.addEventListener('selectstart',e=>e.preventDefault());
  document.addEventListener('keydown',e=>{if(e.ctrlKey&&['u','s','a','c','p'].includes(e.key.toLowerCase()))e.preventDefault();if(e.key==='F12')e.preventDefault();});
  document.querySelectorAll('img').forEach(img=>img.setAttribute('draggable','false'));

  const STORE={users:'raja_users',currentUser:'raja_current_user',products:'raja_products',categories:'raja_categories',orders:'raja_orders',cart:'raja_cart',wishlist:'raja_wishlist',notifications:'raja_notifications',settings:'raja_settings',coupons:'raja_coupons',recentSearch:'raja_recent_search'};
  function getLS(k){try{return JSON.parse(localStorage.getItem(k))}catch{return null}}
  function setLS(k,v){localStorage.setItem(k,JSON.stringify(v))}

  let appliedCoupon=null;

  const coupons=getLS(STORE.coupons)||[];

  function seedData(){
    if(getLS(STORE.products)&&getLS(STORE.products).length>0)return;
    const cats=[{id:'cat_001',name:'Electronics',icon:'devices',color:'#007AFF'},{id:'cat_002',name:'Clothing',icon:'checkroom',color:'#FF6B35'},{id:'cat_003',name:'Shoes',icon:'footprint',color:'#34C759'},{id:'cat_004',name:'Accessories',icon:'watch',color:'#FF9500'},{id:'cat_005',name:'Home & Living',icon:'chair',color:'#AF52DE'},{id:'cat_006',name:'Beauty',icon:'spa',color:'#FF2D55'},{id:'cat_007',name:'Sports',icon:'sports_soccer',color:'#5856D6'},{id:'cat_008',name:'Books',icon:'menu_book',color:'#8E8E93'}];
    setLS(STORE.categories,cats);
    const prods=[{id:'prod_001',cat_id:'cat_002',name:'Premium Cotton T-Shirt',description:'Soft breathable cotton t-shirt.',price:599,original_price:999,discount:40,stock:100,images:['https://picsum.photos/400/400?random=1'],rating:4.5,reviews:234,tags:['featured','new'],created_at:'2026-05-01'},{id:'prod_002',cat_id:'cat_002',name:'Slim Fit Denim Jeans',description:'Modern slim fit jeans.',price:1299,original_price:2499,discount:48,stock:75,images:['https://picsum.photos/400/400?random=2'],rating:4.3,reviews:189,tags:['featured'],created_at:'2026-04-28'},{id:'prod_003',cat_id:'cat_001',name:'Wireless Bluetooth Earbuds',description:'High-quality wireless earbuds.',price:2499,original_price:4999,discount:50,stock:60,images:['https://picsum.photos/400/400?random=3'],rating:4.7,reviews:456,tags:['featured','new','sale'],created_at:'2026-05-10'},{id:'prod_004',cat_id:'cat_001',name:'Smart Watch Pro',description:'Advanced smartwatch.',price:5999,original_price:9999,discount:40,stock:40,images:['https://picsum.photos/400/400?random=4'],rating:4.4,reviews:312,tags:['featured'],created_at:'2026-03-15'},{id:'prod_005',cat_id:'cat_003',name:'Running Sneakers Air',description:'Lightweight running shoes.',price:3499,original_price:5499,discount:36,stock:85,images:['https://picsum.photos/400/400?random=5'],rating:4.6,reviews:278,tags:['featured','new'],created_at:'2026-05-20'},{id:'prod_006',cat_id:'cat_003',name:'Casual Loafers',description:'Stylish casual loafers.',price:1999,original_price:2999,discount:33,stock:55,images:['https://picsum.photos/400/400?random=6'],rating:4.2,reviews:145,tags:[],created_at:'2026-04-10'},{id:'prod_007',cat_id:'cat_004',name:'Classic Leather Watch',description:'Elegant analog watch.',price:4499,original_price:6999,discount:36,stock:30,images:['https://picsum.photos/400/400?random=7'],rating:4.8,reviews:523,tags:['featured'],created_at:'2026-02-20'},{id:'prod_008',cat_id:'cat_004',name:'Silver Chain Necklace',description:'Premium silver chain necklace.',price:899,original_price:1499,discount:40,stock:120,images:['https://picsum.photos/400/400?random=8'],rating:4.1,reviews:89,tags:['new'],created_at:'2026-05-15'},{id:'prod_009',cat_id:'cat_005',name:'Scented Candle Set',description:'Set of 3 soy wax candles.',price:799,original_price:1299,discount:38,stock:200,images:['https://picsum.photos/400/400?random=9'],rating:4.0,reviews:67,tags:['new'],created_at:'2026-05-18'},{id:'prod_010',cat_id:'cat_006',name:'Face Serum Vitamin C',description:'Brightening vitamin C serum.',price:549,original_price:899,discount:39,stock:150,images:['https://picsum.photos/400/400?random=10'],rating:4.5,reviews:432,tags:['featured'],created_at:'2026-04-05'},{id:'prod_011',cat_id:'cat_007',name:'Yoga Mat Premium',description:'Extra thick non-slip yoga mat.',price:1499,original_price:2499,discount:40,stock:90,images:['https://picsum.photos/400/400?random=11'],rating:4.3,reviews:198,tags:[],created_at:'2026-03-25'},{id:'prod_012',cat_id:'cat_008',name:'The Art of Living',description:'Bestselling self-improvement book.',price:299,original_price:499,discount:40,stock:300,images:['https://picsum.photos/400/400?random=12'],rating:4.6,reviews:876,tags:['featured'],created_at:'2026-01-10'},{id:'prod_013',cat_id:'cat_001',name:'USB-C Hub 7-in-1',description:'Multi-port adapter.',price:1799,original_price:2999,discount:40,stock:65,images:['https://picsum.photos/400/400?random=13'],rating:4.2,reviews:156,tags:['sale'],created_at:'2026-05-08'},{id:'prod_014',cat_id:'cat_002',name:'Floral Summer Dress',description:'Lightweight floral print dress.',price:1499,original_price:2499,discount:40,stock:45,images:['https://picsum.photos/400/400?random=14'],rating:4.4,reviews:234,tags:['new','featured'],created_at:'2026-05-22'},{id:'prod_015',cat_id:'cat_005',name:'Mini Plant Pot Set',description:'Set of 4 ceramic plant pots.',price:449,original_price:699,discount:36,stock:180,images:['https://picsum.photos/400/400?random=15'],rating:4.0,reviews:98,tags:['new'],created_at:'2026-05-12'},{id:'prod_016',cat_id:'cat_006',name:'Organic Lip Balm Trio',description:'Moisturizing organic lip balms.',price:299,original_price:499,discount:40,stock:250,images:['https://picsum.photos/400/400?random=16'],rating:4.3,reviews:567,tags:[],created_at:'2026-04-20'}];
    setLS(STORE.products,prods);
    if(!getLS(STORE.cart))setLS(STORE.cart,[]);
    if(!getLS(STORE.wishlist))setLS(STORE.wishlist,[]);
    if(!getLS(STORE.coupons))setLS(STORE.coupons,[{code:'RAJA10',discount:10,minAmount:499},{code:'WELCOME50',discount:50,minAmount:999}]);
  }
  seedData();

  function showToast(msg,type='success'){
    const c=document.getElementById('toastContainer');
    const t=document.createElement('div');t.className=`toast ${type}`;t.textContent=msg;
    c.appendChild(t);requestAnimationFrame(()=>t.classList.add('show'));
    setTimeout(()=>{t.classList.remove('show');setTimeout(()=>t.remove(),300);},3000);
  }

  function renderCart(){
    const cart=getLS(STORE.cart)||[];
    const container=document.getElementById('cartItems');
    const empty=document.getElementById('emptyCart');
    const couponSec=document.getElementById('couponSection');
    if(cart.length===0){
      container.innerHTML='';
      empty.classList.remove('hidden');
      couponSec.style.display='none';
      document.getElementById('checkoutBtn').disabled=true;
      document.getElementById('checkoutBtn').style.opacity='0.5';
      updateSummary();
      return;
    }
    empty.classList.add('hidden');
    couponSec.style.display='block';
    document.getElementById('checkoutBtn').disabled=false;
    document.getElementById('checkoutBtn').style.opacity='1';
    const products=getLS(STORE.products)||[];
    container.innerHTML=cart.map((item,i)=>`
      <div class="cart-item flex gap-3 p-3 rounded-xl bg-white shadow-sm border border-gray-50" data-index="${i}">
        <div class="w-20 h-20 rounded-xl overflow-hidden bg-gray-50 flex-shrink-0">
          <img src="${item.product_image}" alt="${item.product_name}" class="w-full h-full object-cover" loading="lazy">
        </div>
        <div class="flex-1 min-w-0">
          <h4 class="text-sm font-bold leading-tight line-clamp-2">${item.product_name}</h4>
          <div class="flex items-center gap-1 mt-1"><span class="font-bold text-sm">₹${item.price}</span></div>
          <div class="flex items-center justify-between mt-2">
            <div class="flex items-center gap-2 border border-gray-200 rounded-lg">
              <button onclick="changeQty(${i},-1)" class="w-8 h-8 flex items-center justify-center text-base font-bold btn-press hover:bg-gray-50 rounded-l-lg">−</button>
              <span class="text-sm font-bold w-6 text-center">${item.quantity}</span>
              <button onclick="changeQty(${i},1)" class="w-8 h-8 flex items-center justify-center text-base font-bold btn-press hover:bg-gray-50 rounded-r-lg">+</button>
            </div>
            <button onclick="removeItem(${i})" class="w-8 h-8 flex items-center justify-center rounded-lg hover:bg-red-50 btn-press" style="color:var(--error);"><span class="material-symbols-rounded text-lg">delete</span></button>
          </div>
        </div>
      </div>
    `).join('');
    updateSummary();
  }

  function changeQty(idx,delta){
    const cart=getLS(STORE.cart)||[];
    const item=cart[idx];
    if(!item)return;
    item.quantity=Math.max(1,item.quantity+delta);
    setLS(STORE.cart,cart);
    renderCart();
  }

  function removeItem(idx){
    if(!confirm('Remove this item from cart?'))return;
    const cart=getLS(STORE.cart)||[];
    cart.splice(idx,1);
    setLS(STORE.cart,cart);
    renderCart();
  }

  function clearCart(){
    const cart=getLS(STORE.cart)||[];
    if(cart.length===0)return;
    if(!confirm('Clear your entire cart?'))return;
    setLS(STORE.cart,[]);
    appliedCoupon=null;
    renderCart();
    showToast('Cart cleared','info');
  }

  function updateSummary(){
    const cart=getLS(STORE.cart)||[];
    let subtotal=0;
    cart.forEach(i=>subtotal+=i.price*i.quantity);
    const delivery=subtotal>=499?0:49;
    const discount=Math.round(subtotal*0); // placeholder
    let couponDisc=0;
    if(appliedCoupon){
      const c=coupons.find(c=>c.code===appliedCoupon);
      if(c){
        if(c.discount<100)couponDisc=Math.round(subtotal*c.discount/100);
        else couponDisc=c.discount;
      }
    }
    const total=subtotal+delivery-discount-couponDisc;
    document.getElementById('subtotal').textContent=`₹${subtotal.toLocaleString()}`;
    document.getElementById('deliveryCharge').textContent=delivery===0?'FREE':`₹${delivery}`;
    document.getElementById('deliveryCharge').style.color=delivery===0?'var(--success)':'var(--on-surface)';
    document.getElementById('discountAmt').textContent=`-₹${discount}`;
    document.getElementById('couponAmt').textContent=couponDisc>0?`-₹${couponDisc}`:'-₹0';
    document.getElementById('grandTotal').textContent=`₹${Math.max(0,total).toLocaleString()}`;
  }

  function applyCoupon(){
    const input=document.getElementById('couponInput').value.trim().toUpperCase();
    const msg=document.getElementById('couponMsg');
    if(!input){msg.innerHTML='<span style="color:var(--error);">Please enter a coupon code.</span>';return;}
    const c=coupons.find(c=>c.code===input);
    if(!c){msg.innerHTML='<span style="color:var(--error);">Invalid coupon code.</span>';return;}
    const cart=getLS(STORE.cart)||[];
    let subtotal=0;
    cart.forEach(i=>subtotal+=i.price*i.quantity);
    if(subtotal<c.minAmount){msg.innerHTML=`<span style="color:var(--error);">Minimum order ₹${c.minAmount} required.</span>`;return;}
    appliedCoupon=c.code;
    msg.innerHTML='';
    document.getElementById('couponInput').value='';
    document.getElementById('couponApplied').classList.remove('hidden');
    document.getElementById('couponCodeDisplay').textContent=`${c.code} — ${c.discount}% OFF`;
    updateSummary();
    showToast(`Coupon ${c.code} applied!`,'success');
  }

  function removeCoupon(){
    appliedCoupon=null;
    document.getElementById('couponApplied').classList.add('hidden');
    updateSummary();
    showToast('Coupon removed','info');
  }

  function proceedCheckout(){
    const cart=getLS(STORE.cart)||[];
    if(cart.length===0){showToast('Your cart is empty!','error');return;}
    const user=getLS(STORE.currentUser);
    if(!user){window.location.href='login.html?redirect=checkout.html';return;}
    window.location.href='checkout.html';
  }

  renderCart();
</script>
</body>
</html>
