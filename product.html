<script>
function formatPrice(amount) {
  return 'Rs. ' + Number(amount).toLocaleString('en-PK');
}

function goToProduct(id) {
  localStorage.setItem('raja_selected_product', id);
  window.location.href = 'product-detail.html?id=' + id;
}

function getCartCount() {
  const cart = JSON.parse(localStorage.getItem('raja_cart') || '[]');
  return cart.reduce((sum, item) => sum + (item.quantity || 1), 0);
}

function updateCartBadge() {
  const count = getCartCount();
  const badge = document.getElementById('cartBadge');
  if (badge) {
    badge.textContent = count;
    badge.classList.toggle('hidden', count === 0);
  }
}

let allProducts = [];
let allCategories = [];

function renderPage() {
  seedDataIfEmpty();
  updateCartBadge();

  allProducts = JSON.parse(localStorage.getItem('raja_products') || '[]');
  allCategories = JSON.parse(localStorage.getItem('raja_categories') || '[]');

  // Set page title based on category param
  const params = new URLSearchParams(window.location.search);
  const catParam = params.get('cat');
  if (catParam) {
    const cat = allCategories.find(c => c.id === catParam);
    document.getElementById('pageTitle').textContent = cat ? cat.name : 'Products';
  } else {
    document.getElementById('pageTitle').textContent = 'Products';
  }

  // Render category chips
  const chipsContainer = document.getElementById('categoryChips');
  chipsContainer.innerHTML = `<button onclick="filterByCategory('')" class="flex-shrink-0 px-4 py-1.5 rounded-full text-sm font-medium border ${!catParam ? 'active-chip' : 'bg-white text-gray-600 border-gray-200'}">All</button>` +
    allCategories.map(c => `
      <button onclick="filterByCategory('${c.id}')" class="flex-shrink-0 px-4 py-1.5 rounded-full text-sm font-medium border ${catParam === c.id ? 'active-chip' : 'bg-white text-gray-600 border-gray-200'}">${c.name}</button>
    `).join('');

  filterProducts();
}

function filterByCategory(catId) {
  const url = new URL(window.location);
  if (catId) url.searchParams.set('cat', catId);
  else url.searchParams.delete('cat');
  window.location.href = url.toString();
}

function filterProducts() {
  const search = document.getElementById('searchInput').value.toLowerCase();
  const sort = document.getElementById('sortSelect').value;
  const params = new URLSearchParams(window.location.search);
  const catParam = params.get('cat');

  let filtered = [...allProducts];

  if (catParam) {
    filtered = filtered.filter(p => p.category === catParam);
  }

  if (search) {
    filtered = filtered.filter(p => p.name.toLowerCase().includes(search) || p.brand.toLowerCase().includes(search) || p.category.toLowerCase().includes(search));
  }

  // Sort
  switch (sort) {
    case 'price-asc': filtered.sort((a, b) => a.price - b.price); break;
    case 'price-desc': filtered.sort((a, b) => b.price - a.price); break;
    case 'newest': filtered.sort((a, b) => new Date(b.dateAdded) - new Date(a.dateAdded)); break;
    case 'rating': filtered.sort((a, b) => b.rating - a.rating); break;
  }

  document.getElementById('resultCount').textContent = filtered.length + ' product' + (filtered.length !== 1 ? 's' : '');
  renderProducts(filtered);
}

function renderProducts(products) {
  const wishlist = JSON.parse(localStorage.getItem('raja_wishlist') || '[]');
  const grid = document.getElementById('productGrid');
  if (products.length === 0) {
    grid.innerHTML = `<div class="col-span-2 text-center py-12">
      <span class="material-symbols-rounded text-5xl text-gray-300">search_off</span>
      <p class="text-gray-400 mt-2">No products found</p>
    </div>`;
    return;
  }
  grid.innerHTML = products.map(p => {
    const inWishlist = wishlist.includes(p.id);
    const discount = p.originalPrice ? Math.round((1 - p.price / p.originalPrice) * 100) : 0;
    return `
      <div class="product-card bg-white rounded-xl border border-gray-100 overflow-hidden cursor-pointer" onclick="goToProduct('${p.id}')">
        <div class="relative aspect-[4/5] bg-gray-50">
          <img src="${p.image}" alt="${p.name}" class="w-full h-full object-cover" loading="lazy" onerror="this.src='https://picsum.photos/seed/error${p.id}/400/500'">
          ${discount > 0 ? `<div class="absolute top-2 left-2 brand-bg text-white text-[10px] font-bold px-1.5 py-0.5 rounded">-${discount}%</div>` : ''}
          ${p.isNew ? `<div class="absolute top-2 right-2 bg-[#F59E0B] text-white text-[10px] font-bold px-1.5 py-0.5 rounded">NEW</div>` : ''}
          <button onclick="event.stopPropagation(); toggleWishlist('${p.id}')" class="absolute bottom-2 right-2 w-7 h-7 bg-white/90 rounded-full flex items-center justify-center shadow">
            <span class="material-symbols-rounded text-lg ${inWishlist ? 'text-red-500' : 'text-gray-400'}" style="font-variation-settings:'FILL'${inWishlist ? '1' : '0'}">favorite</span>
          </button>
          <button onclick="event.stopPropagation(); addToCart('${p.id}')" class="absolute bottom-2 left-2 w-7 h-7 brand-bg rounded-full flex items-center justify-center shadow">
            <span class="material-symbols-rounded text-white text-lg">add_shopping_cart</span>
          </button>
        </div>
        <div class="p-2.5">
          <p class="text-[11px] text-gray-400 font-medium truncate">${p.brand}</p>
          <h3 class="text-xs font-semibold text-gray-800 line-clamp-2 leading-tight mt-0.5">${p.name}</h3>
          <div class="flex items-center gap-1 mt-1">
            <span class="text-xs font-bold brand-text price-tag">${formatPrice(p.price)}</span>
            ${p.originalPrice ? `<span class="text-[10px] text-gray-400 line-through price-tag">${formatPrice(p.originalPrice)}</span>` : ''}
          </div>
          <div class="flex items-center gap-1 mt-1">
            <span class="material-symbols-rounded text-yellow-500 text-xs">star</span>
            <span class="text-[10px] text-gray-500">${p.rating} (${p.reviews})</span>
          </div>
        </div>
      </div>
    `;
  }).join('');
}

function toggleWishlist(id) {
  let wishlist = JSON.parse(localStorage.getItem('raja_wishlist') || '[]');
  const idx = wishlist.indexOf(id);
  if (idx > -1) wishlist.splice(idx, 1);
  else wishlist.push(id);
  localStorage.setItem('raja_wishlist', JSON.stringify(wishlist));
  filterProducts();
}

function addToCart(id) {
  const products = JSON.parse(localStorage.getItem('raja_products') || '[]');
  const product = products.find(p => p.id === id);
  if (!product) return;
  let cart = JSON.parse(localStorage.getItem('raja_cart') || '[]');
  const existing = cart.find(item => item.id === id);
  if (existing) {
    existing.quantity = (existing.quantity || 1) + 1;
  } else {
    cart.push({ id: product.id, name: product.name, price: product.price, image: product.image, quantity: 1, brand: product.brand });
  }
  localStorage.setItem('raja_cart', JSON.stringify(cart));
  updateCartBadge();
}

window.addEventListener('DOMContentLoaded', renderPage);
