<!DOCTYPE html>
<html lang="en" class="select-none overflow-x-hidden">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Products — Raja Brand</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/@lottiefiles/lottie-player@latest/dist/lottie-player.js"></script>
  <style>
    :root{--primary:#FF6B35;--primary-dark:#E55A25;--primary-light:#FFE0D6;--secondary:#1A1A2E;--surface:#FFFFFF;--surface-variant:#F8F9FA;--on-surface:#1C1C1E;--outline:#E0E0E0;--success:#34C759;--warning:#FF9500;--error:#FF3B30;--info:#007AFF;}
    *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;font-family:'DM Sans',sans-serif;}
    body{background:var(--surface-variant);color:var(--on-surface);font-size:14px;line-height:1.6;padding-top:64px;padding-bottom:72px;min-height:100vh;}
    h1,h2,h3,h4,h5,h6{font-family:'Plus Jakarta Sans',sans-serif;}
    .material-symbols-rounded{font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24;vertical-align:middle;}
    .icon-fill{font-variation-settings:'FILL' 1,'wght' 400,'GRAD' 0,'opsz' 24;}
    ::-webkit-scrollbar{display:none;}
    .safe-bottom{padding-bottom:env(safe-area-inset-bottom,0px);}
    .safe-top{padding-top:env(safe-area-inset-top,0px);}
    .header-blur{background:rgba(255,255,255,0.85);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);}
    .glass-nav{background:rgba(255,255,255,0.92);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);}
    .btn-press:active{transform:scale(0.96);}
    .product-card{background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 2px 12px rgba(0,0,0,0.06);transition:all .3s ease;}
    .product-card:hover{transform:translateY(-4px);box-shadow:0 8px 32px rgba(0,0,0,0.12);}
    .badge-pill{padding:2px 10px;border-radius:100px;font-size:11px;font-weight:600;}
    .shimmer{background:linear-gradient(90deg,#f0f0f0 25%,#e0e0e0 50%,#f0f0f0 75%);background-size:200% 100%;animation:shimmer 1.5s infinite;}
    @keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
    .toast{position:fixed;top:80px;right:16px;z-index:9999;padding:12px 20px;border-radius:12px;color:#fff;font-weight:500;box-shadow:0 4px 24px rgba(0,0,0,0.15);transform:translateX(120%);transition:transform .3s;max-width:320px;}
    .toast.show{transform:translateX(0);}
    .toast.success{background:var(--success);}
    .toast.error{background:var(--error);}
    .toast.info{background:var(--info);}
    .toast.warning{background:var(--warning);}
    .bs-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:300;opacity:0;visibility:hidden;transition:all .3s;}
    .bs-overlay.show{opacity:1;visibility:visible;}
    .bottom-sheet{position:fixed;left:0;right:0;bottom:0;background:#fff;border-radius:24px 24px 0 0;z-index:301;transform:translateY(100%);transition:transform .35s cubic-bezier(.32,.72,0,1);max-height:80vh;overflow-y:auto;padding-bottom:env(safe-area-inset-bottom,16px);}
    .bottom-sheet.show{transform:translateY(0);}
    .bs-handle{width:36px;height:4px;border-radius:2px;background:#ddd;margin:8px auto 12px;}
  </style>
</head>
<body>
<div id="toastContainer"></div>

<header class="fixed top-0 left-0 right-0 z-50 header-blur border-b border-gray-100/50">
  <div class="flex items-center justify-between px-4 h-16 safe-top">
    <button onclick="window.history.back()" class="w-10 h-10 flex items-center justify-center rounded-xl hover:bg-gray-100 btn-press">
      <span class="material-symbols-rounded text-gray-700 text-2xl">arrow_back</span>
    </button>
    <span class="font-bold text-base" style="font-family:'Plus Jakarta Sans',sans-serif;" id="pageTitle">All Products</span>
    <a href="cart.html" class="w-10 h-10 flex items-center justify-center rounded-xl hover:bg-gray-100 btn-press relative">
      <span class="material-symbols-rounded text-gray-700 text-2xl">shopping_bag</span>
      <span id="cartBadge" class="absolute -top-0.5 -right-0.5 bg-red-500 text-white text-[10px] font-bold rounded-full min-w-[18px] h-[18px] flex items-center justify-center px-1 hidden">0</span>
    </a>
  </div>
</header>

<nav class="fixed bottom-0 left-0 right-0 z-50 glass-nav border-t border-gray-100 safe-bottom" style="padding-bottom:env(safe-area-inset-bottom,4px);">
  <div class="flex items-center justify-around h-16">
    <a href="index.html" class="flex flex-col items-center gap-0.5 min-w-[48px] py-1"><span class="material-symbols-rounded text-xl text-gray-400">home</span><span class="text-[10px] text-gray-400">Home</span></a>
    <a href="product.html" class="flex flex-col items-center gap-0.5 min-w-[48px] py-1"><span class="material-symbols-rounded icon-fill text-xl" style="color:var(--primary);">grid_view</span><span class="text-[10px] font-medium" style="color:var(--primary);">Products</span></a>
    <a href="search.html" class="flex flex-col items-center gap-0.5 min-w-[48px] py-1"><span class="material-symbols-rounded text-xl text-gray-400">search</span><span class="text-[10px] text-gray-400">Search</span></a>
    <a href="wishlist.html" class="flex flex-col items-center gap-0.5 min-w-[48px] py-1"><span class="material-symbols-rounded text-xl text-gray-400">favorite</span><span class="text-[10px] text-gray-400">Wishlist</span></a>
    <a href="profile.html" class="flex flex-col items-center gap-0.5 min-w-[48px] py-1"><span class="material-symbols-rounded text-xl text-gray-400">person</span><span class="text-[10px] text-gray-400">Profile</span></a>
  </div>
</nav>

<div class="px-4 py-3">
  <div class="relative">
    <span class="absolute left-3 top-1/2 -translate-y-1/2 material-symbols-rounded text-gray-400">search</span>
    <input type="text" id="searchInput" placeholder="Search products..." class="w-full pl-10 pr-10 py-2.5 rounded-xl border border-gray-200 bg-white text-sm focus:outline-none focus:border-orange-400" oninput="filterProducts()">
    <span id="clearSearch" class="absolute right-3 top-1/2 -translate-y-1/2 material-symbols-rounded text-gray-400 cursor-pointer hidden" onclick="clearSearch()">close</span>
  </div>
</div>

<div class="px-4 pb-2">
  <div class="flex gap-2 overflow-x-auto" id="filterChips"></div>
  <div class="flex gap-2 mt-2" id="appliedFilters"></div>
</div>

<div class="flex items-center justify-between px-4 py-2">
  <span class="text-sm text-gray-500" id="resultCount"></span>
  <div class="flex gap-2">
    <button onclick="openSortSheet()" class="flex items-center gap-1 px-3 py-1.5 rounded-lg border border-gray-200 text-xs font-medium btn-press bg-white"><span class="material-symbols-rounded text-sm">sort</span> Sort</button>
    <button onclick="openFilterSheet()" class="flex items-center gap-1 px-3 py-1.5 rounded-lg border border-gray-200 text-xs font-medium btn-press bg-white"><span class="material-symbols-rounded text-sm">filter_alt</span> Filter</button>
  </div>
</div>

<div class="px-4 pb-20">
  <div class="grid grid-cols-2 gap-3" id="productGrid"></div>
  <div id="emptyState" class="hidden flex flex-col items-center justify-center py-16">
    <lottie-player src="https://assets5.lottiefiles.com/packages/lf20_t9v9vnzm.json" background="transparent" speed="1" style="width:200px;height:200px;" loop autoplay></lottie-player>
    <p class="text-gray-500 mt-4 text-sm">No products found</p>
    <button onclick="clearAllFilters()" class="mt-3 px-6 py-2.5 rounded-xl text-sm font-bold text-white btn-press" style="background:var(--primary);">Clear Filters</button>
  </div>
  <div id="loadMore" class="text-center py-4 hidden">
    <button onclick="loadMoreProducts()" class="px-8 py-2.5 rounded-xl border border-gray-200 text-sm font-medium btn-press bg-white">Load More</button>
  </div>
</div>

<div class="bs-overlay" id="sortOverlay" onclick="closeSortSheet()"></div>
<div class="bottom-sheet" id="sortSheet">
  <div class="bs-handle"></div>
  <div class="px-5 pb-4">
    <h3 class="text-lg font-bold mb-4" style="font-family:'Plus Jakarta Sans',sans-serif;">Sort By</h3>
    <div class="space-y-1" id="sortOptions"></div>
  </div>
</div>

<div class="bs-overlay" id="filterOverlay" onclick="closeFilterSheet()"></div>
<div class="bottom-sheet" id="filterSheet">
  <div class="bs-handle"></div>
  <div class="px-5 pb-4">
    <h3 class="text-lg font-bold mb-4" style="font-family:'Plus Jakarta Sans',sans-serif;">Filters</h3>
    <div class="mb-5">
      <label class="text-sm font-medium mb-2 block">Max Price: ₹<span id="priceVal">50000</span></label>
      <input type="range" id="priceRange" min="0" max="50000" value="50000" class="w-full accent-orange-500" oninput="updatePriceLabel()">
      <div class="flex justify-between text-xs text-gray-400 mt-1"><span>₹0</span><span>₹50,000</span></div>
    </div>
    <div class="mb-5">
      <label class="text-sm font-medium mb-2 block">Minimum Rating</label>
      <div class="flex gap-2" id="ratingFilter">
        <button data-rating="0" class="px-3 py-1.5 rounded-lg text-xs font-medium border border-gray-200 bg-gray-50 btn-press">Any</button>
        <button data-rating="3" class="px-3 py-1.5 rounded-lg text-xs font-medium border border-gray-200 btn-press">3★ & up</button>
        <button data-rating="4" class="px-3 py-1.5 rounded-lg text-xs font-medium border border-gray-200 btn-press">4★ & up</button>
      </div>
    </div>
    <button onclick="applyFilters()" class="w-full py-3 rounded-xl text-sm font-bold text-white btn-press" style="background:var(--primary);">Apply Filters</button>
  </div>
</div>

<script>
  document.addEventListener('contextmenu',e=>e.preventDefault());
  document.addEventListener('selectstart',e=>e.preventDefault());
  document.addEventListener('keydown',e=>{if(e.ctrlKey&&['u','s','a','c','p'].includes(e.key.toLowerCase()))e.preventDefault();if(e.key==='F12')e.preventDefault();});
  document.querySelectorAll('img').forEach(img=>img.setAttribute('draggable','false'));

  const STORE={users:'raja_users',currentUser:'raja_current_user',products:'raja_products',categories:'raja_categories',orders:'raja_orders',cart:'raja_cart',wishlist:'raja_wishlist',notifications:'raja_notifications',settings:'raja_settings',coupons:'raja_coupons',recentSearch:'raja_recent_search'};
  function getLS(k){try{return JSON.parse(localStorage.getItem(k))}catch{return null}}
  function setLS(k,v){localStorage.setItem(k,JSON.stringify(v))}

  function seedData(){
    if(getLS(STORE.products)&&getLS(STORE.products).length>0)return;
    const cats=[{id:'cat_001',name:'Electronics',icon:'devices',color:'#007AFF'},{id:'cat_002',name:'Clothing',icon:'checkroom',color:'#FF6B35'},{id:'cat_003',name:'Shoes',icon:'footprint',color:'#34C759'},{id:'cat_004',name:'Accessories',icon:'watch',color:'#FF9500'},{id:'cat_005',name:'Home & Living',icon:'chair',color:'#AF52DE'},{id:'cat_006',name:'Beauty',icon:'spa',color:'#FF2D55'},{id:'cat_007',name:'Sports',icon:'sports_soccer',color:'#5856D6'},{id:'cat_008',name:'Books',icon:'menu_book',color:'#8E8E93'}];
    setLS(STORE.categories,cats);
    const prods=[{id:'prod_001',cat_id:'cat_002',name:'Premium Cotton T-Shirt',description:'Soft breathable cotton t-shirt.',price:599,original_price:999,discount:40,stock:100,images:['https://picsum.photos/400/400?random=1'],rating:4.5,reviews:234,tags:['featured','new'],created_at:'2026-05-01'},{id:'prod_002',cat_id:'cat_002',name:'Slim Fit Denim Jeans',description:'Modern slim fit jeans.',price:1299,original_price:2499,discount:48,stock:75,images:['https://picsum.photos/400/400?random=2'],rating:4.3,reviews:189,tags:['featured'],created_at:'2026-04-28'},{id:'prod_003',cat_id:'cat_001',name:'Wireless Bluetooth Earbuds',description:'High-quality wireless earbuds.',price:2499,original_price:4999,discount:50,stock:60,images:['https://picsum.photos/400/400?random=3'],rating:4.7,reviews:456,tags:['featured','new','sale'],created_at:'2026-05-10'},{id:'prod_004',cat_id:'cat_001',name:'Smart Watch Pro',description:'Advanced smartwatch.',price:5999,original_price:9999,discount:40,stock:40,images:['https://picsum.photos/400/400?random=4'],rating:4.4,reviews:312,tags:['featured'],created_at:'2026-03-15'},{id:'prod_005',cat_id:'cat_003',name:'Running Sneakers Air',description:'Lightweight running shoes.',price:3499,original_price:5499,discount:36,stock:85,images:['https://picsum.photos/400/400?random=5'],rating:4.6,reviews:278,tags:['featured','new'],created_at:'2026-05-20'},{id:'prod_006',cat_id:'cat_003',name:'Casual Loafers',description:'Stylish casual loafers.',price:1999,original_price:2999,discount:33,stock:55,images:['https://picsum.photos/400/400?random=6'],rating:4.2,reviews:145,tags:[],created_at:'2026-04-10'},{id:'prod_007',cat_id:'cat_004',name:'Classic Leather Watch',description:'Elegant analog watch.',price:4499,original_price:6999,discount:36,stock:30,images:['https://picsum.photos/400/400?random=7'],rating:4.8,reviews:523,tags:['featured'],created_at:'2026-02-20'},{id:'prod_008',cat_id:'cat_004',name:'Silver Chain Necklace',description:'Premium silver chain necklace.',price:899,original_price:1499,discount:40,stock:120,images:['https://picsum.photos/400/400?random=8'],rating:4.1,reviews:89,tags:['new'],created_at:'2026-05-15'},{id:'prod_009',cat_id:'cat_005',name:'Scented Candle Set',description:'Set of 3 soy wax candles.',price:799,original_price:1299,discount:38,stock:200,images:['https://picsum.photos/400/400?random=9'],rating:4.0,reviews:67,tags:['new'],created_at:'2026-05-18'},{id:'prod_010',cat_id:'cat_006',name:'Face Serum Vitamin C',description:'Brightening vitamin C serum.',price:549,original_price:899,discount:39,stock:150,images:['https://picsum.photos/400/400?random=10'],rating:4.5,reviews:432,tags:['featured'],created_at:'2026-04-05'},{id:'prod_011',cat_id:'cat_007',name:'Yoga Mat Premium',description:'Extra thick non-slip yoga mat.',price:1499,original_price:2499,discount:40,stock:90,images:['https://picsum.photos/400/400?random=11'],rating:4.3,reviews:198,tags:[],created_at:'2026-03-25'},{id:'prod_012',cat_id:'cat_008',name:'The Art of Living',description:'Bestselling self-improvement book.',price:299,original_price:499,discount:40,stock:300,images:['https://picsum.photos/400/400?random=12'],rating:4.6,reviews:876,tags:['featured'],created_at:'2026-01-10'},{id:'prod_013',cat_id:'cat_001',name:'USB-C Hub 7-in-1',description:'Multi-port adapter.',price:1799,original_price:2999,discount:40,stock:65,images:['https://picsum.photos/400/400?random=13'],rating:4.2,reviews:156,tags:['sale'],created_at:'2026-05-08'},{id:'prod_014',cat_id:'cat_002',name:'Floral Summer Dress',description:'Lightweight floral print dress.',price:1499,original_price:2499,discount:40,stock:45,images:['https://picsum.photos/400/400?random=14'],rating:4.4,reviews:234,tags:['new','featured'],created_at:'2026-05-22'},{id:'prod_015',cat_id:'cat_005',name:'Mini Plant Pot Set',description:'Set of 4 ceramic plant pots.',price:449,original_price:699,discount:36,stock:180,images:['https://picsum.photos/400/400?random=15'],rating:4.0,reviews:98,tags:['new'],created_at:'2026-05-12'},{id:'prod_016',cat_id:'cat_006',name:'Organic Lip Balm Trio',description:'Moisturizing organic lip balms.',price:299,original_price:499,discount:40,stock:250,images:['https://picsum.photos/400/400?random=16'],rating:4.3,reviews:567,tags:[],created_at:'2026-04-20'}];
    setLS(STORE.products,prods);
    if(!getLS(STORE.cart))setLS(STORE.cart,[]);
    if(!getLS(STORE.wishlist))setLS(STORE.wishlist,[]);
    if(!getLS(STORE.coupons))setLS(STORE.coupons,[{code:'RAJA10',discount:10,minAmount:499},{code:'WELCOME50',discount:50,minAmount:999}]);
  }
  seedData();

  const products=getLS(STORE.products)||[];
  const categories=getLS(STORE.categories)||[];
  const params=new URLSearchParams(window.location.search);
  let currentCat=params.get('cat')||'';
  let currentSort=params.get('sort')||'';
  let searchQuery=params.get('search')||'';
  let currentPrice=50000,currentRating=0;
  let displayCount=8;

  function updateCartBadge(){const c=getLS(STORE.cart)||[];const b=document.getElementById('cartBadge');if(c.length>0){b.textContent=c.length;b.classList.remove('hidden');}else b.classList.add('hidden');}
  updateCartBadge();

  function showToast(msg,type='success'){
    const c=document.getElementById('toastContainer');
    const t=document.createElement('div');t.className=`toast ${type}`;t.textContent=msg;
    c.appendChild(t);requestAnimationFrame(()=>t.classList.add('show'));
    setTimeout(()=>{t.classList.remove('show');setTimeout(()=>t.remove(),300);},3000);
  }

  const catList=[{id:'',name:'All',icon:''},...categories];
  const chips=document.getElementById('filterChips');
  catList.forEach(c=>{
    const a=document.createElement('a');
    a.href=c.id?`product.html?cat=${c.id}`:'product.html';
    a.className=`flex-shrink-0 px-4 py-1.5 rounded-xl text-xs font-medium btn-press ${(currentCat===c.id)?'text-white':'text-gray-600 bg-white border border-gray-200'}`;
    if(currentCat===c.id)a.style.background='var(--primary)';
    a.textContent=c.name;
    chips.appendChild(a);
  });

  function renderCard(p){
    const cat=categories.find(c=>c.id===p.cat_id);
    const wl=getLS(STORE.wishlist)||[];
    const inW=wl.includes(p.id);
    return `<a href="product-detail.html?id=${p.id}" class="product-card block">
      <div class="relative aspect-[4/3] overflow-hidden bg-gray-50">
        <img src="${p.images[0]}" alt="${p.name}" class="w-full h-full object-cover" loading="lazy">
        <div class="absolute top-2 left-2 flex gap-1">
          ${p.tags.includes('new')?'<span class="badge-pill bg-green-500 text-white">New</span>':''}
          ${p.discount>0?'<span class="badge-pill bg-red-500 text-white">-'+p.discount+'%</span>':''}
        </div>
        <button onclick="event.preventDefault();event.stopPropagation();toggleWishlist('${p.id}')" class="absolute top-2 right-2 w-8 h-8 rounded-full bg-white/90 flex items-center justify-center shadow btn-press ${inW?'icon-fill':''}" style="color:${inW?'var(--error)':'#999'};"><span class="material-symbols-rounded text-lg">favorite</span></button>
      </div>
      <div class="p-3">
        <span class="text-[10px] font-medium text-gray-400 uppercase tracking-wider">${cat?cat.name:''}</span>
        <h3 class="text-sm font-bold mt-0.5 leading-tight line-clamp-2">${p.name}</h3>
        <div class="flex items-center gap-1 mt-1 text-xs text-gray-400"><span class="material-symbols-rounded text-sm" style="color:var(--warning);">star</span><span class="font-medium text-gray-700">${p.rating}</span><span>(${p.reviews})</span></div>
        <div class="flex items-center gap-2 mt-2">
          <span class="font-bold text-base">₹${p.price}</span>
          <span class="text-xs text-gray-400 line-through">₹${p.original_price}</span>
        </div>
        <button onclick="event.preventDefault();event.stopPropagation();addToCart('${p.id}')" class="w-full mt-2 py-2 rounded-xl text-sm font-bold text-white btn-press transition-all active:scale-95" style="background:var(--primary);">Add to Cart</button>
      </div>
    </a>`;
  }

  function getFilteredProducts(){
    let p=[...products];
    if(currentCat)p=p.filter(x=>x.cat_id===currentCat);
    if(searchQuery)p=p.filter(x=>x.name.toLowerCase().includes(searchQuery.toLowerCase())||x.description.toLowerCase().includes(searchQuery.toLowerCase()));
    p=p.filter(x=>x.price<=currentPrice);
    if(currentRating>0)p=p.filter(x=>x.rating>=currentRating);
    if(currentSort==='price_low')p.sort((a,b)=>a.price-b.price);
    else if(currentSort==='price_high')p.sort((a,b)=>b.price-a.price);
    else if(currentSort==='rating')p.sort((a,b)=>b.rating-a.rating);
    else if(currentSort==='newest')p.sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));
    return p;
  }

  function displayProducts(reset=true){
    if(reset)displayCount=8;
    const filtered=getFilteredProducts();
    const grid=document.getElementById('productGrid');
    const empty=document.getElementById('emptyState');
    const loadMore=document.getElementById('loadMore');
    const count=document.getElementById('resultCount');
    count.textContent=`${filtered.length} product${filtered.length!==1?'s':''}`;
    if(filtered.length===0){grid.innerHTML='';empty.classList.remove('hidden');loadMore.classList.add('hidden');return;}
    empty.classList.add('hidden');
    const show=filtered.slice(0,displayCount);
    grid.innerHTML=show.map(p=>renderCard(p)).join('');
    if(filtered.length>displayCount)loadMore.classList.remove('hidden');
    else loadMore.classList.add('hidden');
  }

  function loadMoreProducts(){displayCount+=8;displayProducts(false);}

  function filterProducts(){
    searchQuery=document.getElementById('searchInput').value;
    document.getElementById('clearSearch').classList.toggle('hidden',!searchQuery);
    displayProducts();
  }
  function clearSearch(){document.getElementById('searchInput').value='';searchQuery='';document.getElementById('clearSearch').classList.add('hidden');displayProducts();}

  if(searchQuery){document.getElementById('searchInput').value=searchQuery;document.getElementById('clearSearch').classList.remove('hidden');}

  function toggleWishlist(id){
    let w=getLS(STORE.wishlist)||[];
    const p=products.find(x=>x.id===id);
    if(w.includes(id)){w=w.filter(i=>i!==id);showToast('Removed from wishlist','info');}
    else{w.push(id);showToast(`${p.name} added to wishlist!`,'success');}
    setLS(STORE.wishlist,w);
    displayProducts(false);
  }

  function addToCart(id){
    const cart=getLS(STORE.cart)||[];
    const p=products.find(x=>x.id===id);
    const ex=cart.find(i=>i.product_id===id);
    if(ex)ex.quantity+=1;
    else cart.push({product_id:id,product_name:p.name,product_image:p.images[0],price:p.price,quantity:1});
    setLS(STORE.cart,cart);
    updateCartBadge();
    showToast(`${p.name} added to cart!`,'success');
  }

  const sortOpts=[{val:'',label:'Recommended'},{val:'newest',label:'Newest First'},{val:'price_low',label:'Price: Low to High'},{val:'price_high',label:'Price: High to Low'},{val:'rating',label:'Top Rated'}];
  function openSortSheet(){
    document.getElementById('sortOverlay').classList.add('show');
    document.getElementById('sortSheet').classList.add('show');
    const c=document.getElementById('sortOptions');
    c.innerHTML=sortOpts.map(o=>`<button onclick="selectSort('${o.val}')" class="w-full text-left px-4 py-3 rounded-xl text-sm font-medium ${currentSort===o.val?'text-white':'text-gray-700 hover:bg-gray-50'}" style="${currentSort===o.val?'background:var(--primary);':''}">${o.label}</button>`).join('');
  }
  function selectSort(v){currentSort=v;closeSortSheet();displayProducts();}
  function closeSortSheet(){document.getElementById('sortOverlay').classList.remove('show');document.getElementById('sortSheet').classList.remove('show');}

  function openFilterSheet(){
    document.getElementById('filterOverlay').classList.add('show');
    document.getElementById('filterSheet').classList.add('show');
    document.getElementById('priceRange').value=currentPrice;
    document.getElementById('priceVal').textContent=currentPrice.toLocaleString();
    document.querySelectorAll('#ratingFilter button').forEach(b=>{
      const r=parseInt(b.dataset.rating);
      b.className=`px-3 py-1.5 rounded-lg text-xs font-medium border btn-press ${currentRating===r?'text-white border-transparent':'text-gray-600 border-gray-200 bg-white'}`;
      if(currentRating===r)b.style.background='var(--primary)';else b.style.background='';
    });
  }
  function closeFilterSheet(){document.getElementById('filterOverlay').classList.remove('show');document.getElementById('filterSheet').classList.remove('show');}
  function updatePriceLabel(){document.getElementById('priceVal').textContent=Number(document.getElementById('priceRange').value).toLocaleString();}
  document.querySelectorAll('#ratingFilter button').forEach(b=>{b.addEventListener('click',function(){document.querySelectorAll('#ratingFilter button').forEach(bb=>{bb.className='px-3 py-1.5 rounded-lg text-xs font-medium border border-gray-200 bg-white btn-press';bb.style.background='';});this.className='px-3 py-1.5 rounded-lg text-xs font-medium border btn-press text-white';this.style.background='var(--primary)';});});
  function applyFilters(){currentPrice=Number(document.getElementById('priceRange').value);const r=document.querySelector('#ratingFilter button.text-white');currentRating=r?parseInt(r.dataset.rating):0;closeFilterSheet();displayProducts();}

  function clearAllFilters(){currentCat='';currentSort='';searchQuery='';currentPrice=50000;currentRating=0;document.getElementById('searchInput').value='';window.history.replaceState({},'','product.html');displayProducts();}

  const title=document.getElementById('pageTitle');
  if(currentCat){const c=categories.find(x=>x.id===currentCat);if(c)title.textContent=c.name;}
  if(searchQuery)title.textContent=`Search: ${searchQuery}`;

  displayProducts();

  let lastScroll=0;
  window.addEventListener('scroll',()=>{
    const curr=window.scrollY;
    const h=document.querySelector('header');
    if(curr>lastScroll&&curr>80)h.style.transform='translateY(-100%)';
    else h.style.transform='translateY(0)';
    lastScroll=curr;
  });
</script>
</body>
</html>
