<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Checkout - Raja</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  <script src="https://unpkg.com/@dotlottie/player-component@latest/dist/dotlottie-player.mjs" type="module"></script>
  <style>
    * { font-family: 'Plus Jakarta Sans', sans-serif; scrollbar-width: none; }
    *::-webkit-scrollbar { display: none; }
    body { overflow-x: hidden; overflow-y: auto; background: #f8fafc; }
    .brand-gradient { background: linear-gradient(135deg, #16A34A 0%, #15803D 100%); }
    .brand-text { color: #16A34A; }
    .brand-bg { background: #16A34A; }
    .brand-light-bg { background: #DCFCE7; }
    .price-tag { font-family: 'DM Sans', sans-serif; }
    input, select, textarea { transition: all 0.15s; }
    input:focus, select:focus, textarea:focus { outline: none; border-color: #16A34A; ring: 2px solid #BBF7D0; }
    .error-input { border-color: #ef4444 !important; }
  </style>
</head>
<body>

<div id="app">
  <header class="fixed top-0 left-0 right-0 z-50 bg-white border-b border-gray-100">
    <div class="flex items-center justify-between px-4 h-14">
      <div class="flex items-center gap-2">
        <button onclick="goBack()" class="p-2 -ml-2 rounded-lg hover:bg-gray-50">
          <span class="material-symbols-rounded text-gray-700 text-2xl">arrow_back</span>
        </button>
        <h1 class="text-lg font-bold text-gray-900">Checkout</h1>
      </div>
    </div>
  </header>

  <main class="pt-14 px-4 pb-8">
    <!-- Delivery Address Form -->
    <section class="mt-3 bg-white rounded-xl border border-gray-100 p-4">
      <h2 class="font-bold text-gray-900 mb-4 flex items-center gap-2">
        <span class="material-symbols-rounded brand-text">location_on</span> Delivery Address
      </h2>
      <div class="space-y-3">
        <div>
          <label class="text-xs font-medium text-gray-500 mb-1 block">Full Name</label>
          <input type="text" id="addrName" placeholder="Enter your full name" class="w-full bg-gray-50 border border-gray-200 rounded-lg px-3 py-2.5 text-sm">
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="text-xs font-medium text-gray-500 mb-1 block">Phone Number</label>
            <input type="tel" id="addrPhone" placeholder="03XX-XXXXXXX" class="w-full bg-gray-50 border border-gray-200 rounded-lg px-3 py-2.5 text-sm">
          </div>
          <div>
            <label class="text-xs font-medium text-gray-500 mb-1 block">Email</label>
            <input type="email" id="addrEmail" placeholder="email@example.com" class="w-full bg-gray-50 border border-gray-200 rounded-lg px-3 py-2.5 text-sm">
          </div>
        </div>
        <div>
          <label class="text-xs font-medium text-gray-500 mb-1 block">Street Address</label>
          <textarea id="addrAddress" rows="2" placeholder="House #, Street, Area" class="w-full bg-gray-50 border border-gray-200 rounded-lg px-3 py-2.5 text-sm resize-none"></textarea>
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="text-xs font-medium text-gray-500 mb-1 block">City</label>
            <input type="text" id="addrCity" placeholder="e.g. Lahore" class="w-full bg-gray-50 border border-gray-200 rounded-lg px-3 py-2.5 text-sm">
          </div>
          <div>
            <label class="text-xs font-medium text-gray-500 mb-1 block">Province</label>
            <select id="addrProvince" class="w-full bg-gray-50 border border-gray-200 rounded-lg px-3 py-2.5 text-sm">
              <option value="">Select Province</option>
              <option value="Punjab">Punjab</option>
              <option value="Sindh">Sindh</option>
              <option value="KPK">KPK</option>
              <option value="Balochistan">Balochistan</option>
              <option value="Gilgit-Baltistan">Gilgit-Baltistan</option>
              <option value="AJK">AJK</option>
              <option value="ICT">ICT</option>
            </select>
          </div>
        </div>
        <div>
          <label class="text-xs font-medium text-gray-500 mb-1 block">Postal Code</label>
          <input type="text" id="addrPostal" placeholder="e.g. 54000" class="w-full bg-gray-50 border border-gray-200 rounded-lg px-3 py-2.5 text-sm">
        </div>
      </div>
    </section>

    <!-- Order Summary -->
    <section class="mt-4 bg-white rounded-xl border border-gray-100 p-4">
      <h2 class="font-bold text-gray-900 mb-3 flex items-center gap-2">
        <span class="material-symbols-rounded brand-text">receipt_long</span> Order Summary
      </h2>
      <div id="orderItems" class="space-y-2 mb-3"></div>
      <hr class="border-gray-100 mb-3">
      <div class="space-y-2 text-sm">
        <div class="flex justify-between">
          <span class="text-gray-500">Subtotal</span>
          <span class="font-medium" id="checkoutSubtotal">Rs. 0</span>
        </div>
        <div class="flex justify-between" id="checkoutDiscountRow">
          <span class="text-gray-500">Discount</span>
          <span class="font-medium text-green-600" id="checkoutDiscount">- Rs. 0</span>
        </div>
        <div class="flex justify-between">
          <span class="text-gray-500">Delivery</span>
          <span class="font-medium" id="checkoutDelivery">Rs. 0</span>
        </div>
        <hr class="border-gray-100">
        <div class="flex justify-between text-base font-bold">
          <span>Total</span>
          <span class="brand-text" id="checkoutTotal">Rs. 0</span>
        </div>
      </div>
    </section>

    <!-- Payment Method -->
    <section class="mt-4 bg-white rounded-xl border border-gray-100 p-4">
      <h2 class="font-bold text-gray-900 mb-3 flex items-center gap-2">
        <span class="material-symbols-rounded brand-text">payments</span> Payment Method
      </h2>
      <div class="flex items-center gap-3 p-3 bg-brand-light-bg rounded-xl">
        <span class="material-symbols-rounded brand-text text-2xl">payments</span>
        <div>
          <p class="text-sm font-semibold text-gray-800">Cash on Delivery</p>
          <p class="text-xs text-gray-500">Pay when you receive your order</p>
        </div>
        <span class="material-symbols-rounded brand-text ml-auto">check_circle</span>
      </div>
    </section>

    <!-- Place Order -->
    <button onclick="placeOrder()" class="w-full mt-6 brand-gradient text-white py-3.5 rounded-xl font-bold text-base flex items-center justify-center gap-2">
      <span class="material-symbols-rounded">check_circle</span> Place Order
    </button>
  </main>
</div>

<script>
function formatPrice(amount) {
  return 'Rs. ' + Number(amount).toLocaleString('en-PK');
}

function getCurrentUser() {
  const data = localStorage.getItem('raja_current_user');
  return data ? JSON.parse(data) : null;
}

function goBack() { window.history.back(); }

function seedDataIfEmpty() {}

function authGuard() {
  const user = getCurrentUser();
  if (!user) {
    window.location.href = 'login.html?redirect=checkout.html';
    return false;
  }
  return true;
}

function formatDate(d) {
  const date = new Date(d);
  return date.toLocaleDateString('en-PK', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
}

let appliedCoupon = null;

function getAppliedCoupon() {
  const code = sessionStorage.getItem('raja_checkout_coupon');
  if (!code) return null;
  const coupons = JSON.parse(localStorage.getItem('raja_coupons') || '[]');
  return coupons.find(c => c.code === code) || null;
}

function renderCheckout() {
  if (!authGuard()) return;

  const user = getCurrentUser();
  if (user) {
    document.getElementById('addrName').value = user.name || '';
    document.getElementById('addrPhone').value = user.phone || '';
    document.getElementById('addrEmail').value = user.email || '';
    document.getElementById('addrAddress').value = user.address || '';
    document.getElementById('addrCity').value = user.city || '';
    document.getElementById('addrProvince').value = user.province || '';
    document.getElementById('addrPostal').value = '';
  }

  const cart = JSON.parse(localStorage.getItem('raja_cart') || '[]');
  const subtotal = cart.reduce((sum, item) => sum + (item.price || 0) * (item.quantity || 1), 0);

  appliedCoupon = getAppliedCoupon();
  let discount = 0;
  if (appliedCoupon) {
    discount = Math.round(subtotal * appliedCoupon.discount / 100);
  }

  const delivery = subtotal >= 2000 ? 0 : 199;
  const total = subtotal - discount + delivery;

  const itemsContainer = document.getElementById('orderItems');
  itemsContainer.innerHTML = cart.map(item => `
    <div class="flex items-center gap-3">
      <div class="w-12 h-12 rounded-lg bg-gray-50 overflow-hidden flex-shrink-0">
        <img src="${item.image}" alt="${item.name}" class="w-full h-full object-cover" onerror="this.src='https://picsum.photos/seed/cerror/400/500'">
      </div>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium text-gray-800 truncate">${item.name}</p>
        <p class="text-xs text-gray-400">Qty: ${item.quantity}</p>
      </div>
      <span class="text-sm font-bold brand-text price-tag">${formatPrice((item.price || 0) * (item.quantity || 1))}</span>
    </div>
  `).join('');

  document.getElementById('checkoutSubtotal').textContent = formatPrice(subtotal);
  document.getElementById('checkoutDiscount').textContent = '- ' + formatPrice(discount);
  document.getElementById('checkoutDelivery').textContent = delivery === 0 ? 'Free' : formatPrice(delivery);
  document.getElementById('checkoutTotal').textContent = formatPrice(total);
}

function placeOrder() {
  const name = document.getElementById('addrName').value.trim();
  const phone = document.getElementById('addrPhone').value.trim();
  const email = document.getElementById('addrEmail').value.trim();
  const address = document.getElementById('addrAddress').value.trim();
  const city = document.getElementById('addrCity').value.trim();
  const province = document.getElementById('addrProvince').value;
  const postal = document.getElementById('addrPostal').value.trim();

  if (!name || !phone || !email || !address || !city || !province) {
    alert('Please fill in all required fields.');
    return;
  }

  const user = getCurrentUser();
  if (!user) return;

  const cart = JSON.parse(localStorage.getItem('raja_cart') || '[]');
  if (cart.length === 0) {
    alert('Your cart is empty.');
    return;
  }

  const subtotal = cart.reduce((sum, item) => sum + (item.price || 0) * (item.quantity || 1), 0);
  let discount = 0;
  if (appliedCoupon) {
    discount = Math.round(subtotal * appliedCoupon.discount / 100);
    let coupons = JSON.parse(localStorage.getItem('raja_coupons') || '[]');
    const idx = coupons.findIndex(c => c.code === appliedCoupon.code);
    if (idx > -1) {
      coupons[idx].used = (coupons[idx].used || 0) + 1;
      localStorage.setItem('raja_coupons', JSON.stringify(coupons));
    }
  }

  const delivery = subtotal >= 2000 ? 0 : 199;
  const total = subtotal - discount + delivery;

  const order = {
    id: 'ORD-' + Date.now() + '-' + Math.random().toString(36).substr(2, 4).toUpperCase(),
    userId: user.id || user.email,
    items: cart.map(item => ({ id: item.id, name: item.name, price: item.price, quantity: item.quantity, image: item.image })),
    subtotal: subtotal,
    discount: discount,
    delivery: delivery,
    total: total,
    coupon: appliedCoupon ? appliedCoupon.code : null,
    address: { name, phone, email, address, city, province, postal },
    paymentMethod: 'COD',
    status: 'placed',
    date: new Date().toISOString(),
    timeline: [
      { stage: 'placed', label: 'Order Placed', date: new Date().toISOString(), completed: true },
      { stage: 'confirmed', label: 'Confirmed', date: '', completed: false },
      { stage: 'shipped', label: 'Shipped', date: '', completed: false },
      { stage: 'outfordelivery', label: 'Out for Delivery', date: '', completed: false },
      { stage: 'delivered', label: 'Delivered', date: '', completed: false }
    ]
  };

  let orders = JSON.parse(localStorage.getItem('raja_orders') || '[]');
  orders.unshift(order);
  localStorage.setItem('raja_orders', JSON.stringify(orders));
  localStorage.setItem('raja_cart', JSON.stringify([]));
  sessionStorage.removeItem('raja_checkout_coupon');

  window.location.href = 'orders.html';
}

window.addEventListener('DOMContentLoaded', renderCheckout);
</script>
</body>
</html>
