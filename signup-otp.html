<!DOCTYPE html>
<html lang="en" class="select-none overflow-x-hidden">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Verify OTP — Raja Brand</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=DM+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
  <style>
    :root{--primary:#FF6B35;--primary-dark:#E55A25;--primary-light:#FFE0D6;--secondary:#1A1A2E;--surface:#FFFFFF;--surface-variant:#F8F9FA;--on-surface:#1C1C1E;--outline:#E0E0E0;--success:#34C759;--warning:#FF9500;--error:#FF3B30;--info:#007AFF;}
    *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;font-family:'DM Sans',sans-serif;}
    body{background:var(--surface-variant);color:var(--on-surface);font-size:14px;line-height:1.6;min-height:100vh;display:flex;flex-direction:column;}
    h1,h2,h3,h4,h5,h6{font-family:'Plus Jakarta Sans',sans-serif;}
    .material-symbols-rounded{font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24;vertical-align:middle;}
    .icon-fill{font-variation-settings:'FILL' 1,'wght' 400,'GRAD' 0,'opsz' 24;}
    ::-webkit-scrollbar{display:none;}
    .safe-bottom{padding-bottom:env(safe-area-inset-bottom,0px);}
    .btn-press:active{transform:scale(0.96);}
    .otp-input{width:48px;height:56px;text-align:center;font-size:24px;font-weight:700;font-family:'JetBrains Mono',monospace;border-radius:12px;border:2px solid var(--outline);outline:none;transition:all .2s;caret-color:var(--primary);}
    .otp-input:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-light);}
    .otp-input.filled{border-color:var(--primary);background:var(--primary-light);}
    .timer-circle{transform:rotate(-90deg);}
    .timer-bg{stroke:#e0e0e0;stroke-width:4;fill:none;}
    .timer-progress{stroke:var(--primary);stroke-width:4;fill:none;stroke-linecap:round;transition:stroke-dashoffset 1s linear;}
    .toast{position:fixed;top:80px;right:16px;z-index:9999;padding:12px 20px;border-radius:12px;color:#fff;font-weight:500;box-shadow:0 4px 24px rgba(0,0,0,0.15);transform:translateX(120%);transition:transform .3s;max-width:320px;}
    .toast.show{transform:translateX(0);}
    .toast.success{background:var(--success);}
    .toast.error{background:var(--error);}
    .toast.info{background:var(--info);}
    .toast.warning{background:var(--warning);}
    @keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
    .anim-fade{animation:fadeUp .35s ease;}
    @keyframes progressPulse{0%,100%{opacity:1}50%{opacity:0.7}}
    .progress-active{animation:progressPulse 1s ease infinite;}
  </style>
</head>
<body>
<div id="toastContainer"></div>

<div class="flex-1 flex flex-col justify-center px-6 py-8 max-w-md mx-auto w-full anim-fade">
  <div class="text-center mb-8">
    <div class="w-16 h-16 rounded-2xl flex items-center justify-center mx-auto mb-4" style="background:var(--primary-light);">
      <span class="material-symbols-rounded text-3xl icon-fill" style="color:var(--primary);">lock</span>
    </div>
    <h1 class="text-xl font-extrabold">Verify OTP</h1>
    <p class="text-sm text-gray-500 mt-1">Enter the 6-digit code sent to</p>
    <p class="text-sm font-bold" id="otpEmailDisplay" style="color:var(--primary);"></p>
  </div>

  <div class="flex justify-center gap-2.5 mb-6">
    <input type="text" class="otp-input" maxlength="1" inputmode="numeric" pattern="[0-9]" id="otp1" autofocus>
    <input type="text" class="otp-input" maxlength="1" inputmode="numeric" pattern="[0-9]" id="otp2">
    <input type="text" class="otp-input" maxlength="1" inputmode="numeric" pattern="[0-9]" id="otp3">
    <input type="text" class="otp-input" maxlength="1" inputmode="numeric" pattern="[0-9]" id="otp4">
    <input type="text" class="otp-input" maxlength="1" inputmode="numeric" pattern="[0-9]" id="otp5">
    <input type="text" class="otp-input" maxlength="1" inputmode="numeric" pattern="[0-9]" id="otp6">
  </div>

  <button onclick="verifyOTP()" class="w-full py-3 rounded-xl text-sm font-bold text-white btn-press flex items-center justify-center gap-2" style="background:var(--primary);" id="verifyBtn">Verify OTP <span class="material-symbols-rounded">check_circle</span></button>

  <div class="flex flex-col items-center mt-6 gap-3">
    <div class="relative w-16 h-16">
      <svg class="timer-circle w-full h-full" viewBox="0 0 36 36">
        <circle class="timer-bg" cx="18" cy="18" r="15.9"/>
        <circle class="timer-progress" id="timerProgress" cx="18" cy="18" r="15.9" stroke-dasharray="100" stroke-dashoffset="0"/>
      </svg>
      <span class="absolute inset-0 flex items-center justify-center text-sm font-bold font-mono" id="timerText">60</span>
    </div>
    <button onclick="resendOTP()" id="resendBtn" class="text-sm font-medium btn-press" style="color:var(--primary);" disabled>Resend OTP</button>
  </div>

  <div class="mt-6 bg-gray-50 rounded-xl p-3">
    <div class="flex items-center justify-between text-xs text-gray-500 mb-1">
      <span>Attempts remaining</span>
      <span id="attemptsDisplay">3 of 3</span>
    </div>
    <div class="w-full h-1.5 rounded-full bg-gray-200">
      <div class="h-full rounded-full progress-active" id="attemptsBar" style="width:100%;background:var(--primary);"></div>
    </div>
  </div>

  <div class="mt-4 flex items-center justify-center gap-1 text-xs text-gray-400">
    <span class="material-symbols-rounded text-sm">info</span>
    <span>OTP expires in 60 seconds</span>
  </div>
</div>

<script>
  document.addEventListener('contextmenu',e=>e.preventDefault());
  document.addEventListener('selectstart',e=>e.preventDefault());
  document.addEventListener('keydown',e=>{if(e.ctrlKey&&['u','s','a','c','p'].includes(e.key.toLowerCase()))e.preventDefault();if(e.key==='F12')e.preventDefault();});

  const RAJA_CONFIG={
    emailjs_public_key:'YOUR_EMAILJS_PUBLIC_KEY',
    emailjs_service_id:'service_rajabrand',
    emailjs_otp_template:'template_otp_raja',
    emailjs_reset_template:'template_reset_raja'
  };

  emailjs.init(RAJA_CONFIG.emailjs_public_key);

  const STORE={users:'raja_users',currentUser:'raja_current_user'};
  function getLS(k){try{return JSON.parse(localStorage.getItem(k))}catch{return null}}
  function setLS(k,v){localStorage.setItem(k,JSON.stringify(v))}

  const pendingUser=JSON.parse(sessionStorage.getItem('raja_pending_user'));
  if(!pendingUser||!pendingUser.email){
    showToast('No pending registration found','error');
    setTimeout(()=>window.location.href='login.html',1500);
  }

  document.getElementById('otpEmailDisplay').textContent=pendingUser?pendingUser.email:'';

  let generatedOTP='';
  let attemptsLeft=3;
  let timerValue=60;
  let timerInterval=null;
  const TOTAL_ATTEMPTS=3;
  const circumference=100;

  function updateTimerDisplay(){
    const progress=document.getElementById('timerProgress');
    const offset=circumference-(timerValue/60)*circumference;
    progress.style.strokeDashoffset=offset;
    document.getElementById('timerText').textContent=timerValue;
    if(timerValue<=10)progress.style.stroke='var(--error)';
    else progress.style.stroke='var(--primary)';
  }

  function sendOTPEmail(){
    if(!pendingUser)return;
    generatedOTP=String(Math.floor(100000+Math.random()*900000));
    const params={
      to_email:pendingUser.email,
      to_name:pendingUser.name,
      otp_code:generatedOTP,
      from_name:'Raja Brand',
      reply_to:'rajahaider9053@gmail.com'
    };
    emailjs.send(RAJA_CONFIG.emailjs_service_id,RAJA_CONFIG.emailjs_otp_template,params)
      .then(()=>{
        showToast('OTP sent to your email','success');
        startTimer();
      })
      .catch(()=>{
        showToast('Failed to send OTP. Check EmailJS config.','error');
        document.getElementById('verifyBtn').disabled=false;
      });
  }

  function startTimer(){
    timerValue=60;
    document.getElementById('resendBtn').disabled=true;
    document.getElementById('resendBtn').style.opacity='0.5';
    if(timerInterval)clearInterval(timerInterval);
    updateTimerDisplay();
    timerInterval=setInterval(()=>{
      timerValue--;
      updateTimerDisplay();
      if(timerValue<=0){
        clearInterval(timerInterval);
        document.getElementById('resendBtn').disabled=false;
        document.getElementById('resendBtn').style.opacity='1';
        showToast('OTP expired. Request a new one.','warning');
      }
    },1000);
  }

  function resendOTP(){
    if(attemptsLeft<=0){
      showToast('Maximum attempts reached. Please sign up again.','error');
      setTimeout(()=>{sessionStorage.removeItem('raja_pending_user');window.location.href='login.html';},1500);
      return;
    }
    sendOTPEmail();
    showToast('New OTP sent!','info');
  }

  const otpInputs=['otp1','otp2','otp3','otp4','otp5','otp6'];
  otpInputs.forEach((id,i)=>{
    const inp=document.getElementById(id);
    inp.addEventListener('input',function(){
      if(this.value&&i<5)document.getElementById(otpInputs[i+1]).focus();
      this.classList.toggle('filled',!!this.value);
    });
    inp.addEventListener('keydown',function(e){
      if(e.key==='Backspace'&&!this.value&&i>0){
        document.getElementById(otpInputs[i-1]).focus();
        document.getElementById(otpInputs[i-1]).value='';
        document.getElementById(otpInputs[i-1]).classList.remove('filled');
      }
      if(e.key==='Enter')verifyOTP();
    });
    inp.addEventListener('paste',function(e){
      e.preventDefault();
      const data=e.clipboardData.getData('text').replace(/\D/g,'').slice(0,6);
      data.split('').forEach((ch,j)=>{
        if(j<6){
          document.getElementById(otpInputs[j]).value=ch;
          document.getElementById(otpInputs[j]).classList.toggle('filled',true);
        }
      });
      if(data.length===6)document.getElementById(otpInputs[5]).focus();
    });
  });

  function verifyOTP(){
    const otp=otpInputs.map(id=>document.getElementById(id).value).join('');
    if(otp.length!==6){showToast('Please enter complete 6-digit OTP','warning');return;}

    if(otp!==generatedOTP){
      attemptsLeft--;
      document.getElementById('attemptsDisplay').textContent=`${attemptsLeft} of ${TOTAL_ATTEMPTS}`;
      const pct=(attemptsLeft/TOTAL_ATTEMPTS)*100;
      document.getElementById('attemptsBar').style.width=pct+'%';
      if(attemptsLeft<=0){
        showToast('Too many attempts. Redirecting...','error');
        setTimeout(()=>{sessionStorage.removeItem('raja_pending_user');window.location.href='login.html';},1500);
        return;
      }
      showToast(`Incorrect OTP. ${attemptsLeft} attempts left.`,'error');
      otpInputs.forEach(id=>{document.getElementById(id).value='';document.getElementById(id).classList.remove('filled');});
      document.getElementById('otp1').focus();
      return;
    }

    clearInterval(timerInterval);
    document.getElementById('verifyBtn').disabled=true;
    document.getElementById('verifyBtn').innerHTML='<span class="material-symbols-rounded animate-spin">progress_activity</span> Verifying...';

    const users=getLS(STORE.users)||[];
    const newUser={
      name:pendingUser.name,
      phone:pendingUser.phone,
      email:pendingUser.email,
      password:pendingUser.password,
      provider:'email',
      address:{line1:'',line2:'',city:'',state:'',pincode:''},
      created_at:new Date().toISOString()
    };
    users.push(newUser);
    setLS(STORE.users,users);
    setLS(STORE.currentUser,{name:newUser.name,email:newUser.email,phone:newUser.phone,address:newUser.address,provider:'email'});
    sessionStorage.removeItem('raja_pending_user');

    showToast('Account verified successfully!','success');
    document.getElementById('verifyBtn').innerHTML='<span class="material-symbols-rounded">check_circle</span> Verified!';

    const bar=document.getElementById('attemptsBar');
    bar.style.background='var(--success)';
    bar.style.width='100%';
    bar.classList.remove('progress-active');

    setTimeout(()=>{
      const redirect=new URLSearchParams(window.location.search).get('redirect')||'index.html';
      window.location.href=redirect;
    },1200);
  }

  function showToast(msg,type='success'){
    const c=document.getElementById('toastContainer');
    const t=document.createElement('div');t.className=`toast ${type}`;t.textContent=msg;
    c.appendChild(t);requestAnimationFrame(()=>t.classList.add('show'));
    setTimeout(()=>{t.classList.remove('show');setTimeout(()=>t.remove(),300);},3000);
  }

  setTimeout(()=>sendOTPEmail(),800);
</script>
</body>
</html>
