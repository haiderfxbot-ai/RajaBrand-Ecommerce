<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Raja Brand - Verify OTP</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: #f8fafc;
      overflow-x: hidden;
      overflow-y: auto;
      min-height: 100vh;
    }
    .otp-input {
      width: 48px; height: 56px; text-align: center; font-size: 22px; font-weight: 700;
      border: 2px solid #e2e8f0; border-radius: 12px; outline: none;
      transition: all 0.2s ease; background: white;
    }
    .otp-input:focus {
      border-color: #16A34A; box-shadow: 0 0 0 3px rgba(22,163,74,0.15);
    }
    .otp-input.filled { border-color: #16A34A; background: #f0fdf4; }
    .otp-input.error { border-color: #ef4444; animation: shake 0.3s ease; }
    @keyframes shake {
      0%,100% { transform: translateX(0); }
      25% { transform: translateX(-4px); }
      75% { transform: translateX(4px); }
    }
    .countdown-svg { transform: rotate(-90deg); }
    .countdown-circle { stroke: #16A34A; fill: none; stroke-width: 4; stroke-linecap: round; transition: stroke-dashoffset 1s linear; }
    .countdown-bg { stroke: #e2e8f0; fill: none; stroke-width: 4; }
    .attempt-bar { height: 4px; border-radius: 4px; transition: width 0.5s ease; background: #16A34A; }
    .btn-primary {
      background: linear-gradient(135deg, #16A34A, #15803D);
      color: white; border: none; border-radius: 14px;
      min-height: 52px; padding: 0 24px; font-weight: 600; font-size: 15px;
      cursor: pointer; touch-action: manipulation; transition: all 0.2s ease;
      width: 100%; display: flex; align-items: center; justify-content: center;
    }
    .btn-primary:active { transform: scale(0.95); }
    .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
    .btn-secondary {
      background: transparent; color: #16A34A; border: 2px solid #16A34A;
      border-radius: 14px; min-height: 44px; padding: 0 20px; font-weight: 600; font-size: 14px;
      cursor: pointer; touch-action: manipulation; transition: all 0.2s ease; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    }
    .btn-secondary:active { transform: scale(0.95); }
    .btn-secondary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    .toast {
      position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%);
      background: #1e293b; color: white; padding: 12px 24px; border-radius: 12px;
      font-size: 14px; font-weight: 500; z-index: 999;
      opacity: 0; transition: opacity 0.3s ease; pointer-events: none;
    }
    .toast.show { opacity: 1; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner { animation: spin 1s linear infinite; }
    .otp-container { display: flex; gap: 8px; justify-content: center; }
    @media (max-width: 380px) {
      .otp-input { width: 42px; height: 50px; font-size: 18px; }
      .otp-container { gap: 6px; }
    }
  </style>
</head>
<body>

  <div class="min-h-screen flex items-center justify-center px-4 py-8">
    <div class="w-full max-w-sm">

      <!-- Header -->
      <div class="text-center mb-8">
        <div class="w-14 h-14 bg-gradient-to-br from-green-600 to-green-700 rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-lg shadow-green-200">
          <span class="material-symbols-rounded text-white text-3xl">lock</span>
        </div>
        <h1 class="text-2xl font-bold text-gray-900" style="font-family:'DM Sans',sans-serif;">Verify OTP</h1>
        <p class="text-sm text-gray-500 mt-2" id="otpInfo">Enter the 6-digit code sent to your email</p>
      </div>

      <!-- OTP Inputs -->
      <div class="bg-white rounded-2xl p-6 shadow-sm border border-gray-100">
        <div class="otp-container mb-6" id="otpContainer">
          <input type="text" class="otp-input" id="otp1" maxlength="1" inputmode="numeric" pattern="[0-9]" autofocus>
          <input type="text" class="otp-input" id="otp2" maxlength="1" inputmode="numeric" pattern="[0-9]">
          <input type="text" class="otp-input" id="otp3" maxlength="1" inputmode="numeric" pattern="[0-9]">
          <input type="text" class="otp-input" id="otp4" maxlength="1" inputmode="numeric" pattern="[0-9]">
          <input type="text" class="otp-input" id="otp5" maxlength="1" inputmode="numeric" pattern="[0-9]">
          <input type="text" class="otp-input" id="otp6" maxlength="1" inputmode="numeric" pattern="[0-9]">
        </div>

        <!-- Countdown Timer -->
        <div class="flex items-center justify-center gap-4 mb-5">
          <div class="relative" style="width:56px;height:56px;">
            <svg class="countdown-svg" width="56" height="56" viewBox="0 0 36 36">
              <circle class="countdown-bg" cx="18" cy="18" r="15.5"/>
              <circle class="countdown-circle" id="countdownCircle" cx="18" cy="18" r="15.5"
                stroke-dasharray="97.4" stroke-dashoffset="0"/>
            </svg>
            <span class="absolute inset-0 flex items-center justify-center text-sm font-bold text-gray-700" id="timerText">60</span>
          </div>
          <div class="text-left">
            <p class="text-xs text-gray-500" id="timerLabel">Time remaining</p>
            <button class="btn-secondary mt-1 text-xs px-3 py-1.5 min-h-[36px] text-sm" id="resendBtn" onclick="resendOTP()" disabled>
              <span class="material-symbols-rounded text-base">refresh</span> Resend Code
            </button>
          </div>
        </div>

        <!-- Attempt Progress -->
        <div class="mb-5">
          <div class="flex justify-between items-center mb-1.5">
            <span class="text-xs text-gray-500 font-medium">Attempts remaining</span>
            <span class="text-xs font-bold text-gray-700" id="attemptText">3 of 3</span>
          </div>
          <div class="w-full h-1.5 bg-gray-200 rounded-full overflow-hidden">
            <div class="attempt-bar" id="attemptBar" style="width:100%"></div>
          </div>
        </div>

        <button class="btn-primary" id="verifyBtn" onclick="verifyOTP()">
          <span id="verifyBtnText">Verify OTP</span>
          <svg id="verifyBtnSpinner" class="spinner hidden ml-2" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round"><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/></svg>
        </button>

        <p class="text-center mt-4">
          <a href="login.html" class="text-sm text-gray-500 hover:text-green-600">
            <span class="material-symbols-rounded align-middle text-base">arrow_back</span> Back to Login
          </a>
        </p>
      </div>

    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <script>
    emailjs.init('y1nL04AHOFQQ7iffn');

    const SERVICE_ID = 'service_94ybwiy';
    const TEMPLATE_ID = 'template_5e0vk2h';

    let generatedOTP = '';
    let timerInterval = null;
    let timeLeft = 60;
    let attemptsLeft = 3;
    const TOTAL_ATTEMPTS = 3;
    const TOTAL_TIME = 60;
    const circumference = 97.4;

    // === OTP INPUT HANDLING ===
    document.querySelectorAll('.otp-input').forEach((input, index, inputs) => {
      input.addEventListener('input', function(e) {
        this.value = this.value.replace(/[^0-9]/g, '');
        if (this.value) {
          this.classList.add('filled');
          this.classList.remove('error');
          if (index < inputs.length - 1) inputs[index + 1].focus();
        } else {
          this.classList.remove('filled');
        }
      });

      input.addEventListener('keydown', function(e) {
        if (e.key === 'Backspace' && !this.value && index > 0) {
          inputs[index - 1].focus();
          inputs[index - 1].value = '';
          inputs[index - 1].classList.remove('filled');
          e.preventDefault();
        }
        if (e.key === 'Enter') {
          verifyOTP();
        }
      });

      input.addEventListener('paste', function(e) {
        e.preventDefault();
        const paste = (e.clipboardData || window.clipboardData).getData('text');
        const digits = paste.replace(/[^0-9]/g, '').slice(0, 6);
        digits.split('').forEach((digit, i) => {
          if (inputs[i]) {
            inputs[i].value = digit;
            inputs[i].classList.add('filled');
          }
        });
        const nextIndex = Math.min(digits.length, 5);
        if (inputs[nextIndex]) inputs[nextIndex].focus();
      });
    });

    // === COUNTDOWN TIMER ===
    function startTimer() {
      timeLeft = TOTAL_TIME;
      updateTimerDisplay();
      document.getElementById('resendBtn').disabled = true;
      if (timerInterval) clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        timeLeft--;
        updateTimerDisplay();
        if (timeLeft <= 0) {
          clearInterval(timerInterval);
          document.getElementById('resendBtn').disabled = false;
          document.getElementById('timerLabel').textContent = 'Code expired';
        }
      }, 1000);
    }

    function updateTimerDisplay() {
      document.getElementById('timerText').textContent = timeLeft;
      const offset = circumference * (1 - timeLeft / TOTAL_TIME);
      document.getElementById('countdownCircle').style.strokeDashoffset = offset;
      document.getElementById('timerLabel').textContent = timeLeft > 0 ? 'Time remaining' : 'Code expired';
    }

    // === SEND OTP ===
    async function sendOTP() {
      const pending = JSON.parse(sessionStorage.getItem('raja_pending_user'));
      if (!pending) {
        showToast('No pending registration found');
        setTimeout(() => { window.location.href = 'login.html'; }, 1000);
        return;
      }

      document.getElementById('otpInfo').textContent = 'Enter the 6-digit code sent to ' + pending.email;

      generatedOTP = Math.floor(100000 + Math.random() * 900000).toString();

      try {
        await emailjs.send(SERVICE_ID, TEMPLATE_ID, {
          to_name: pending.name,
          to_email: pending.email,
          otp: generatedOTP,
          from_name: 'Raja Brand'
        });
        showToast('OTP sent to ' + pending.email);
      } catch (err) {
        showToast('Failed to send OTP. Please try again.');
      }
    }

    // === RESEND OTP ===
    async function resendOTP() {
      const btn = document.getElementById('resendBtn');
      btn.disabled = true;
      btn.innerHTML = '<span class="material-symbols-rounded text-base">refresh</span> Sending...';
      await sendOTP();
      startTimer();
      btn.innerHTML = '<span class="material-symbols-rounded text-base">refresh</span> Resend Code';
    }

    // === VERIFY OTP ===
    function verifyOTP() {
      if (attemptsLeft <= 0) {
        showToast('No attempts remaining. Please register again.');
        return;
      }

      const inputs = document.querySelectorAll('.otp-input');
      let otp = '';
      inputs.forEach(inp => { otp += inp.value; });

      if (otp.length !== 6) {
        showToast('Please enter the complete 6-digit code');
        inputs.forEach(inp => { if (!inp.value) inp.classList.add('error'); });
        return;
      }

      const btn = document.getElementById('verifyBtn');
      const btnText = document.getElementById('verifyBtnText');
      const spinner = document.getElementById('verifyBtnSpinner');
      btn.disabled = true;
      btnText.textContent = 'Verifying...';
      spinner.classList.remove('hidden');

      setTimeout(() => {
        if (otp === generatedOTP) {
          completeSignup();
        } else {
          attemptsLeft--;
          updateAttempts();
          showToast('Incorrect OTP. ' + attemptsLeft + ' attempt(s) remaining.');
          inputs.forEach(inp => {
            inp.value = '';
            inp.classList.remove('filled');
            inp.classList.add('error');
          });
          inputs[0].focus();
          btn.disabled = false;
          btnText.textContent = 'Verify OTP';
          spinner.classList.add('hidden');

          if (attemptsLeft <= 0) {
            showToast('No attempts remaining. Please register again.');
            setTimeout(() => { window.location.href = 'login.html'; }, 1500);
          }
        }
      }, 800);
    }

    // === COMPLETE SIGNUP ===
    function completeSignup() {
      const pending = JSON.parse(sessionStorage.getItem('raja_pending_user'));
      if (!pending) {
        showToast('Session expired. Please register again.');
        setTimeout(() => { window.location.href = 'login.html'; }, 1000);
        return;
      }

      const newUser = {
        id: 'user_' + Date.now(),
        name: pending.name,
        email: pending.email,
        phone: pending.phone,
        password: pending.password,
        provider: 'email',
        createdAt: new Date().toISOString()
      };

      const users = JSON.parse(localStorage.getItem('raja_users') || '[]');
      users.push(newUser);
      localStorage.setItem('raja_users', JSON.stringify(users));
      localStorage.setItem('raja_current_user', JSON.stringify(newUser));
      sessionStorage.removeItem('raja_pending_user');

      const btnText = document.getElementById('verifyBtnText');
      btnText.textContent = '✓ Account Created!';
      showToast('Welcome to Raja Brand, ' + newUser.name + '!');

      setTimeout(() => { window.location.href = 'index.html'; }, 800);
    }

    // === UPDATE ATTEMPTS ===
    function updateAttempts() {
      document.getElementById('attemptText').textContent = attemptsLeft + ' of ' + TOTAL_ATTEMPTS;
      document.getElementById('attemptBar').style.width = (attemptsLeft / TOTAL_ATTEMPTS * 100) + '%';
    }

    // === TOAST ===
    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 3000);
    }

    // === INIT ===
    document.addEventListener('DOMContentLoaded', function() {
      const pending = JSON.parse(sessionStorage.getItem('raja_pending_user'));
      if (!pending) {
        showToast('No pending registration');
        setTimeout(() => { window.location.href = 'login.html'; }, 1000);
        return;
      }
      document.getElementById('otpInfo').textContent = 'Enter the 6-digit code sent to ' + pending.email;
      setTimeout(() => {
        sendOTP();
        startTimer();
      }, 800);
    });
  </script>

</body>
</html>
