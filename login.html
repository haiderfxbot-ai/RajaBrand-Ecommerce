<!DOCTYPE html>
<html lang="en" class="select-none overflow-x-hidden">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Login — Raja Brand</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{--primary:#FF6B35;--primary-dark:#E55A25;--primary-light:#FFE0D6;--secondary:#1A1A2E;--surface:#FFFFFF;--surface-variant:#F8F9FA;--on-surface:#1C1C1E;--outline:#E0E0E0;--success:#34C759;--warning:#FF9500;--error:#FF3B30;--info:#007AFF;}
    *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;font-family:'DM Sans',sans-serif;}
    body{background:var(--surface-variant);color:var(--on-surface);font-size:14px;line-height:1.6;min-height:100vh;display:flex;flex-direction:column;}
    h1,h2,h3,h4,h5,h6{font-family:'Plus Jakarta Sans',sans-serif;}
    .material-symbols-rounded{font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24;vertical-align:middle;}
    .icon-fill{font-variation-settings:'FILL' 1,'wght' 400,'GRAD' 0,'opsz' 24;}
    ::-webkit-scrollbar{display:none;}
    .safe-bottom{padding-bottom:env(safe-area-inset-bottom,0px);}
    .btn-press:active{transform:scale(0.96);}
    .toast{position:fixed;top:80px;right:16px;z-index:9999;padding:12px 20px;border-radius:12px;color:#fff;font-weight:500;box-shadow:0 4px 24px rgba(0,0,0,0.15);transform:translateX(120%);transition:transform .3s;max-width:320px;}
    .toast.show{transform:translateX(0);}
    .toast.success{background:var(--success);}
    .toast.error{background:var(--error);}
    .toast.info{background:var(--info);}
    .form-tab{flex:1;padding:12px;text-align:center;font-weight:600;font-size:14px;cursor:pointer;border-bottom:2px solid transparent;transition:all .3s;}
    .form-tab.active{color:var(--primary);border-bottom-color:var(--primary);}
    .form-panel{display:none;animation:fadeUp .35s ease;}
    .form-panel.active{display:block;}
    @keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
    @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
    .shake{animation:shake .4s ease;}
    .strength-bar{height:4px;border-radius:2px;transition:all .3s;}
  </style>
</head>
<body>
<div id="toastContainer"></div>

<div class="flex-1 flex flex-col justify-center px-6 py-8 max-w-md mx-auto w-full">
  <div class="text-center mb-8">
    <div class="flex items-center justify-center gap-2 mb-2">
      <span class="text-3xl font-extrabold tracking-tight" style="color:var(--primary);font-family:'Plus Jakarta Sans',sans-serif;">RAJA</span>
      <span class="text-xl font-semibold" style="color:var(--secondary);font-family:'Plus Jakarta Sans',sans-serif;">Brand</span>
    </div>
    <p class="text-sm text-gray-500">Shop the best, live the best.</p>
  </div>

  <div class="flex border-b border-gray-200 mb-6">
    <div class="form-tab active" onclick="switchFormTab('login')">Login</div>
    <div class="form-tab" onclick="switchFormTab('signup')">Sign Up</div>
  </div>

  <div class="form-panel active" id="loginPanel">
    <div class="space-y-4">
      <div>
        <label class="text-sm font-medium mb-1 block">Email Address</label>
        <input type="email" id="loginEmail" placeholder="you@email.com" class="w-full px-3 py-2.5 rounded-xl border border-gray-200 text-sm focus:outline-none focus:border-orange-400">
        <p class="text-xs mt-1 hidden" id="loginEmailErr" style="color:var(--error);">Please enter a valid email</p>
      </div>
      <div>
        <label class="text-sm font-medium mb-1 block">Password</label>
        <div class="relative">
          <input type="password" id="loginPass" placeholder="••••••••" class="w-full px-3 py-2.5 pr-10 rounded-xl border border-gray-200 text-sm focus:outline-none focus:border-orange-400">
          <button onclick="togglePass('loginPass',this)" class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 btn-press" type="button"><span class="material-symbols-rounded text-lg">visibility_off</span></button>
        </div>
        <p class="text-xs mt-1 hidden" id="loginPassErr" style="color:var(--error);">Please enter your password</p>
      </div>
      <button onclick="loginUser()" class="w-full py-3 rounded-xl text-sm font-bold text-white btn-press flex items-center justify-center gap-2" style="background:var(--primary);" id="loginBtn">Login <span class="material-symbols-rounded">arrow_forward</span></button>
      <div class="flex items-center gap-3 text-xs text-gray-400"><hr class="flex-1 border-gray-200"><span>Or continue with</span><hr class="flex-1 border-gray-200"></div>
      <div class="flex gap-3">
        <button onclick="googleSignIn()" class="flex-1 py-2.5 rounded-xl border border-gray-200 text-sm font-medium btn-press flex items-center justify-center gap-2"><svg class="w-5 h-5" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 01-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg> Google</button>
        <button onclick="phoneSignIn()" class="flex-1 py-2.5 rounded-xl border border-gray-200 text-sm font-medium btn-press flex items-center justify-center gap-2"><span class="material-symbols-rounded text-lg">smartphone</span> Phone</button>
      </div>
      <p class="text-xs text-center text-gray-400 mt-2"><a href="forgot-password.html" style="color:var(--primary);">Forgot Password?</a></p>
    </div>
  </div>

  <div class="form-panel hidden" id="signupPanel">
    <div class="space-y-3">
      <div><label class="text-sm font-medium mb-1 block">Full Name</label><input type="text" id="signupName" placeholder="John Doe" class="w-full px-3 py-2.5 rounded-xl border border-gray-200 text-sm focus:outline-none focus:border-orange-400"><p class="text-xs mt-1 hidden" id="signupNameErr" style="color:var(--error);">Name is required</p></div>
      <div><label class="text-sm font-medium mb-1 block">Phone Number</label><input type="tel" id="signupPhone" placeholder="9876543210" class="w-full px-3 py-2.5 rounded-xl border border-gray-200 text-sm focus:outline-none focus:border-orange-400" maxlength="10"><p class="text-xs mt-1 hidden" id="signupPhoneErr" style="color:var(--error);">Enter valid 10-digit number</p></div>
      <div><label class="text-sm font-medium mb-1 block">Email Address</label><input type="email" id="signupEmail" placeholder="you@email.com" class="w-full px-3 py-2.5 rounded-xl border border-gray-200 text-sm focus:outline-none focus:border-orange-400"><p class="text-xs mt-1 hidden" id="signupEmailErr" style="color:var(--error);">Valid email required</p></div>
      <div><label class="text-sm font-medium mb-1 block">Password</label><div class="relative"><input type="password" id="signupPass" placeholder="At least 6 characters" class="w-full px-3 py-2.5 pr-10 rounded-xl border border-gray-200 text-sm focus:outline-none focus:border-orange-400" oninput="checkStrength()"><button onclick="togglePass('signupPass',this)" class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 btn-press" type="button"><span class="material-symbols-rounded text-lg">visibility_off</span></button></div><div class="strength-bar mt-1" id="strengthBar"></div><p class="text-xs text-gray-400 mt-1" id="strengthLabel"></p></div>
      <div><label class="text-sm font-medium mb-1 block">Confirm Password</label><input type="password" id="signupConfirm" placeholder="Repeat password" class="w-full px-3 py-2.5 rounded-xl border border-gray-200 text-sm focus:outline-none focus:border-orange-400" oninput="checkMatch()"><p class="text-xs mt-1 hidden" id="signupConfirmErr" style="color:var(--error);">Passwords do not match</p></div>
      <label class="flex items-center gap-2 text-sm"><input type="checkbox" id="signupTerms" class="accent-orange-500"> I agree to the <a href="#" style="color:var(--primary);">Terms & Conditions</a></label>
      <button onclick="signupUser()" class="w-full py-3 rounded-xl text-sm font-bold text-white btn-press flex items-center justify-center gap-2" style="background:var(--primary);" id="signupBtn">Create Account <span class="material-symbols-rounded">person_add</span></button>
    </div>
  </div>


</div>

<script>
  document.addEventListener('contextmenu',e=>e.preventDefault());
  document.addEventListener('selectstart',e=>e.preventDefault());
  document.addEventListener('keydown',e=>{if(e.ctrlKey&&['u','s','a','c','p'].includes(e.key.toLowerCase()))e.preventDefault();if(e.key==='F12')e.preventDefault();});

  const RAJA_CONFIG={
    emailjs_public_key:'y1nL04AHOFQQ7iffn',
    emailjs_service_id:'service_94ybwiy',
    emailjs_otp_template:'template_5e0vk2h',
    firebase:{apiKey:'AIzaSyA2F4N12GGCWqM6Jo2RzVKforvgUTeY3jI',authDomain:'rajabrand-4924d.firebaseapp.com',projectId:'rajabrand-4924d',storageBucket:'rajabrand-4924d.firebasestorage.app',messagingSenderId:'744956275932',appId:'1:744956275932:web:62fe87c9d5aeb4ab071819'}
  };

  emailjs.init(RAJA_CONFIG.emailjs_public_key);
  firebase.initializeApp(RAJA_CONFIG.firebase);
  const auth=firebase.auth();

  const STORE={users:'raja_users',currentUser:'raja_current_user'};
  function getLS(k){try{return JSON.parse(localStorage.getItem(k))}catch{return null}}
  function setLS(k,v){localStorage.setItem(k,JSON.stringify(v))}

  const params=new URLSearchParams(window.location.search);
  const redirect=params.get('redirect')||'index.html';

  function showToast(msg,type='success'){
    const c=document.getElementById('toastContainer');
    const t=document.createElement('div');t.className=`toast ${type}`;t.textContent=msg;
    c.appendChild(t);requestAnimationFrame(()=>t.classList.add('show'));
    setTimeout(()=>{t.classList.remove('show');setTimeout(()=>t.remove(),300);},3000);
  }

  function switchFormTab(tab){
    document.querySelectorAll('.form-tab').forEach(t=>t.classList.remove('active'));
    document.querySelectorAll('.form-panel').forEach(p=>p.classList.remove('active'));
    document.getElementById('forgotPassPanel').classList.add('hidden');
    if(tab==='login'){document.querySelector('.form-tab:first-child').classList.add('active');document.getElementById('loginPanel').classList.add('active');}
    else{document.querySelector('.form-tab:last-child').classList.add('active');document.getElementById('signupPanel').classList.add('active');}
  }

  function togglePass(id,btn){
    const inp=document.getElementById(id);
    const isPass=inp.type==='password';
    inp.type=isPass?'text':'password';
    btn.querySelector('span').textContent=isPass?'visibility':'visibility_off';
  }

  function checkStrength(){
    const p=document.getElementById('signupPass').value;
    const bar=document.getElementById('strengthBar');
    const label=document.getElementById('strengthLabel');
    let score=0;
    if(p.length>=6)score++;if(p.length>=10)score++;
    if(/[A-Z]/.test(p))score++;if(/[0-9]/.test(p))score++;
    if(/[^A-Za-z0-9]/.test(p))score++;
    const map=['','bg-red-500','bg-orange-500','bg-yellow-500','bg-green-500','bg-green-600'];
    const texts=['','Weak','Fair','Good','Strong','Very Strong'];
    bar.style.width=score*20+'%';
    bar.style.background=map[score]||'#ddd';
    label.textContent=texts[score]||'';
  }

  function checkMatch(){
    const p=document.getElementById('signupPass').value;
    const c=document.getElementById('signupConfirm').value;
    const err=document.getElementById('signupConfirmErr');
    if(c&&p!==c){err.classList.remove('hidden');return false;}
    err.classList.add('hidden');return true;
  }

  function loginUser(){
    const email=document.getElementById('loginEmail').value.trim();
    const pass=document.getElementById('loginPass').value;
    let valid=true;
    if(!email||!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){document.getElementById('loginEmailErr').classList.remove('hidden');valid=false;}
    else document.getElementById('loginEmailErr').classList.add('hidden');
    if(!pass){document.getElementById('loginPassErr').classList.remove('hidden');valid=false;}
    else document.getElementById('loginPassErr').classList.add('hidden');
    if(!valid)return;

    const users=getLS(STORE.users)||[];
    const user=users.find(u=>u.email===email&&u.password===pass);
    if(!user){showToast('Invalid email or password','error');document.getElementById('loginBtn').parentElement.classList.add('shake');setTimeout(()=>document.getElementById('loginBtn').parentElement.classList.remove('shake'),500);return;}
    setLS(STORE.currentUser,{name:user.name,email:user.email,phone:user.phone,address:user.address});
    showToast('Login successful!','success');
    setTimeout(()=>window.location.href=redirect,500);
  }

  function signupUser(){
    const name=document.getElementById('signupName').value.trim();
    const phone=document.getElementById('signupPhone').value.trim();
    const email=document.getElementById('signupEmail').value.trim();
    const pass=document.getElementById('signupPass').value;
    const confirm=document.getElementById('signupConfirm').value;
    let valid=true;

    if(!name){document.getElementById('signupNameErr').classList.remove('hidden');valid=false;}
    else document.getElementById('signupNameErr').classList.add('hidden');
    if(!phone||!/^\d{10}$/.test(phone)){document.getElementById('signupPhoneErr').classList.remove('hidden');valid=false;}
    else document.getElementById('signupPhoneErr').classList.add('hidden');
    if(!email||!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){document.getElementById('signupEmailErr').classList.remove('hidden');valid=false;}
    else document.getElementById('signupEmailErr').classList.add('hidden');
    if(pass.length<6){showToast('Password must be at least 6 characters','error');document.getElementById('signupPass').focus();valid=false;}
    if(pass!==confirm){document.getElementById('signupConfirmErr').classList.remove('hidden');valid=false;}
    else document.getElementById('signupConfirmErr').classList.add('hidden');
    if(!document.getElementById('signupTerms').checked){showToast('Please accept Terms & Conditions','warning');valid=false;}
    if(!valid)return;

    const users=getLS(STORE.users)||[];
    if(users.find(u=>u.email===email)){showToast('Email already registered. Please login.','error');return;}

    const btn=document.getElementById('signupBtn');
    btn.disabled=true;btn.innerHTML='<span class="material-symbols-rounded animate-spin">progress_activity</span> Sending OTP...';

    sessionStorage.setItem('raja_pending_user',JSON.stringify({name,phone,email,password:pass}));

    const otpParams={
      to_email:email,
      to_name:name,
      otp_code:'000000',
      from_name:'Raja Brand',
      reply_to:'rajahaider9053@gmail.com'
    };
    emailjs.send(RAJA_CONFIG.emailjs_service_id,RAJA_CONFIG.emailjs_otp_template,otpParams)
      .then(()=>{
        showToast('OTP sent to your email!','success');
        setTimeout(()=>window.location.href=`signup-otp.html?redirect=${encodeURIComponent(redirect)}`,500);
      })
      .catch(()=>{
        sessionStorage.removeItem('raja_pending_user');
        showToast('Failed to send OTP. Check EmailJS config.','error');
        btn.disabled=false;btn.innerHTML='Create Account <span class="material-symbols-rounded">person_add</span>';
      });
  }

  function handleGoogleUser(firebaseUser){
    const users=getLS(STORE.users)||[];
    let existing=users.find(u=>u.email===firebaseUser.email);
    if(!existing){
      const newUser={
        name:firebaseUser.displayName||'Google User',
        phone:firebaseUser.phoneNumber||'',
        email:firebaseUser.email,
        password:'',
        provider:'google',
        address:{line1:'',line2:'',city:'',state:'',pincode:''},
        created_at:new Date().toISOString()
      };
      users.push(newUser);
      setLS(STORE.users,users);
      existing=newUser;
    }
    setLS(STORE.currentUser,{name:existing.name,email:existing.email,phone:existing.phone,address:existing.address,provider:'google'});
    showToast('Login successful!','success');
    setTimeout(()=>window.location.href=`index.html?google_signin=true`,500);
  }

  function googleSignIn(){
    const provider=new firebase.auth.GoogleAuthProvider();
    auth.signInWithPopup(provider)
      .then(result=>handleGoogleUser(result.user))
      .catch(err=>{
        if(err.code!=='auth/popup-closed-by-user')showToast('Google Sign-In failed: '+err.message,'error');
      });
  }

  function phoneSignIn(){
    showToast('Phone Sign-In via SMS Gateway app (under development)','info');
  }
</script>
</body>
</html>
