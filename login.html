<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Raja Brand - Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: #f8fafc;
      overflow-x: hidden;
      overflow-y: auto;
      padding-bottom: 60px;
      min-height: 100vh;
    }
    input, button, select, textarea { font-family: 'Plus Jakarta Sans', sans-serif; }
    .brand-gradient { background: linear-gradient(135deg, #FF6B35 0%, #E65A2E 100%); }
    .tab-btn { transition: all 0.3s ease; }
    .tab-btn.active { color: #FF6B35; border-bottom-color: #FF6B35; }
    .tab-btn.active span { color: #FF6B35; }
    .eye-btn { cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .eye-btn svg { width: 22px; height: 22px; }
    .strength-bar { height: 4px; border-radius: 4px; transition: all 0.3s ease; }
    .strength-bar.weak { width: 25%; background: #ef4444; }
    .strength-bar.fair { width: 50%; background: #f97316; }
    .strength-bar.good { width: 75%; background: #eab308; }
    .strength-bar.strong { width: 100%; background: #FF6B35; }
    .strength-text { font-size: 11px; font-weight: 600; transition: all 0.3s ease; }
    .btn-primary {
      background: linear-gradient(135deg, #FF6B35, #E65A2E);
      color: white; border: none; border-radius: 14px;
      min-height: 52px; padding: 0 24px; font-weight: 600; font-size: 15px;
      cursor: pointer; touch-action: manipulation; transition: all 0.2s ease;
      width: 100%; display: flex; align-items: center; justify-content: center;
    }
    .btn-primary:active { transform: scale(0.95); }
    .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
    .btn-outline {
      background: transparent; color: #FF6B35; border: 2px solid #FF6B35;
      border-radius: 14px; min-height: 52px; padding: 0 24px; font-weight: 600; font-size: 15px;
      cursor: pointer; touch-action: manipulation; transition: all 0.2s ease;
      width: 100%; display: flex; align-items: center; justify-content: center; gap: 10px;
    }
    .btn-outline:active { transform: scale(0.95); }
    .btn-google {
      background: white; color: #333; border: 1.5px solid #e2e8f0;
      border-radius: 14px; min-height: 52px; padding: 0 24px; font-weight: 500; font-size: 15px;
      cursor: pointer; touch-action: manipulation; transition: all 0.2s ease;
      width: 100%; display: flex; align-items: center; justify-content: center; gap: 10px;
    }
    .btn-google:active { transform: scale(0.95); }
    .btn-phone {
      background: #f1f5f9; color: #1e293b; border: none;
      border-radius: 14px; min-height: 52px; padding: 0 24px; font-weight: 500; font-size: 15px;
      cursor: pointer; touch-action: manipulation; transition: all 0.2s ease;
      width: 100%; display: flex; align-items: center; justify-content: center; gap: 10px;
    }
    .btn-phone:active { transform: scale(0.95); }
    .input-field {
      width: 100%; padding: 14px 16px; border: 2px solid #e2e8f0;
      border-radius: 12px; font-size: 15px; outline: none;
      transition: border-color 0.2s ease; background: white;
    }
    .input-field:focus { border-color: #FF6B35; }
    .input-field.error { border-color: #ef4444; }
    .input-group { position: relative; }
    .input-group .eye-btn { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); }
    .input-group .input-field { padding-right: 44px; }
    .floating-label {
      position: absolute; left: 16px; top: 50%; transform: translateY(-50%);
      font-size: 15px; color: #94a3b8; transition: all 0.2s ease; pointer-events: none;
      background: white; padding: 0 4px;
    }
    .input-field:focus + .floating-label,
    .input-field:not(:placeholder-shown) + .floating-label {
      top: 0; font-size: 11px; color: #FF6B35;
    }
    .checkbox-custom {
      width: 20px; height: 20px; border: 2px solid #cbd5e1;
      border-radius: 6px; cursor: pointer; display: flex; align-items: center; justify-content: center;
      transition: all 0.2s ease; flex-shrink: 0;
    }
    .checkbox-custom.checked { background: #FF6B35; border-color: #FF6B35; }
    .checkbox-custom.checked svg { display: block; }
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 1000;
      display: none; align-items: center; justify-content: center; padding: 24px;
    }
    .modal-overlay.show { display: flex; }
    .modal-box {
      background: white; border-radius: 20px; padding: 28px 24px;
      max-width: 360px; width: 100%; text-align: center;
    }
    .toast {
      position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%);
      background: #1e293b; color: white; padding: 12px 24px; border-radius: 12px;
      font-size: 14px; font-weight: 500; z-index: 999;
      opacity: 0; transition: opacity 0.3s ease; pointer-events: none;
    }
    .toast.show { opacity: 1; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner { animation: spin 1s linear infinite; }
    @media (max-width: 400px) {
      .container { padding-left: 16px; padding-right: 16px; }
    }
  </style>
</head>
<body>

  <div class="min-h-screen flex items-center justify-center px-4 py-6">
    <div class="w-full max-w-md">

      <!-- Logo -->
      <div class="text-center mb-6">
        <div class="w-16 h-16 brand-gradient rounded-2xl flex items-center justify-center mx-auto mb-3 shadow-lg shadow-orange-200">
          <span class="material-symbols-rounded text-white text-3xl">store</span>
        </div>
        <h1 class="text-2xl font-bold text-gray-900" style="font-family:'DM Sans',sans-serif;">Raja Brand</h1>
        <p class="text-sm text-gray-500 mt-1">Premium shopping experience</p>
      </div>

      <!-- Tab Buttons -->
      <div class="flex bg-white rounded-xl p-1 mb-6 shadow-sm border border-gray-100">
        <button class="tab-btn active flex-1 py-3 text-center font-semibold text-sm border-b-2 border-orange-600 text-orange-500 transition-all" onclick="switchTab('login')" id="tabLogin">Login</button>
        <button class="tab-btn flex-1 py-3 text-center font-semibold text-sm border-b-2 border-transparent text-gray-400 transition-all" onclick="switchTab('signup')" id="tabSignup">Sign Up</button>
      </div>

      <!-- LOGIN FORM -->
      <div id="loginForm">
        <div class="bg-white rounded-2xl p-6 shadow-sm border border-gray-100">
          <form id="loginFormElement" onsubmit="handleLogin(event)">
            <div class="input-group mb-4">
              <input type="email" id="loginEmail" class="input-field" placeholder=" " required autocomplete="email">
              <label for="loginEmail" class="floating-label">Email Address</label>
            </div>
            <div class="input-group mb-1">
              <input type="password" id="loginPassword" class="input-field" placeholder=" " required autocomplete="current-password" minlength="6">
              <label for="loginPassword" class="floating-label">Password</label>
              <button type="button" class="eye-btn" onclick="togglePassword('loginPassword', 'loginEyeIcon')" tabindex="-1" id="loginEyeBtn">
                <svg id="loginEyeIcon" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
              </button>
            </div>
            <div class="text-right mb-5">
              <a href="forgot-password.html" class="text-sm font-medium text-orange-500 hover:text-orange-600">Forgot Password?</a>
            </div>
            <button type="submit" class="btn-primary mb-4" id="loginBtn">
              <span id="loginBtnText">Login</span>
              <svg id="loginBtnSpinner" class="spinner hidden ml-2" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round"><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/></svg>
            </button>
          </form>

          <div class="relative my-5">
            <div class="absolute inset-0 flex items-center"><div class="w-full border-t border-gray-200"></div></div>
            <div class="relative flex justify-center"><span class="bg-white px-3 text-xs text-gray-400 font-medium">or continue with</span></div>
          </div>

          <button class="btn-google mb-3" onclick="handleGoogleLogin()">
            <svg width="20" height="20" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59A14.5 14.5 0 0 1 9.5 24c0-1.59.28-3.14.76-4.59l-7.98-6.19A23.99 23.99 0 0 0 0 24c0 3.77.88 7.35 2.56 10.56l7.97-5.97z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 5.97C6.51 42.62 14.62 48 24 48z"/></svg>
            Continue with Google
          </button>
          <button class="btn-phone" onclick="showToast('Phone login coming soon!')">
            <span class="material-symbols-rounded text-orange-500">phone_iphone</span>
            Continue with Phone
          </button>
        </div>
      </div>

      <!-- SIGNUP FORM -->
      <div id="signupForm" class="hidden">
        <div class="bg-white rounded-2xl p-6 shadow-sm border border-gray-100">
          <form id="signupFormElement" onsubmit="handleSignup(event)">
            <div class="input-group mb-4">
              <input type="text" id="signupName" class="input-field" placeholder=" " required>
              <label for="signupName" class="floating-label">Full Name</label>
            </div>
            <div class="input-group mb-4">
              <input type="tel" id="signupPhone" class="input-field" placeholder=" " required pattern="03[0-9]{9}">
              <label for="signupPhone" class="floating-label">Phone (03XXXXXXXXX)</label>
            </div>
            <div class="input-group mb-4">
              <input type="email" id="signupEmail" class="input-field" placeholder=" " required>
              <label for="signupEmail" class="floating-label">Email Address</label>
            </div>
            <div class="input-group mb-2">
              <input type="password" id="signupPassword" class="input-field" placeholder=" " required minlength="6" oninput="checkPasswordStrength(this.value)">
              <label for="signupPassword" class="floating-label">Password</label>
              <button type="button" class="eye-btn" onclick="togglePassword('signupPassword', 'signupEyeIcon')" tabindex="-1">
                <svg id="signupEyeIcon" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
              </button>
            </div>
            <div class="flex items-center gap-2 mb-1">
              <div class="flex-1 h-1 bg-gray-200 rounded-full overflow-hidden">
                <div class="strength-bar" id="strengthBar"></div>
              </div>
              <span class="strength-text" id="strengthText" style="min-width:50px;text-align:right;"></span>
            </div>
            <div class="input-group mb-4">
              <input type="password" id="signupConfirm" class="input-field" placeholder=" " required minlength="6">
              <label for="signupConfirm" class="floating-label">Confirm Password</label>
              <button type="button" class="eye-btn" onclick="togglePassword('signupConfirm', 'confirmEyeIcon')" tabindex="-1">
                <svg id="confirmEyeIcon" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
              </button>
            </div>
            <div class="flex items-start gap-3 mb-5">
              <div class="checkbox-custom" id="termsCheck" onclick="toggleTerms()">
                <svg class="hidden" width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M2 6l3 3 5-5" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
              </div>
              <label class="text-sm text-gray-600 cursor-pointer select-none" onclick="toggleTerms()">
                I agree to the <a href="#" class="text-orange-500 font-medium" onclick="event.stopPropagation()">Terms of Service</a> & <a href="#" class="text-orange-500 font-medium" onclick="event.stopPropagation()">Privacy Policy</a>
              </label>
            </div>
            <button type="submit" class="btn-primary" id="signupBtn">
              <span id="signupBtnText">Create Account</span>
              <svg id="signupBtnSpinner" class="spinner hidden ml-2" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round"><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/></svg>
            </button>
          </form>
        </div>
      </div>

      <!-- Footer -->
      <p class="text-center text-xs text-gray-400 mt-6">&copy; 2026 Raja Brand. All rights reserved.</p>

    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <script>
    // Initialize EmailJS
    emailjs.init('y1nL04AHOFQQ7iffn');

    // Firebase Config
    const firebaseConfig = {
      apiKey: 'AIzaSyA2F4N12GGCWqM6Jo2RzVKforvgUTeY3jI',
      authDomain: 'rajabrand-4924d.firebaseapp.com',
      projectId: 'rajabrand-4924d',
      storageBucket: 'rajabrand-4924d.firebasestorage.app',
      messagingSenderId: '744956275932',
      appId: '1:744956275932:web:62fe87c9d5aeb4ab071819'
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();

    let termsAccepted = false;
    let generatedOTP = '';

    // === TAB SWITCHING ===
    function switchTab(tab) {
      const loginForm = document.getElementById('loginForm');
      const signupForm = document.getElementById('signupForm');
      const tabLogin = document.getElementById('tabLogin');
      const tabSignup = document.getElementById('tabSignup');
      if (tab === 'login') {
        loginForm.classList.remove('hidden');
        signupForm.classList.add('hidden');
        tabLogin.classList.add('active', 'text-orange-500', 'border-orange-600');
        tabLogin.classList.remove('text-gray-400', 'border-transparent');
        tabSignup.classList.remove('active', 'text-orange-500', 'border-orange-600');
        tabSignup.classList.add('text-gray-400', 'border-transparent');
      } else {
        loginForm.classList.add('hidden');
        signupForm.classList.remove('hidden');
        tabSignup.classList.add('active', 'text-orange-500', 'border-orange-600');
        tabSignup.classList.remove('text-gray-400', 'border-transparent');
        tabLogin.classList.remove('active', 'text-orange-500', 'border-orange-600');
        tabLogin.classList.add('text-gray-400', 'border-transparent');
      }
    }

    // === EYE TOGGLE ===
    function togglePassword(inputId, iconId) {
      const input = document.getElementById(inputId);
      const icon = document.getElementById(iconId);
      if (input.type === 'password') {
        input.type = 'text';
        icon.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>';
      } else {
        input.type = 'password';
        icon.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
      }
    }

    // === PASSWORD STRENGTH ===
    function checkPasswordStrength(password) {
      const bar = document.getElementById('strengthBar');
      const text = document.getElementById('strengthText');
      let score = 0;
      if (password.length >= 6) score++;
      if (password.length >= 10) score++;
      if (/[A-Z]/.test(password) && /[a-z]/.test(password)) score++;
      if (/\d/.test(password) && /[^A-Za-z0-9]/.test(password)) score++;

      bar.className = 'strength-bar';
      if (score === 0 || password.length === 0) {
        bar.style.width = '0'; text.textContent = '';
      } else if (score === 1) {
        bar.classList.add('weak'); text.textContent = 'Weak'; text.style.color = '#ef4444';
      } else if (score === 2) {
        bar.classList.add('fair'); text.textContent = 'Fair'; text.style.color = '#f97316';
      } else if (score === 3) {
        bar.classList.add('good'); text.textContent = 'Good'; text.style.color = '#eab308';
      } else {
        bar.classList.add('strong'); text.textContent = 'Strong'; text.style.color = '#FF6B35';
      }
    }

    // === TERMS CHECKBOX ===
    function toggleTerms() {
      const cb = document.getElementById('termsCheck');
      termsAccepted = !termsAccepted;
      cb.classList.toggle('checked');
      const svg = cb.querySelector('svg');
      svg.classList.toggle('hidden');
    }

    // === LOGIN HANDLER ===
    async function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value;
      const btn = document.getElementById('loginBtn');
      const btnText = document.getElementById('loginBtnText');
      const spinner = document.getElementById('loginBtnSpinner');

      btn.disabled = true;
      btnText.textContent = 'Logging in...';
      spinner.classList.remove('hidden');

      try {
        const users = JSON.parse(localStorage.getItem('raja_users') || '[]');
        const user = users.find(u => u.email === email && u.password === password);
        if (user) {
          localStorage.setItem('raja_current_user', JSON.stringify(user));
          showToast('Welcome back, ' + user.name + '!');
          setTimeout(() => { window.location.href = 'index.html'; }, 800);
        } else {
          const exists = users.find(u => u.email === email);
          if (!exists) {
            showToast('No account found with this email');
          } else {
            showToast('Incorrect password. Please try again.');
          }
          btn.disabled = false;
          btnText.textContent = 'Login';
          spinner.classList.add('hidden');
        }
      } catch (err) {
        showToast('Something went wrong. Please try again.');
        btn.disabled = false;
        btnText.textContent = 'Login';
        spinner.classList.add('hidden');
      }
    }

    // === SIGNUP HANDLER ===
    async function handleSignup(e) {
      e.preventDefault();
      if (!termsAccepted) {
        showToast('Please accept the Terms & Privacy Policy');
        return;
      }

      const name = document.getElementById('signupName').value.trim();
      const phone = document.getElementById('signupPhone').value.trim();
      const email = document.getElementById('signupEmail').value.trim();
      const password = document.getElementById('signupPassword').value;
      const confirm = document.getElementById('signupConfirm').value;

      if (!/^03[0-9]{9}$/.test(phone)) {
        showToast('Please enter a valid Pakistani phone number (03XXXXXXXXX)');
        return;
      }
      if (password !== confirm) {
        showToast('Passwords do not match');
        return;
      }

      const users = JSON.parse(localStorage.getItem('raja_users') || '[]');
      if (users.find(u => u.email === email)) {
        showToast('An account with this email already exists');
        return;
      }
      if (users.find(u => u.phone === phone)) {
        showToast('An account with this phone number already exists');
        return;
      }

      const btn = document.getElementById('signupBtn');
      const btnText = document.getElementById('signupBtnText');
      const spinner = document.getElementById('signupBtnSpinner');
      btn.disabled = true;
      btnText.textContent = 'Sending OTP...';
      spinner.classList.remove('hidden');

      generatedOTP = Math.floor(100000 + Math.random() * 900000).toString();

      const pendingUser = { name, phone, email, password };
      sessionStorage.setItem('raja_pending_user', JSON.stringify(pendingUser));

      try {
        await emailjs.send('service_94ybwiy', 'template_5e0vk2h', {
          to_name: name,
          to_email: email,
          otp_code: generatedOTP,
          from_name: 'Raja Brand'
        });
        showToast('OTP sent to ' + email);
        setTimeout(() => { window.location.href = 'signup-otp.html'; }, 600);
      } catch (err) {
        showToast('Failed to send OTP. Please check your email and try again.');
        btn.disabled = false;
        btnText.textContent = 'Create Account';
        spinner.classList.add('hidden');
      }
    }

    // === GOOGLE LOGIN ===
    function handleGoogleLogin() {
      const provider = new firebase.auth.GoogleAuthProvider();
      auth.signInWithPopup(provider)
        .then(async (result) => {
          const user = result.user;
          const users = JSON.parse(localStorage.getItem('raja_users') || '[]');
          let existing = users.find(u => u.email === user.email);
          if (!existing) {
            existing = {
              id: 'user_' + Date.now(),
              name: user.displayName || 'User',
              email: user.email,
              phone: user.phoneNumber || '',
              password: '',
              provider: 'google',
              createdAt: new Date().toISOString()
            };
            users.push(existing);
            localStorage.setItem('raja_users', JSON.stringify(users));
          }
          localStorage.setItem('raja_current_user', JSON.stringify(existing));
          showToast('Welcome, ' + existing.name + '!');
          setTimeout(() => { window.location.href = 'index.html'; }, 600);
        })
        .catch((err) => {
          if (err.code !== 'auth/popup-closed-by-user') {
            showToast('Google sign-in failed. Please try again.');
          }
        });
    }

    // === TOAST ===
    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 3000);
    }

    // === INPUT FLOAT LABEL FIX ===
    document.querySelectorAll('.input-field').forEach(el => {
      el.addEventListener('blur', function() {
        if (this.value) this.setAttribute('data-filled', 'true');
        else this.removeAttribute('data-filled');
      });
    });
  </script>

</body>
</html>
