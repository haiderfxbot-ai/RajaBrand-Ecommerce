<!DOCTYPE html>
<html lang="en" class="select-none overflow-x-hidden">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>My Orders — Raja Brand</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/@lottiefiles/lottie-player@latest/dist/lottie-player.js"></script>
  <style>
    :root{--primary:#FF6B35;--primary-dark:#E55A25;--primary-light:#FFE0D6;--secondary:#1A1A2E;--surface:#FFFFFF;--surface-variant:#F8F9FA;--on-surface:#1C1C1E;--outline:#E0E0E0;--success:#34C759;--warning:#FF9500;--error:#FF3B30;--info:#007AFF;}
    *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;font-family:'DM Sans',sans-serif;}
    body{background:var(--surface-variant);color:var(--on-surface);font-size:14px;line-height:1.6;padding-top:64px;padding-bottom:72px;min-height:100vh;}
    h1,h2,h3,h4,h5,h6{font-family:'Plus Jakarta Sans',sans-serif;}
    .material-symbols-rounded{font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24;vertical-align:middle;}
    .icon-fill{font-variation-settings:'FILL' 1,'wght' 400,'GRAD' 0,'opsz' 24;}
    ::-webkit-scrollbar{display:none;}
    .safe-bottom{padding-bottom:env(safe-area-inset-bottom,0px);}
    .header-blur{background:rgba(255,255,255,0.85);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);}
    .glass-nav{background:rgba(255,255,255,0.92);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);}
    .btn-press:active{transform:scale(0.96);}
    .toast{position:fixed;top:80px;right:16px;z-index:9999;padding:12px 20px;border-radius:12px;color:#fff;font-weight:500;box-shadow:0 4px 24px rgba(0,0,0,0.15);transform:translateX(120%);transition:transform .3s;max-width:320px;}
    .toast.show{transform:translateX(0);}
    .toast.success{background:var(--success);}
    .toast.error{background:var(--error);}
    .toast.info{background:var(--info);}
    .toast.warning{background:var(--warning);}
    .tab-btn{flex:1;padding:10px;text-align:center;font-weight:600;font-size:13px;border-bottom:2px solid transparent;transition:all .3s;cursor:pointer;}
    .tab-btn.active{color:var(--primary);border-bottom-color:var(--primary);}
    .tab-content{display:none;}
    .tab-content.active{display:block;animation:fadeUp .3s ease;}
    @keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
    .status-badge{padding:3px 12px;border-radius:100px;font-size:11px;font-weight:600;}
  </style>
</head>
<body>
<div id="toastContainer"></div>

<header class="fixed top-0 left-0 right-0 z-50 header-blur border-b border-gray-100/50">
  <div class="flex items-center justify-between px-4 h-16 safe-top">
    <button onclick="window.history.back()" class="w-10 h-10 flex items-center justify-center rounded-xl hover:bg-gray-100 btn-press"><span class="material-symbols-rounded text-gray-700 text-2xl">arrow_back</span></button>
    <span class="font-bold text-base" style="font-family:'Plus Jakarta Sans',sans-serif;">My Orders</span>
    <a href="cart.html" class="w-10 h-10 flex items-center justify-center rounded-xl hover:bg-gray-100 btn-press relative"><span class="material-symbols-rounded text-gray-700 text-2xl">shopping_bag</span><span id="cartBadge" class="absolute -top-0.5 -right-0.5 bg-red-500 text-white text-[10px] font-bold rounded-full min-w-[18px] h-[18px] flex items-center justify-center px-1 hidden">0</span></a>
  </div>
</header>

<nav class="fixed bottom-0 left-0 right-0 z-50 glass-nav border-t border-gray-100 safe-bottom" style="padding-bottom:env(safe-area-inset-bottom,4px);">
  <div class="flex items-center justify-around h-16">
    <a href="index.html" class="flex flex-col items-center gap-0.5 min-w-[48px] py-1"><span class="material-symbols-rounded text-xl text-gray-400">home</span><span class="text-[10px] text-gray-400">Home</span></a>
    <a href="product.html" class="flex flex-col items-center gap-0.5 min-w-[48px] py-1"><span class="material-symbols-rounded text-xl text-gray-400">grid_view</span><span class="text-[10px] text-gray-400">Products</span></a>
    <a href="orders.html" class="flex flex-col items-center gap-0.5 min-w-[48px] py-1"><span class="material-symbols-rounded icon-fill text-xl" style="color:var(--primary);">receipt_long</span><span class="text-[10px] font-medium" style="color:var(--primary);">Orders</span></a>
    <a href="wishlist.html" class="flex flex-col items-center gap-0.5 min-w-[48px] py-1"><span class="material-symbols-rounded text-xl text-gray-400">favorite</span><span class="text-[10px] text-gray-400">Wishlist</span></a>
    <a href="profile.html" class="flex flex-col items-center gap-0.5 min-w-[48px] py-1"><span class="material-symbols-rounded text-xl text-gray-400">person</span><span class="text-[10px] text-gray-400">Profile</span></a>
  </div>
</nav>

<div class="flex border-b border-gray-100 bg-white sticky top-16 z-30">
  <div class="tab-btn active" data-tab="active" onclick="switchTab('active')">Active Orders</div>
  <div class="tab-btn" data-tab="history" onclick="switchTab('history')">Order History</div>
</div>

<div class="px-4 py-4 tab-content active" id="tabActive"></div>
<div class="px-4 py-4 tab-content" id="tabHistory"></div>

<script>
  document.addEventListener('contextmenu',e=>e.preventDefault());
  document.addEventListener('selectstart',e=>e.preventDefault());
  document.addEventListener('keydown',e=>{if(e.ctrlKey&&['u','s','a','c','p'].includes(e.key.toLowerCase()))e.preventDefault();if(e.key==='F12')e.preventDefault();});
  document.querySelectorAll('img').forEach(img=>img.setAttribute('draggable','false'));

  const STORE={users:'raja_users',currentUser:'raja_current_user',products:'raja_products',categories:'raja_categories',orders:'raja_orders',cart:'raja_cart',wishlist:'raja_wishlist',notifications:'raja_notifications',settings:'raja_settings',coupons:'raja_coupons',recentSearch:'raja_recent_search'};
  function getLS(k){try{return JSON.parse(localStorage.getItem(k))}catch{return null}}
  function setLS(k,v){localStorage.setItem(k,JSON.stringify(v))}

  const user=getLS(STORE.currentUser);
  if(!user){window.location.href='login.html?redirect=orders.html';}

  function updateCartBadge(){const c=getLS(STORE.cart)||[];const b=document.getElementById('cartBadge');if(c.length>0){b.textContent=c.length;b.classList.remove('hidden');}else b.classList.add('hidden');}
  updateCartBadge();

  function showToast(msg,type='success'){
    const c=document.getElementById('toastContainer');
    const t=document.createElement('div');t.className=`toast ${type}`;t.textContent=msg;
    c.appendChild(t);requestAnimationFrame(()=>t.classList.add('show'));
    setTimeout(()=>{t.classList.remove('show');setTimeout(()=>t.remove(),300);},3000);
  }

  function getStatusBadge(status){
    const map={Placed:'bg-blue-100 text-blue-700',Dispatched:'bg-orange-100 text-orange-700',Delivered:'bg-green-100 text-green-700',Cancelled:'bg-red-100 text-red-700'};
    return `<span class="status-badge ${map[status]||'bg-gray-100 text-gray-700'}">${status}</span>`;
  }

  function renderOrders(){
    const allOrders=getLS(STORE.orders)||[];
    const userOrders=allOrders.filter(o=>o.user_id===user.email||o.user_id===user.email);

    const active=userOrders.filter(o=>o.status==='Placed'||o.status==='Dispatched'||o.status==='Out for Delivery');
    const history=userOrders.filter(o=>o.status==='Delivered'||o.status==='Cancelled');

    renderTab('tabActive',active,'No active orders');
    renderTab('tabHistory',history,'No order history');
  }

  function renderTab(tabId,orders,emptyMsg){
    const container=document.getElementById(tabId);
    if(orders.length===0){
      container.innerHTML=`<div class="flex flex-col items-center justify-center py-16"><lottie-player src="https://assets5.lottiefiles.com/packages/lf20_t9v9vnzm.json" background="transparent" speed="1" style="width:160px;height:160px;" loop autoplay></lottie-player><p class="text-gray-500 mt-4 text-sm">${emptyMsg}</p><a href="product.html" class="mt-3 px-6 py-2.5 rounded-xl text-sm font-bold text-white btn-press" style="background:var(--primary);">Shop Now</a></div>`;
      return;
    }
    container.innerHTML=orders.map(o=>{
      const firstItem=o.items&&o.items[0];
      const itemCount=o.items?o.items.reduce((s,i)=>s+i.quantity,0):0;
      return `<div class="p-4 rounded-xl bg-white shadow-sm border border-gray-50 mb-3">
        <div class="flex items-center justify-between mb-2">
          <span class="text-xs text-gray-400 font-mono">${o.id||'N/A'}</span>
          ${getStatusBadge(o.status)}
        </div>
        <div class="flex gap-3">
          <div class="w-16 h-16 rounded-xl overflow-hidden bg-gray-50 flex-shrink-0">${firstItem?`<img src="${firstItem.image}" alt="${firstItem.name}" class="w-full h-full object-cover" loading="lazy">`:''}</div>
          <div class="flex-1 min-w-0">
            <h4 class="text-sm font-bold line-clamp-1">${firstItem?firstItem.name:'Order'}</h4>
            <p class="text-xs text-gray-400">${itemCount} item${itemCount>1?'s':''} • ₹${o.total.toLocaleString()}</p>
            <p class="text-xs text-gray-400">${new Date(o.created_at).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'})}</p>
          </div>
        </div>
        <div class="flex gap-2 mt-3">
          <a href="order-track.html?id=${o.id}" class="flex-1 py-2 rounded-lg text-xs font-semibold text-center border border-gray-200 btn-press">Track Order</a>
          ${o.status==='Delivered'?`<button onclick="buyAgain('${o.id}')" class="flex-1 py-2 rounded-lg text-xs font-semibold text-center btn-press text-white" style="background:var(--primary);">Buy Again</button>`:''}
        </div>
      </div>`;
    }).join('');
  }

  function switchTab(tab){
    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c=>c.classList.remove('active'));
    document.querySelector(`.tab-btn[data-tab="${tab}"]`).classList.add('active');
    document.getElementById(`tab${tab.charAt(0).toUpperCase()+tab.slice(1)}`).classList.add('active');
  }

  function buyAgain(orderId){
    const orders=getLS(STORE.orders)||[];
    const order=orders.find(o=>o.id===orderId);
    if(!order)return;
    const cart=getLS(STORE.cart)||[];
    order.items.forEach(item=>{
      const existing=cart.find(i=>i.product_id===item.product_id);
      if(existing)existing.quantity+=item.quantity;
      else cart.push({product_id:item.product_id,product_name:item.name,product_image:item.image,price:item.price,quantity:item.quantity});
    });
    setLS(STORE.cart,cart);
    updateCartBadge();
    showToast('Items added to cart!','success');
  }

  renderOrders();
</script>
</body>
</html>
