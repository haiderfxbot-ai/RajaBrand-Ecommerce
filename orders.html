<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>My Orders - Raja</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  <link rel="stylesheet" href="assets/css/style.css">
  <script src="https://unpkg.com/@dotlottie/player-component@latest/dist/dotlottie-player.mjs" type="module"></script>
  <script src="assets/js/app.js"></script>
  <style>
    .tab-btn { transition: all 0.2s; }
    .status-placed { background: #FEF3C7; color: #D97706; }
    .status-confirmed { background: #DBEAFE; color: #2563EB; }
    .status-shipped { background: #E0E7FF; color: #4F46E5; }
    .status-outfordelivery { background: #DCFCE7; color: #16A34A; }
    .status-delivered { background: #DCFCE7; color: #15803D; }
    .status-cancelled { background: #FEE2E2; color: #DC2626; }
  </style>
</head>
<body>

<div id="app">
  <header class="fixed top-0 left-0 right-0 z-50 bg-white border-b border-gray-100">
    <div class="flex items-center justify-between px-4 h-14">
      <div class="flex items-center gap-2">
        <button onclick="goBack()" class="p-2 -ml-2 rounded-lg hover:bg-gray-50">
          <span class="material-symbols-rounded text-gray-700 text-2xl">arrow_back</span>
        </button>
        <h1 class="text-lg font-bold text-gray-900">My Orders</h1>
      </div>
    </div>
  </header>

  <main class="pt-14 px-4 pb-24">
    <!-- Tabs -->
    <div class="flex bg-white rounded-xl border border-gray-100 p-1 mt-3 mb-4">
      <button onclick="switchTab('active')" id="activeTab" class="tab-btn flex-1 py-2 text-sm font-semibold rounded-lg brand-bg text-white">Active</button>
      <button onclick="switchTab('history')" id="historyTab" class="tab-btn flex-1 py-2 text-sm font-semibold rounded-lg text-gray-500">History</button>
    </div>

    <!-- Orders List -->
    <div id="ordersContainer"></div>

    <!-- Empty State -->
    <div id="emptyOrders" class="hidden text-center py-16">
      <span class="material-symbols-rounded text-6xl text-gray-200">receipt_long</span>
      <h3 class="text-lg font-bold text-gray-800 mt-3">No Orders Yet</h3>
      <p class="text-sm text-gray-400 mt-1">Start shopping to place your first order!</p>
      <a href="product.html" class="inline-block mt-4 brand-gradient text-white px-6 py-2.5 rounded-xl font-bold text-sm">Shop Now</a>
    </div>
  </main>

  <!-- Bottom Nav -->
  <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 z-50 px-2" style="padding-bottom: env(safe-area-inset-bottom, 0px);">
    <div class="flex items-center justify-around h-16">
      <a href="index.html" class="flex flex-col items-center gap-0.5 text-gray-400">
        <span class="material-symbols-rounded text-2xl">home</span>
        <span class="text-[10px] font-medium">Home</span>
      </a>
      <a href="product.html" class="flex flex-col items-center gap-0.5 text-gray-400">
        <span class="material-symbols-rounded text-2xl">grid_view</span>
        <span class="text-[10px] font-medium">Products</span>
      </a>
      <a href="search.html" class="flex flex-col items-center gap-0.5 text-gray-400">
        <span class="material-symbols-rounded text-2xl">search</span>
        <span class="text-[10px] font-medium">Search</span>
      </a>
      <a href="wishlist.html" class="flex flex-col items-center gap-0.5 text-gray-400">
        <span class="material-symbols-rounded text-2xl">favorite</span>
        <span class="text-[10px] font-medium">Wishlist</span>
      </a>
      <a href="profile.html" class="flex flex-col items-center gap-0.5 text-gray-400">
        <span class="material-symbols-rounded text-2xl">person</span>
        <span class="text-[10px] font-medium">Profile</span>
      </a>
    </div>
  </nav>
</div>

<script>
function formatPrice(amount) {
  return 'Rs. ' + Number(amount).toLocaleString('en-PK');
}

function getCurrentUser() {
  const data = localStorage.getItem('raja_current_user');
  return data ? JSON.parse(data) : null;
}

function goBack() { window.history.back(); }

function authGuard() {
  const user = getCurrentUser();
  if (!user) {
    window.location.href = 'login.html?redirect=orders.html';
    return false;
  }
  return true;
}

function formatDate(d) {
  const date = new Date(d);
  return date.toLocaleDateString('en-PK', { day: 'numeric', month: 'short', year: 'numeric' });
}

let currentTab = 'active';

function switchTab(tab) {
  currentTab = tab;
  const activeBtn = document.getElementById('activeTab');
  const historyBtn = document.getElementById('historyTab');
  if (tab === 'active') {
    activeBtn.className = 'tab-btn flex-1 py-2 text-sm font-semibold rounded-lg brand-bg text-white';
    historyBtn.className = 'tab-btn flex-1 py-2 text-sm font-semibold rounded-lg text-gray-500';
  } else {
    historyBtn.className = 'tab-btn flex-1 py-2 text-sm font-semibold rounded-lg brand-bg text-white';
    activeBtn.className = 'tab-btn flex-1 py-2 text-sm font-semibold rounded-lg text-gray-500';
  }
  renderOrders();
}

function getStatusText(status) {
  const map = {
    'placed': 'Order Placed',
    'confirmed': 'Confirmed',
    'shipped': 'Shipped',
    'outfordelivery': 'Out for Delivery',
    'delivered': 'Delivered',
    'cancelled': 'Cancelled'
  };
  return map[status] || status;
}

function getStatusClass(status) {
  return 'status-' + status;
}

function renderOrders() {
  if (!authGuard()) return;

  const user = getCurrentUser();
  const allOrders = JSON.parse(localStorage.getItem('raja_orders') || '[]');
  const userOrders = allOrders.filter(o => o.userId === (user.id || user.email));

  const activeStatuses = ['placed', 'confirmed', 'shipped', 'outfordelivery'];
  const filtered = currentTab === 'active'
    ? userOrders.filter(o => activeStatuses.includes(o.status))
    : userOrders.filter(o => o.status === 'delivered' || o.status === 'cancelled');

  const container = document.getElementById('ordersContainer');
  const emptyState = document.getElementById('emptyOrders');

  if (filtered.length === 0) {
    container.innerHTML = '';
    emptyState.classList.remove('hidden');
    return;
  }

  emptyState.classList.add('hidden');

  container.innerHTML = filtered.map(order => {
    const itemCount = order.items.reduce((sum, item) => sum + (item.quantity || 1), 0);
    return `
      <div class="bg-white rounded-xl border border-gray-100 p-4 mb-3">
        <div class="flex items-center justify-between mb-2">
          <div>
            <p class="text-xs text-gray-400">Order ID</p>
            <p class="text-sm font-bold text-gray-800">${order.id}</p>
          </div>
          <span class="text-[11px] font-semibold px-2 py-1 rounded-full ${getStatusClass(order.status)}">${getStatusText(order.status)}</span>
        </div>
        <div class="flex items-center gap-2 text-sm text-gray-500 mb-3">
          <span class="material-symbols-rounded text-base">calendar_today</span>
          <span>${formatDate(order.date)}</span>
          <span class="mx-1">|</span>
          <span>${itemCount} item${itemCount !== 1 ? 's' : ''}</span>
        </div>
        <div class="flex items-center justify-between">
          <span class="text-base font-bold brand-text price-tag">${formatPrice(order.total)}</span>
          <a href="order-track.html?id=${order.id}" class="text-sm brand-text font-semibold flex items-center gap-1">
            Track Order <span class="material-symbols-rounded text-base">chevron_right</span>
          </a>
        </div>
        ${order.items ? `
          <div class="flex gap-2 mt-3 pt-3 border-t border-gray-100">
            ${order.items.slice(0, 4).map(item => `
              <div class="w-10 h-10 rounded-lg bg-gray-50 overflow-hidden">
                <img src="${item.image || 'https://picsum.photos/seed/order/400/500'}" class="w-full h-full object-cover" onerror="this.src='https://picsum.photos/seed/oerr/400/500'">
              </div>
            `).join('')}
            ${order.items.length > 4 ? `<div class="w-10 h-10 rounded-lg bg-gray-100 flex items-center justify-center text-xs font-bold text-gray-500">+${order.items.length - 4}</div>` : ''}
          </div>
        ` : ''}
      </div>
    `;
  }).join('');
}

window.addEventListener('DOMContentLoaded', renderOrders);
</script>
</body>
</html>
