      <div class="space-y-3" id="searchResultsList"></div>
    </div>

    <!-- Initial State -->

      <span class="material-symbols-rounded text-6xl text-gray-200">search</span>
      <h3 class="text-lg font-bold text-gray-800 mt-3">Search Products</h3>
      <p class="text-sm text-gray-400 mt-1">Find your favorite products from top Pakistani brands</p>
    </div>

    <!-- No Results -->
    <div id="noResults" class="hidden text-center py-16">
      <span class="material-symbols-rounded text-6xl text-gray-200">search_off</span>
      <h3 class="text-lg font-bold text-gray-800 mt-3">No Results Found</h3>

let allProducts = [];
const RECENT_KEY = 'raja_recent_searches';

function getRecentSearches() {
  return JSON.parse(localStorage.getItem(RECENT_KEY) || '[]');
}

function addRecentSearch(term) {
  const searches = getRecentSearches().filter(s => s !== term);
  searches.unshift(term);
  localStorage.setItem(RECENT_KEY, JSON.stringify(searches.slice(0, 10)));
}

function clearRecentSearches() {
  localStorage.setItem(RECENT_KEY, JSON.stringify([]));
  renderRecentSearches();
}

function renderRecentSearches() {
  const section = document.getElementById('recentSearchesSection');
  const list = document.getElementById('recentSearchesList');
  const searches = getRecentSearches();
  if (searches.length === 0) {
    section.classList.add('hidden');
    return;
  }
  section.classList.remove('hidden');
  list.innerHTML = searches.map(s => `
    <button onclick="searchTerm('${s.replace(/'/g, "\\'")}')" class="recent-chip flex items-center gap-1 px-3 py-1.5 bg-white rounded-full border border-gray-200 text-xs text-gray-600">
      <span class="material-symbols-rounded text-base text-gray-400">history</span> ${s}
    </button>
  `).join('');
}

function searchTerm(term) {
  document.getElementById('searchInput').value = term;
  doSearch();
}

function doSearch() {
  const query = document.getElementById('searchInput').value.trim();
  const recentSection = document.getElementById('recentSearchesSection');
  const resultsSection = document.getElementById('searchResultsSection');
  const initialState = document.getElementById('initialState');
  const noResults = document.getElementById('noResults');

  if (!query) {
    recentSection.classList.remove('hidden');
    resultsSection.classList.add('hidden');
    initialState.classList.remove('hidden');
    noResults.classList.add('hidden');
    return;
  }

  addRecentSearch(query);
  renderRecentSearches();

  const q = query.toLowerCase();
  const results = allProducts.filter(p =>
    p.name.toLowerCase().includes(q) ||
    p.brand.toLowerCase().includes(q) ||
    p.category.toLowerCase().includes(q) ||
    p.description.toLowerCase().includes(q)
  );

  recentSection.classList.add('hidden');
  initialState.classList.add('hidden');

  if (results.length === 0) {
    resultsSection.classList.add('hidden');
    noResults.classList.remove('hidden');
    return;
  }

  noResults.classList.add('hidden');
  resultsSection.classList.remove('hidden');

  document.getElementById('searchResultCount').textContent = results.length + ' result' + (results.length !== 1 ? 's' : '');

  const list = document.getElementById('searchResultsList');
  list.innerHTML = results.map(p => {
    const discount = p.originalPrice ? Math.round((1 - p.price / p.originalPrice) * 100) : 0;
    return `
      <div class="flex gap-3 bg-white rounded-xl border border-gray-100 p-3 cursor-pointer" onclick="goToProduct('${p.id}')">
        <div class="w-20 h-20 rounded-lg bg-gray-50 overflow-hidden flex-shrink-0">
          <img src="${p.image}" alt="${p.name}" class="w-full h-full object-cover" onerror="this.src='https://picsum.photos/seed/serr${p.id}/400/500'">
        </div>
        <div class="flex-1 min-w-0">
          <p class="text-[11px] text-gray-400 font-medium">${p.brand}</p>
          <h3 class="text-sm font-semibold text-gray-800 line-clamp-2 leading-tight">${p.name}</h3>
          <div class="flex items-center gap-2 mt-1">
            <span class="text-sm font-bold brand-text price-tag">${formatPrice(p.price)}</span>
            ${p.originalPrice ? `<span class="text-[11px] text-gray-400 line-through price-tag">${formatPrice(p.originalPrice)}</span>` : ''}
            ${discount > 0 ? `<span class="text-[10px] font-bold text-white brand-bg px-1 py-0.5 rounded">-${discount}%</span>` : ''}
          </div>
          <div class="flex items-center gap-1 mt-0.5">
            <span class="material-symbols-rounded text-yellow-500 text-xs">star</span>
            <span class="text-[10px] text-gray-500">${p.rating}</span>
          </div>
        </div>
      </div>
    `;
  }).join('');
}

function clearSearch() {
  document.getElementById('searchInput').value = '';
  document.getElementById('searchResultsSection').classList.add('hidden');
  document.getElementById('noResults').classList.add('hidden');
  document.getElementById('initialState').classList.remove('hidden');
  document.getElementById('recentSearchesSection').classList.remove('hidden');
  renderRecentSearches();
  document.getElementById('searchInput').blur();
}

window.addEventListener('DOMContentLoaded', () => {
  seedDataIfEmpty();
  allProducts = JSON.parse(localStorage.getItem('raja_products') || '[]');
  renderRecentSearches();
  document.getElementById('searchInput').focus();
});
</script>
