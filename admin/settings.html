<!DOCTYPE html>
<html lang="en" class="select-none overflow-x-hidden">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Settings — Raja Brand Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{--primary:#16A34A;--primary-dark:#15803D;--primary-light:#DCFCE7;--secondary:#1A1A2E;--surface:#FFFFFF;--surface-variant:#F8F9FA;--on-surface:#1C1C1E;--outline:#E0E0E0;--success:#34C759;--warning:#FF9500;--error:#FF3B30;--info:#007AFF;}
    *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;font-family:'DM Sans',sans-serif;}
    body{background:var(--surface-variant);color:var(--on-surface);font-size:14px;line-height:1.6;padding-top:64px;padding-bottom:40px;overflow-x:hidden;overflow-y:auto;}
    h1,h2,h3,h4,h5,h6{font-family:'Plus Jakarta Sans',sans-serif;}
    .material-symbols-rounded{font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24;vertical-align:middle;}
    .btn-press:active{transform:scale(0.96);}
    .toast{position:fixed;top:80px;right:16px;z-index:9999;padding:12px 20px;border-radius:12px;color:#fff;font-weight:500;box-shadow:0 4px 24px rgba(0,0,0,0.15);transform:translateX(120%);transition:transform .3s;max-width:320px;}
    .toast.show{transform:translateX(0);}
    .toast.success{background:var(--success);}
    .toast.error{background:var(--error);}
    .toast.info{background:var(--info);}
    .sidebar{position:fixed;left:0;top:0;bottom:0;width:240px;background:var(--secondary);color:#fff;padding-top:64px;transform:translateX(-100%);transition:transform .3s;z-index:40;}
    .sidebar.open{transform:translateX(0);}
    @media(min-width:768px){.sidebar{transform:translateX(0);}body{padding-left:240px;}}
  </style>
</head>
<body>
<div id="toastContainer"></div>

<div class="sidebar" id="sidebar">
  <div class="p-5 border-b border-white/10">
    <div class="flex items-center gap-2"><span class="text-xl font-extrabold" style="color:var(--primary);font-family:'Plus Jakarta Sans',sans-serif;">RAJA</span><span class="text-sm font-light text-white/60">Admin</span></div>
  </div>
  <nav class="p-3 space-y-1">
    <a href="dashboard.html" class="flex items-center gap-3 px-4 py-2.5 rounded-xl text-sm font-medium text-white/60 hover:bg-white/5"><span class="material-symbols-rounded text-lg">dashboard</span> Dashboard</a>
    <a href="products.html" class="flex items-center gap-3 px-4 py-2.5 rounded-xl text-sm font-medium text-white/60 hover:bg-white/5"><span class="material-symbols-rounded text-lg">inventory_2</span> Products</a>
    <a href="categories.html" class="flex items-center gap-3 px-4 py-2.5 rounded-xl text-sm font-medium text-white/60 hover:bg-white/5"><span class="material-symbols-rounded text-lg">category</span> Categories</a>
    <a href="orders.html" class="flex items-center gap-3 px-4 py-2.5 rounded-xl text-sm font-medium text-white/60 hover:bg-white/5"><span class="material-symbols-rounded text-lg">receipt_long</span> Orders</a>
    <a href="users.html" class="flex items-center gap-3 px-4 py-2.5 rounded-xl text-sm font-medium text-white/60 hover:bg-white/5"><span class="material-symbols-rounded text-lg">group</span> Users</a>
    <a href="settings.html" class="flex items-center gap-3 px-4 py-2.5 rounded-xl text-sm font-medium" style="background:rgba(22,163,74,0.2);color:var(--primary);"><span class="material-symbols-rounded icon-fill text-lg">settings</span> Settings</a>
    <hr class="border-white/10 my-3">
    <button onclick="adminLogout()" class="flex items-center gap-3 px-4 py-2.5 rounded-xl text-sm font-medium text-red-400 hover:bg-red-500/10 w-full"><span class="material-symbols-rounded text-lg">logout</span> Logout</button>
  </nav>
</div>

<header class="fixed top-0 left-0 right-0 z-50 bg-white border-b border-gray-100" style="z-index:45;">
  <div class="flex items-center justify-between px-4 h-16 safe-top">
    <button onclick="toggleSidebar()" class="w-10 h-10 flex items-center justify-center rounded-xl hover:bg-gray-100 btn-press md:hidden"><span class="material-symbols-rounded text-gray-700 text-2xl">menu</span></button>
    <span class="font-bold text-base" style="font-family:'Plus Jakarta Sans',sans-serif;">Settings</span>
    <div class="w-10"></div>
  </div>
</header>

<div class="px-4 py-4 space-y-4">
  <div class="p-4 rounded-xl bg-white shadow-sm border border-gray-50">
    <h3 class="text-sm font-bold mb-3" style="font-family:'Plus Jakarta Sans',sans-serif;">Store Information</h3>
    <div class="space-y-3">
      <div><label class="text-sm font-medium mb-1 block">Store Name</label><input type="text" id="sName" class="w-full px-3 py-2.5 rounded-xl border border-gray-200 text-sm focus:outline-none focus:border-green-400"></div>
      <div><label class="text-sm font-medium mb-1 block">Contact Email</label><input type="email" id="sEmail" class="w-full px-3 py-2.5 rounded-xl border border-gray-200 text-sm focus:outline-none focus:border-green-400"></div>
      <div><label class="text-sm font-medium mb-1 block">Contact Phone</label><input type="tel" id="sPhone" class="w-full px-3 py-2.5 rounded-xl border border-gray-200 text-sm focus:outline-none focus:border-green-400"></div>
      <div><label class="text-sm font-medium mb-1 block">Address</label><input type="text" id="sAddress" class="w-full px-3 py-2.5 rounded-xl border border-gray-200 text-sm focus:outline-none focus:border-green-400"></div>
      <div><label class="text-sm font-medium mb-1 block">Currency Symbol</label><input type="text" id="sCurrency" value="Rs." disabled class="w-full px-3 py-2.5 rounded-xl border border-gray-200 text-sm bg-gray-50 text-gray-500"></div>
      <button onclick="saveSettings()" class="w-full py-2.5 rounded-xl text-sm font-bold text-white btn-press" style="background:var(--primary);">Save Settings</button>
    </div>
  </div>

  <div class="p-4 rounded-xl bg-white shadow-sm border border-gray-50">
    <h3 class="text-sm font-bold mb-3" style="font-family:'Plus Jakarta Sans',sans-serif;">Change Admin Password</h3>
    <div class="space-y-3">
      <div><label class="text-sm font-medium mb-1 block">Current Password</label><input type="password" id="adminCurrPass" class="w-full px-3 py-2.5 rounded-xl border border-gray-200 text-sm focus:outline-none focus:border-green-400"></div>
      <div><label class="text-sm font-medium mb-1 block">New Password</label><input type="password" id="adminNewPass" class="w-full px-3 py-2.5 rounded-xl border border-gray-200 text-sm focus:outline-none focus:border-green-400"></div>
      <div><label class="text-sm font-medium mb-1 block">Confirm New Password</label><input type="password" id="adminConfirmPass" class="w-full px-3 py-2.5 rounded-xl border border-gray-200 text-sm focus:outline-none focus:border-green-400"></div>
      <button onclick="changeAdminPass()" class="w-full py-2.5 rounded-xl text-sm font-bold text-white btn-press" style="background:var(--primary);">Update Password</button>
    </div>
  </div>
</div>

<script>
  document.addEventListener('contextmenu',e=>e.preventDefault());
  document.addEventListener('selectstart',e=>e.preventDefault());
  document.addEventListener('keydown',e=>{if(e.ctrlKey&&['u','s','a','c','p'].includes(e.key.toLowerCase()))e.preventDefault();if(e.key==='F12')e.preventDefault();});

  function requireAdmin(){if(localStorage.getItem('raja_admin_session')!=='true')window.location.href='login.html';}
  requireAdmin();

  function adminLogout(){localStorage.removeItem('raja_admin_session');window.location.href='login.html';}
  function toggleSidebar(){document.getElementById('sidebar').classList.toggle('open');}

  const STORE={settings:'raja_settings',admin:'raja_admin'};
  function getLS(k){try{return JSON.parse(localStorage.getItem(k))}catch{return null}}
  function setLS(k,v){localStorage.setItem(k,JSON.stringify(v))}

  function showToast(msg,type='success'){
    const c=document.getElementById('toastContainer');
    const t=document.createElement('div');t.className=`toast ${type}`;t.textContent=msg;
    c.appendChild(t);requestAnimationFrame(()=>t.classList.add('show'));
    setTimeout(()=>{t.classList.remove('show');setTimeout(()=>t.remove(),300);},3000);
  }

  function loadSettings(){
    const s=getLS(STORE.settings)||{storeName:'Raja Brand',contactEmail:'support@rajabrand.pk',contactPhone:'+92 300 1234567',address:'Karachi, Sindh, Pakistan',currency:'Rs.'};
    document.getElementById('sName').value=s.storeName||'';
    document.getElementById('sEmail').value=s.contactEmail||'';
    document.getElementById('sPhone').value=s.contactPhone||'';
    document.getElementById('sAddress').value=s.address||'';
  }

  function saveSettings(){
    const s=getLS(STORE.settings)||{};
    s.storeName=document.getElementById('sName').value.trim();
    s.contactEmail=document.getElementById('sEmail').value.trim();
    s.contactPhone=document.getElementById('sPhone').value.trim();
    s.address=document.getElementById('sAddress').value.trim();
    s.currency='Rs.';
    setLS(STORE.settings,s);
    showToast('Settings saved!','success');
  }

  function changeAdminPass(){
    const curr=document.getElementById('adminCurrPass').value;
    const newp=document.getElementById('adminNewPass').value;
    const confirm=document.getElementById('adminConfirmPass').value;
    const admin=getLS(STORE.admin)||{username:'admin',password:'admin123'};
    if(curr!==admin.password){showToast('Current password is incorrect','error');return;}
    if(newp.length<6){showToast('New password must be at least 6 characters','error');return;}
    if(newp!==confirm){showToast('Passwords do not match','error');return;}
    admin.password=newp;
    setLS(STORE.admin,admin);
    document.getElementById('adminCurrPass').value='';
    document.getElementById('adminNewPass').value='';
    document.getElementById('adminConfirmPass').value='';
    showToast('Admin password updated!','success');
  }

  loadSettings();
</script>
</body>
</html>
