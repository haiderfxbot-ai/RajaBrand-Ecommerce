<!DOCTYPE html>
<html lang="en" class="select-none overflow-x-hidden">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Admin Dashboard — Raja Brand</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{--primary:#16A34A;--primary-dark:#15803D;--primary-light:#DCFCE7;--secondary:#1A1A2E;--surface:#FFFFFF;--surface-variant:#F8F9FA;--on-surface:#1C1C1E;--outline:#E0E0E0;--success:#34C759;--warning:#FF9500;--error:#FF3B30;--info:#007AFF;}
    *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;font-family:'DM Sans',sans-serif;}
    body{background:var(--surface-variant);color:var(--on-surface);font-size:14px;line-height:1.6;padding-top:64px;padding-bottom:40px;overflow-x:hidden;overflow-y:auto;}
    h1,h2,h3,h4,h5,h6{font-family:'Plus Jakarta Sans',sans-serif;}
    .material-symbols-rounded{font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24;vertical-align:middle;}
    .icon-fill{font-variation-settings:'FILL' 1,'wght' 400,'GRAD' 0,'opsz' 24;}
    ::-webkit-scrollbar{display:none;}
    .safe-bottom{padding-bottom:env(safe-area-inset-bottom,0px);}
    .btn-press:active{transform:scale(0.96);}
    .card-hover{transition:all .3s ease;}
    .card-hover:hover{transform:translateY(-3px);box-shadow:0 8px 24px rgba(0,0,0,0.1);}
    .sidebar{position:fixed;left:0;top:0;bottom:0;width:240px;background:var(--secondary);color:#fff;padding-top:64px;transform:translateX(-100%);transition:transform .3s;z-index:40;}
    .sidebar.open{transform:translateX(0);}
    @media(min-width:768px){.sidebar{transform:translateX(0);}body{padding-left:240px;}}
  </style>
</head>
<body>
<div class="sidebar" id="sidebar">
  <div class="p-5 border-b border-white/10">
    <div class="flex items-center gap-2"><span class="text-xl font-extrabold" style="color:var(--primary);font-family:'Plus Jakarta Sans',sans-serif;">RAJA</span><span class="text-sm font-light text-white/60">Admin</span></div>
  </div>
  <nav class="p-3 space-y-1">
    <a href="dashboard.html" class="flex items-center gap-3 px-4 py-2.5 rounded-xl text-sm font-medium" style="background:rgba(22,163,74,0.2);color:var(--primary);"><span class="material-symbols-rounded icon-fill text-lg">dashboard</span> Dashboard</a>
    <a href="products.html" class="flex items-center gap-3 px-4 py-2.5 rounded-xl text-sm font-medium text-white/60 hover:bg-white/5"><span class="material-symbols-rounded text-lg">inventory_2</span> Products</a>
    <a href="categories.html" class="flex items-center gap-3 px-4 py-2.5 rounded-xl text-sm font-medium text-white/60 hover:bg-white/5"><span class="material-symbols-rounded text-lg">category</span> Categories</a>
    <a href="orders.html" class="flex items-center gap-3 px-4 py-2.5 rounded-xl text-sm font-medium text-white/60 hover:bg-white/5"><span class="material-symbols-rounded text-lg">receipt_long</span> Orders</a>
    <a href="users.html" class="flex items-center gap-3 px-4 py-2.5 rounded-xl text-sm font-medium text-white/60 hover:bg-white/5"><span class="material-symbols-rounded text-lg">group</span> Users</a>
    <a href="settings.html" class="flex items-center gap-3 px-4 py-2.5 rounded-xl text-sm font-medium text-white/60 hover:bg-white/5"><span class="material-symbols-rounded text-lg">settings</span> Settings</a>
    <hr class="border-white/10 my-3">
    <a href="../index.html" class="flex items-center gap-3 px-4 py-2.5 rounded-xl text-sm font-medium text-white/40 hover:bg-white/5"><span class="material-symbols-rounded text-lg">store</span> View Store</a>
    <button onclick="adminLogout()" class="flex items-center gap-3 px-4 py-2.5 rounded-xl text-sm font-medium text-red-400 hover:bg-red-500/10 w-full"><span class="material-symbols-rounded text-lg">logout</span> Logout</button>
  </nav>
</div>

<header class="fixed top-0 left-0 right-0 z-50 bg-white border-b border-gray-100" style="z-index:45;">
  <div class="flex items-center justify-between px-4 h-16 safe-top">
    <button onclick="toggleSidebar()" class="w-10 h-10 flex items-center justify-center rounded-xl hover:bg-gray-100 btn-press md:hidden"><span class="material-symbols-rounded text-gray-700 text-2xl">menu</span></button>
    <span class="font-bold text-base" style="font-family:'Plus Jakarta Sans',sans-serif;">Dashboard</span>
    <div class="flex items-center gap-2">
      <span class="text-sm text-gray-500 hidden sm:inline" id="adminName">Admin</span>
      <button onclick="adminLogout()" class="text-sm font-medium px-3 py-1.5 rounded-lg hover:bg-gray-100 btn-press flex items-center gap-1" style="color:var(--error);"><span class="material-symbols-rounded text-lg">logout</span> <span class="hidden sm:inline">Logout</span></button>
    </div>
  </div>
</header>

<main class="p-4">
  <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-5" id="statsGrid"></div>

  <div class="p-4 rounded-xl bg-white shadow-sm border border-gray-50 mb-4">
    <div class="flex items-center justify-between mb-3"><h3 class="text-sm font-bold" style="font-family:'Plus Jakarta Sans',sans-serif;">Recent Orders</h3><a href="orders.html" class="text-xs font-medium" style="color:var(--primary);">View All</a></div>
    <div id="recentOrdersTable" class="text-sm"></div>
  </div>

  <div class="p-4 rounded-xl bg-white shadow-sm border border-gray-50">
    <div class="flex items-center justify-between mb-3"><h3 class="text-sm font-bold" style="font-family:'Plus Jakarta Sans',sans-serif;">Low Stock Alerts</h3></div>
    <div id="lowStockAlerts" class="text-sm"></div>
  </div>
</main>

<script>
  document.addEventListener('contextmenu',e=>e.preventDefault());
  document.addEventListener('selectstart',e=>e.preventDefault());
  document.addEventListener('keydown',e=>{if(e.ctrlKey&&['u','s','a','c','p'].includes(e.key.toLowerCase()))e.preventDefault();if(e.key==='F12')e.preventDefault();});

  function requireAdmin(){if(localStorage.getItem('raja_admin_session')!=='true')window.location.href='login.html';}
  requireAdmin();

  const STORE={products:'raja_products',categories:'raja_categories',orders:'raja_orders',users:'raja_users',cart:'raja_cart',wishlist:'raja_wishlist',notifications:'raja_notifications',settings:'raja_settings',coupons:'raja_coupons'};
  function getLS(k){try{return JSON.parse(localStorage.getItem(k))}catch{return null}}
  function setLS(k,v){localStorage.setItem(k,JSON.stringify(v))}
  function formatPrice(a){return 'Rs. '+Number(a).toLocaleString('en-PK')}

  function seedData(){
    if(getLS(STORE.products)&&getLS(STORE.products).length>0)return;
    const cats=[{id:'cat_001',name:'Electronics',icon:'devices',color:'#007AFF'},{id:'cat_002',name:'Clothing',icon:'checkroom',color:'#16A34A'},{id:'cat_003',name:'Shoes',icon:'footprint',color:'#34C759'},{id:'cat_004',name:'Accessories',icon:'watch',color:'#FF9500'},{id:'cat_005',name:'Home & Living',icon:'chair',color:'#AF52DE'},{id:'cat_006',name:'Beauty',icon:'spa',color:'#FF2D55'}];
    setLS(STORE.categories,cats);
    const prods=[];for(let i=1;i<=16;i++){prods.push({id:'prod_'+String(i).padStart(3,'0'),cat_id:cats[i%cats.length].id,name:'Product '+i,description:'Description for product '+i,price:Math.floor(Math.random()*5000)+299,original_price:Math.floor(Math.random()*8000)+999,discount:Math.floor(Math.random()*50)+10,stock:Math.floor(Math.random()*200)+10,images:['https://picsum.photos/400/400?random='+i],video_url:'',rating:(Math.random()*2+3).toFixed(1),reviews:Math.floor(Math.random()*500)+10,tags:['featured'],created_at:new Date(Date.now()-Math.random()*30*86400000).toISOString().split('T')[0]});}
    setLS(STORE.products,prods);
    if(!getLS(STORE.orders))setLS(STORE.orders,[]);
    if(!getLS(STORE.users))setLS(STORE.users,[]);
    if(!getLS(STORE.settings))setLS(STORE.settings,{storeName:'Raja Brand',storeLogo:'',contactEmail:'support@rajabrand.pk',contactPhone:'+92 300 1234567',currency:'Rs.',adminPassword:'admin123'});
  }
  seedData();

  function adminLogout(){localStorage.removeItem('raja_admin_session');window.location.href='login.html';}
  function toggleSidebar(){document.getElementById('sidebar').classList.toggle('open');}

  function loadDashboard(){
    const orders=getLS(STORE.orders)||[];
    const users=getLS(STORE.users)||[];
    const products=getLS(STORE.products)||[];
    const totalRevenue=orders.filter(o=>o.status==='Delivered').reduce((s,o)=>s+o.total,0);
    const pendingOrders=orders.filter(o=>o.status==='Pending'||o.status==='Placed').length;
    const lowStock=products.filter(p=>p.stock<=10);

    document.getElementById('statsGrid').innerHTML=`
      <div class="p-4 rounded-xl bg-white shadow-sm border border-gray-50 card-hover"><span class="material-symbols-rounded text-2xl" style="color:var(--primary);">inventory_2</span><p class="text-2xl font-bold mt-2" style="font-family:'Plus Jakarta Sans',sans-serif;">${products.length}</p><p class="text-xs text-gray-500">Products</p></div>
      <div class="p-4 rounded-xl bg-white shadow-sm border border-gray-50 card-hover"><span class="material-symbols-rounded text-2xl" style="color:var(--info);">receipt_long</span><p class="text-2xl font-bold mt-2" style="font-family:'Plus Jakarta Sans',sans-serif;">${orders.length}</p><p class="text-xs text-gray-500">Orders</p></div>
      <div class="p-4 rounded-xl bg-white shadow-sm border border-gray-50 card-hover"><span class="material-symbols-rounded text-2xl" style="color:var(--success);">group</span><p class="text-2xl font-bold mt-2" style="font-family:'Plus Jakarta Sans',sans-serif;">${users.length}</p><p class="text-xs text-gray-500">Users</p></div>
      <div class="p-4 rounded-xl bg-white shadow-sm border border-gray-50 card-hover"><span class="material-symbols-rounded text-2xl" style="color:var(--primary);">payments</span><p class="text-2xl font-bold mt-2" style="font-family:'Plus Jakarta Sans',sans-serif;">${formatPrice(totalRevenue)}</p><p class="text-xs text-gray-500">Revenue</p></div>
    `;

    const recent=orders.slice(0,5);
    const table=document.getElementById('recentOrdersTable');
    if(recent.length===0)table.innerHTML='<p class="text-sm text-gray-400 text-center py-4">No orders yet</p>';
    else table.innerHTML=`<div class="overflow-x-auto"><table class="w-full text-xs"><thead><tr class="text-gray-400 border-b border-gray-100"><th class="text-left py-2 px-1">ID</th><th class="text-left py-2 px-1">Customer</th><th class="text-right py-2 px-1">Total</th><th class="text-center py-2 px-1">Status</th><th class="text-center py-2 px-1">Action</th></tr></thead><tbody>${recent.map(o=>`<tr class="border-b border-gray-50"><td class="py-2 px-1 font-mono">${o.id.slice(-8)}</td><td class="py-2 px-1">${o.address?.name||'N/A'}</td><td class="py-2 px-1 text-right font-medium">${formatPrice(o.total)}</td><td class="py-2 px-1 text-center"><span class="px-2 py-0.5 rounded-full text-[10px] font-medium ${o.status==='Delivered'?'bg-green-100 text-green-700':o.status==='Cancelled'?'bg-red-100 text-red-700':o.status==='Shipped'?'bg-orange-100 text-orange-700':o.status==='Confirmed'?'bg-blue-100 text-blue-700':'bg-yellow-100 text-yellow-700'}">${o.status}</span></td><td class="py-2 px-1 text-center"><a href="order-detail.html?id=${o.id}" class="font-medium" style="color:var(--primary);">View</a></td></tr>`).join('')}</tbody></table></div>`;

    const lowEl=document.getElementById('lowStockAlerts');
    if(lowStock.length===0)lowEl.innerHTML='<p class="text-sm text-green-600 flex items-center gap-1"><span class="material-symbols-rounded text-lg">check_circle</span> All products are well stocked.</p>';
    else lowEl.innerHTML=lowStock.map(p=>`<div class="flex items-center justify-between py-2 border-b border-gray-50 last:border-0"><div class="flex items-center gap-2"><div class="w-8 h-8 rounded-lg bg-gray-50 overflow-hidden"><img src="${p.images?.[0]||'https://picsum.photos/100/100'}" class="w-full h-full object-cover"></div><span class="text-sm font-medium">${p.name}</span></div><span class="text-xs font-bold text-red-500">Stock: ${p.stock}</span></div>`).join('');
  }

  loadDashboard();
</script>
</body>
</html>
