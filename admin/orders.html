<!DOCTYPE html>
<html lang="en" class="select-none overflow-x-hidden">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Orders — Raja Brand Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{--primary:#FF6B35;--primary-dark:#E55A25;--primary-light:#FFE0D6;--secondary:#1A1A2E;--surface:#FFFFFF;--surface-variant:#F8F9FA;--on-surface:#1C1C1E;--outline:#E0E0E0;--success:#34C759;--warning:#FF9500;--error:#FF3B30;--info:#007AFF;}
    *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;font-family:'DM Sans',sans-serif;}
    body{background:var(--surface-variant);color:var(--on-surface);font-size:14px;line-height:1.6;padding-top:64px;padding-bottom:72px;}
    h1,h2,h3,h4,h5,h6{font-family:'Plus Jakarta Sans',sans-serif;}
    .material-symbols-rounded{font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24;vertical-align:middle;}
    ::-webkit-scrollbar{display:none;}
    .btn-press:active{transform:scale(0.96);}
    .status-chip{padding:3px 12px;border-radius:100px;font-size:11px;font-weight:600;cursor:pointer;}
  </style>
</head>
<body>
<header class="fixed top-0 left-0 right-0 z-50 bg-white border-b border-gray-100">
  <div class="flex items-center justify-between px-4 h-16 safe-top">
    <a href="dashboard.html" class="w-10 h-10 flex items-center justify-center rounded-xl hover:bg-gray-100 btn-press"><span class="material-symbols-rounded text-gray-700 text-2xl">arrow_back</span></a>
    <span class="font-bold text-base" style="font-family:'Plus Jakarta Sans',sans-serif;">Orders</span>
    <div class="w-10"></div>
  </div>
</header>

<div class="px-4 py-3 flex gap-2 overflow-x-auto" id="statusFilters">
  <button class="status-chip text-white" style="background:var(--primary);" onclick="filterByStatus('')">All</button>
  <button class="status-chip bg-blue-100 text-blue-700" onclick="filterByStatus('Placed')">Placed</button>
  <button class="status-chip bg-orange-100 text-orange-700" onclick="filterByStatus('Dispatched')">Dispatched</button>
  <button class="status-chip bg-green-100 text-green-700" onclick="filterByStatus('Delivered')">Delivered</button>
  <button class="status-chip bg-red-100 text-red-700" onclick="filterByStatus('Cancelled')">Cancelled</button>
</div>

<div class="px-4 overflow-x-auto">
  <table class="w-full text-sm" id="ordersTable">
    <thead><tr class="text-gray-400 border-b border-gray-100"><th class="text-left py-2 pr-2">Order ID</th><th class="text-left py-2 px-2">Customer</th><th class="text-right py-2 px-2">Total</th><th class="text-center py-2 px-2">Status</th><th class="text-center py-2">Action</th></tr></thead>
    <tbody id="ordersList"></tbody>
  </table>
</div>

<script>
  document.addEventListener('contextmenu',e=>e.preventDefault());
  document.addEventListener('selectstart',e=>e.preventDefault());
  document.addEventListener('keydown',e=>{if(e.ctrlKey&&['u','s','a','c','p'].includes(e.key.toLowerCase()))e.preventDefault();if(e.key==='F12')e.preventDefault();});

  if(localStorage.getItem('raja_admin_session')!=='true')window.location.href='login.html';

  const STORE={orders:'raja_orders'};
  function getLS(k){try{return JSON.parse(localStorage.getItem(k))}catch{return null}}
  function setLS(k,v){localStorage.setItem(k,JSON.stringify(v))}

  let currentStatus='';

  function renderOrders(){
    let orders=getLS(STORE.orders)||[];
    if(currentStatus)orders=orders.filter(o=>o.status===currentStatus);
    const list=document.getElementById('ordersList');
    if(orders.length===0){list.innerHTML='<tr><td colspan="5" class="text-center py-8 text-gray-400">No orders found</td></tr>';return;}
    list.innerHTML=orders.map(o=>`<tr class="border-b border-gray-50"><td class="py-3 pr-2 font-mono text-xs">${o.id}</td><td class="py-3 px-2">${o.address?.name||'N/A'}</td><td class="py-3 px-2 text-right font-medium">₹${(o.total||0).toLocaleString()}</td><td class="py-3 px-2 text-center"><span class="px-2 py-0.5 rounded-full text-[10px] font-medium ${o.status==='Delivered'?'bg-green-100 text-green-700':o.status==='Cancelled'?'bg-red-100 text-red-700':o.status==='Dispatched'?'bg-orange-100 text-orange-700':'bg-blue-100 text-blue-700'}">${o.status}</span></td><td class="py-3 text-center"><a href="order-detail.html?id=${o.id}" class="text-orange-500 text-xs font-medium">View</a></td></tr>`).join('');
  }

  function filterByStatus(s){currentStatus=s;renderOrders();document.querySelectorAll('.status-chip').forEach(c=>{c.style.background='';c.style.color='';c.classList.remove('text-white');});const chips=document.querySelectorAll('.status-chip');chips.forEach(c=>{if((!s&&c.textContent==='All')||c.textContent===s){c.style.background='var(--primary)';c.style.color='#fff';}});}
  filterByStatus('');
</script>
</body>
</html>
