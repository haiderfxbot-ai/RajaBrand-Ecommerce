<!DOCTYPE html>
<html lang="en" class="select-none overflow-x-hidden">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Users — Raja Brand Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{--primary:#FF6B35;--primary-dark:#E55A25;--primary-light:#FFE0D6;--secondary:#1A1A2E;--surface:#FFFFFF;--surface-variant:#F8F9FA;--on-surface:#1C1C1E;--outline:#E0E0E0;--success:#34C759;--warning:#FF9500;--error:#FF3B30;--info:#007AFF;}
    *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;font-family:'DM Sans',sans-serif;}
    body{background:var(--surface-variant);color:var(--on-surface);font-size:14px;line-height:1.6;padding-top:64px;padding-bottom:72px;}
    h1,h2,h3,h4,h5,h6{font-family:'Plus Jakarta Sans',sans-serif;}
    .material-symbols-rounded{font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24;vertical-align:middle;}
    .btn-press:active{transform:scale(0.96);}
  </style>
</head>
<body>
<header class="fixed top-0 left-0 right-0 z-50 bg-white border-b border-gray-100">
  <div class="flex items-center justify-between px-4 h-16 safe-top">
    <a href="dashboard.html" class="w-10 h-10 flex items-center justify-center rounded-xl hover:bg-gray-100 btn-press"><span class="material-symbols-rounded text-gray-700 text-2xl">arrow_back</span></a>
    <span class="font-bold text-base" style="font-family:'Plus Jakarta Sans',sans-serif;">Users</span>
    <div class="w-10"></div>
  </div>
</header>

<div class="px-4 py-3">
  <input type="text" id="searchUsers" placeholder="Search users..." class="w-full px-3 py-2.5 rounded-xl border border-gray-200 text-sm focus:outline-none focus:border-orange-400" oninput="renderUsers()">
</div>

<div class="px-4 overflow-x-auto">
  <table class="w-full text-sm">
    <thead><tr class="text-gray-400 border-b border-gray-100"><th class="text-left py-2 pr-2">Name</th><th class="text-left py-2 px-2">Email</th><th class="text-center py-2 px-2">Orders</th><th class="text-center py-2">Action</th></tr></thead>
    <tbody id="usersList"></tbody>
  </table>
</div>

<script>
  document.addEventListener('contextmenu',e=>e.preventDefault());
  document.addEventListener('selectstart',e=>e.preventDefault());
  document.addEventListener('keydown',e=>{if(e.ctrlKey&&['u','s','a','c','p'].includes(e.key.toLowerCase()))e.preventDefault();if(e.key==='F12')e.preventDefault();});

  if(localStorage.getItem('raja_admin_session')!=='true')window.location.href='login.html';

  const STORE={users:'raja_users',orders:'raja_orders'};
  function getLS(k){try{return JSON.parse(localStorage.getItem(k))}catch{return null}}

  function renderUsers(){
    const search=document.getElementById('searchUsers').value.toLowerCase();
    let users=getLS(STORE.users)||[];
    const orders=getLS(STORE.orders)||[];
    if(search)users=users.filter(u=>u.name?.toLowerCase().includes(search)||u.email?.toLowerCase().includes(search));
    const list=document.getElementById('usersList');
    if(users.length===0){list.innerHTML='<tr><td colspan="4" class="text-center py-8 text-gray-400">No users found</td></tr>';return;}
    list.innerHTML=users.map(u=>{
      const userOrders=orders.filter(o=>o.user_id===u.email);
      return `<tr class="border-b border-gray-50"><td class="py-3 pr-2"><div class="flex items-center gap-2"><div class="w-8 h-8 rounded-full flex items-center justify-center text-white text-xs font-bold" style="background:var(--primary);">${(u.name||'U').charAt(0).toUpperCase()}</div><span class="text-sm font-medium">${u.name||'N/A'}</span></div></td><td class="py-3 px-2 text-xs text-gray-500">${u.email||''}</td><td class="py-3 px-2 text-center font-medium">${userOrders.length}</td><td class="py-3 text-center"><button onclick="viewUserOrders('${u.email}')" class="text-orange-500 text-xs font-medium">View Orders</button></td></tr>`;
    }).join('');
  }

  function viewUserOrders(email){
    const userOrders=(getLS(STORE.orders)||[]).filter(o=>o.user_id===email);
    if(userOrders.length===0){alert('No orders for this user.');return;}
    alert(userOrders.map(o=>`${o.id} — ₹${o.total} — ${o.status}`).join('\n'));
  }

  renderUsers();
</script>
</body>
</html>
