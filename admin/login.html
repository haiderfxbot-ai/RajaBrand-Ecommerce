<!DOCTYPE html>
<html lang="en" class="select-none overflow-x-hidden">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Admin Login — Raja Brand</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{--primary:#FF6B35;--primary-dark:#E55A25;--primary-light:#FFE0D6;--secondary:#1A1A2E;--surface:#FFFFFF;--surface-variant:#F8F9FA;--on-surface:#1C1C1E;--outline:#E0E0E0;--success:#34C759;--warning:#FF9500;--error:#FF3B30;--info:#007AFF;}
    *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;font-family:'DM Sans',sans-serif;}
    body{background:linear-gradient(135deg,#1A1A2E 0%,#2D2D44 100%);color:var(--on-surface);font-size:14px;line-height:1.6;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
    h1,h2,h3,h4,h5,h6{font-family:'Plus Jakarta Sans',sans-serif;}
    .material-symbols-rounded{font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24;vertical-align:middle;}
    .btn-press:active{transform:scale(0.96);}
    @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
    .shake{animation:shake .4s ease;}
  </style>
</head>
<body>
<div class="w-full max-w-sm">
  <div class="text-center mb-8">
    <div class="flex items-center justify-center gap-2 mb-3">
      <span class="text-3xl font-extrabold tracking-tight text-white" style="font-family:'Plus Jakarta Sans',sans-serif;">RAJA</span>
      <span class="text-white/60 text-xl font-light" style="font-family:'Plus Jakarta Sans',sans-serif;">Admin</span>
    </div>
    <p class="text-white/40 text-sm">Sign in to manage your store</p>
  </div>

  <div class="p-6 rounded-2xl bg-white shadow-2xl">
    <h2 class="text-lg font-bold mb-5 text-center" style="font-family:'Plus Jakarta Sans',sans-serif;">Admin Login</h2>
    <div class="space-y-4">
      <div>
        <label class="text-sm font-medium mb-1 block">Username</label>
        <input type="text" id="adminUser" placeholder="admin" class="w-full px-3 py-2.5 rounded-xl border border-gray-200 text-sm focus:outline-none focus:border-orange-400">
      </div>
      <div>
        <label class="text-sm font-medium mb-1 block">Password</label>
        <input type="password" id="adminPass" placeholder="••••••••" class="w-full px-3 py-2.5 rounded-xl border border-gray-200 text-sm focus:outline-none focus:border-orange-400">
      </div>
      <button onclick="adminLogin()" id="adminLoginBtn" class="w-full py-3 rounded-xl text-sm font-bold text-white btn-press flex items-center justify-center gap-2" style="background:var(--primary);">Login <span class="material-symbols-rounded">arrow_forward</span></button>
      <p id="adminError" class="text-xs text-center hidden" style="color:var(--error);"></p>
    </div>
    <div class="mt-4 text-center">
      <a href="../index.html" class="text-xs text-gray-400 hover:text-orange-500">&larr; Back to Store</a>
    </div>
  </div>
</div>

<script>
  document.addEventListener('contextmenu',e=>e.preventDefault());
  document.addEventListener('selectstart',e=>e.preventDefault());
  document.addEventListener('keydown',e=>{if(e.ctrlKey&&['u','s','a','c','p'].includes(e.key.toLowerCase()))e.preventDefault();if(e.key==='F12')e.preventDefault();});

  const adminSessionKey='raja_admin_session';

  if(localStorage.getItem(adminSessionKey)==='true'){window.location.href='dashboard.html';}

  function adminLogin(){
    const user=document.getElementById('adminUser').value.trim();
    const pass=document.getElementById('adminPass').value;
    const err=document.getElementById('adminError');

    if(user==='admin'&&pass==='admin123'){
      localStorage.setItem(adminSessionKey,'true');
      err.classList.add('hidden');
      document.getElementById('adminLoginBtn').innerHTML='<span class="material-symbols-rounded animate-spin">refresh</span> Logging in...';
      document.getElementById('adminLoginBtn').disabled=true;
      setTimeout(()=>window.location.href='dashboard.html',500);
    }else{
      err.textContent='Invalid username or password';
      err.classList.remove('hidden');
      document.querySelector('.bg-white').classList.add('shake');
      setTimeout(()=>document.querySelector('.bg-white').classList.remove('shake'),500);
    }
  }

  document.getElementById('adminPass').addEventListener('keydown',e=>{if(e.key==='Enter')adminLogin();});
</script>
</body>
</html>
